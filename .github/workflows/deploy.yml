# Firebase Hosting 배포.
# main에 푸시하면 검사와 빌드를 거쳐 실제 사이트에 올리고, PR을 열면 7일짜리 미리보기 주소에 올린다.
# 처음 한 번: 배포용 서비스 계정 키(JSON)를 저장소 Secrets에
# FIREBASE_SERVICE_ACCOUNT_QUANTUMMECHANICS_9AD00 이름으로 넣는다. 키가 없으면 배포 단계만 건너뛴다.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUANTUMMECHANICS_9AD00 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:style
      - run: npm run build
      - name: 실제 사이트에 올리기
        if: env.HAS_KEY == 'true' && github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUANTUMMECHANICS_9AD00 }}
          projectId: quantummechanics-9ad00
          target: app
          channelId: live
      - name: 미리보기 주소에 올리기
        if: env.HAS_KEY == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUANTUMMECHANICS_9AD00 }}
          projectId: quantummechanics-9ad00
          target: app
          expires: 7d
