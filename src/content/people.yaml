# 인물 카드. 레슨 본문에서는 이해에 필요한 사람만 등장하고, 나머지 이야기는 여기에 둔다.
- id: galileo
  name: 갈릴레오 갈릴레이
  original: Galileo Galilei
  born: 1564
  died: 1642
  role: 이탈리아의 물리학자, 천문학자
  summary: "경사면에서 공을 굴려, 떨어지는 물체가 일정하게 빨라진다는 것을 보였어요. 마찰이 없으면 움직이는 물체는 계속 움직일 거라고 생각했고, 이 생각이 관성이라는 개념의 출발점이 됐어요. 직접 만든 망원경으로 목성 둘레를 도는 위성 네 개를 찾아냈어요."
  lessons: [4, 5, 9, 96]
- id: huygens
  name: 크리스티안 하위헌스
  original: Christiaan Huygens
  born: 1629
  died: 1695
  role: 네덜란드의 물리학자, 수학자
  summary: "1656년 진자시계를 처음 만들었어요. 빛이 파동이라고 주장했고, 1690년 『빛에 관한 논고』에서 파동이 퍼지는 모습을 \"앞선 물결의 모든 점이 새 물결을 내보낸다\"는 방식으로 설명했어요."
  lessons: [9, 15]
- id: newton
  name: 아이작 뉴턴
  original: Isaac Newton
  born: 1643
  died: 1727
  role: 영국의 물리학자, 수학자
  summary: "1687년 『자연철학의 수학적 원리』(프린키피아)에 운동 법칙과 만유인력 법칙을 담아 펴냈어요. 사람들은 이 책의 물리학으로 200년 넘게 거의 모든 움직임을 설명했어요. 1660년대에는 프리즘으로 햇빛을 여러 색으로 나눈 뒤 다시 합쳐서, 흰빛이 여러 색의 빛이 섞인 것임을 보였어요."
  lessons: [1, 5, 7, 8, 17]
  sources: ["Westfall, R. S. Never at Rest: A Biography of Isaac Newton (1980)"]
- id: laplace
  name: 피에르시몽 라플라스
  original: Pierre-Simon Laplace
  born: 1749
  died: 1827
  role: 프랑스의 수학자, 천문학자
  summary: "뉴턴의 법칙으로 행성들의 움직임을 정밀하게 계산했어요. 1814년 『확률에 관한 철학적 시론』에는, 어느 순간 자연의 모든 힘과 모든 것의 위치를 아는 지성이 있다면 그 지성에게는 미래도 과거처럼 눈앞에 있을 거라고 썼어요. 훗날 사람들은 이 지성을 '라플라스의 악마'라고 불렀어요."
  lessons: [8, 94]
  sources: ["Laplace, P.-S. Essai philosophique sur les probabilités (1814)"]
- id: coulomb
  name: 샤를오귀스탱 드 쿨롱
  original: Charles-Augustin de Coulomb
  born: 1736
  died: 1806
  role: 프랑스의 물리학자, 공학자
  summary: "1785년 가는 실이 비틀리는 정도로 아주 작은 힘을 재는 비틀림 저울을 써서, 전기를 띤 두 공 사이의 힘이 거리의 제곱에 반비례한다는 것을 보였어요. 전하의 단위 쿨롱(C)은 쿨롱의 이름에서 왔어요."
  lessons: [18]
- id: young
  name: 토머스 영
  original: Thomas Young
  born: 1773
  died: 1829
  role: 영국의 의사, 물리학자
  summary: "1800년대 초, 두 틈을 지난 빛이 밝고 어두운 줄무늬를 만든다는 것을 보여서 빛이 파동이라는 강력한 증거를 내놓았어요. 줄무늬 간격으로 빛의 파장을 처음 계산했어요. 로제타석의 이집트 문자를 읽어 내는 일에도 힘을 보탰어요."
  lessons: [14, 16]
- id: poisson
  name: 시메옹 드니 푸아송
  original: Siméon Denis Poisson
  born: 1781
  died: 1840
  role: 프랑스의 수학자
  summary: "빛이 파동이라는 프레넬의 이론대로라면, 둥근 원판의 그림자 한가운데에 밝은 점이 생겨야 한다는 것을 계산해 냈어요. 푸아송은 그런 일은 있을 수 없다고 보고, 이 계산을 이론이 틀렸다는 근거로 내놓았어요."
  lessons: [15]
- id: arago
  name: 프랑수아 아라고
  original: François Arago
  born: 1786
  died: 1853
  role: 프랑스의 물리학자
  summary: "푸아송이 말한 원판 그림자 한가운데의 밝은 점을 실험으로 실제로 찾아냈어요. 이 점은 지금 '아라고의 점' 또는 '푸아송의 점'이라고 불러요."
  lessons: [15]
- id: fresnel
  name: 오귀스탱 프레넬
  original: Augustin-Jean Fresnel
  born: 1788
  died: 1827
  role: 프랑스의 물리학자, 공학자
  summary: "빛의 회절을 파동 이론으로 정밀하게 계산한 논문을 1818년 프랑스 과학 아카데미 현상 공모에 냈어요. 얇은 띠를 겹쳐 만든 등대 렌즈(프레넬 렌즈)도 고안했어요."
  lessons: [15]
- id: faraday
  name: 마이클 패러데이
  original: Michael Faraday
  born: 1791
  died: 1867
  role: 영국의 물리학자, 화학자
  summary: "1831년 자석을 움직이면 전선에 전기가 흐른다는 것(전자기 유도)을 발견했어요. 전기와 자기의 힘이 공간을 채운 '힘의 선'을 따라 전해진다고 생각했고, 이 생각이 맥스웰의 이론으로 이어졌어요."
  lessons: [19, 121]
- id: maxwell
  name: 제임스 클러크 맥스웰
  original: James Clerk Maxwell
  born: 1831
  died: 1879
  role: 스코틀랜드의 물리학자
  summary: "전기와 자기에 관한 법칙들을 몇 개의 방정식으로 묶었어요. 이 방정식으로 전기와 자기의 흔들림이 1초에 약 30만 km씩 퍼져 나간다는 것을 계산했는데, 이 값이 이미 잰 빛의 속력과 같았어요. 그래서 1865년 빛이 전자기파라고 결론지었어요."
  lessons: [19]
- id: hertz
  name: 하인리히 헤르츠
  original: Heinrich Hertz
  born: 1857
  died: 1894
  role: 독일의 물리학자
  summary: "1887년 무렵 실험실에서 불꽃을 튀기는 장치로 전파를 만들고, 몇 미터 떨어진 곳에서 그 전파를 잡아냈어요. 맥스웰이 예측한 전자기파가 실제로 있다는 것을 이렇게 보였어요. 진동수의 단위 헤르츠(Hz)는 헤르츠의 이름에서 왔어요."
  lessons: [9, 19]
- id: kelvin
  name: 켈빈 경 (윌리엄 톰슨)
  original: William Thomson, Lord Kelvin
  born: 1824
  died: 1907
  role: 영국의 물리학자
  summary: "절대온도를 제안했고, 그 단위 켈빈(K)에 이름을 남겼어요. 1900년 4월 27일 런던 왕립연구소 강연에서, 열과 빛의 이론에 드리운 두 조각의 구름을 이야기했어요. \"이제 물리학에서 새로 발견할 것은 없다\"는 말이 켈빈의 말로 자주 인용되지만, 켈빈이 그렇게 말했다는 기록은 확인되지 않아요."
  lessons: [23, 31]
- id: boltzmann
  name: 루트비히 볼츠만
  original: Ludwig Boltzmann
  born: 1844
  died: 1906
  role: 오스트리아의 물리학자
  summary: "기체의 온도와 압력을 수많은 분자의 움직임과 확률로 설명했어요. 원자가 실제로 있다고 보지 않던 학자들과 오래 논쟁했어요."
  lessons: [22, 25]
- id: perrin
  name: 장 페랭
  original: Jean Perrin
  born: 1870
  died: 1942
  role: 프랑스의 물리학자
  summary: "1908년부터 물에 뜬 작은 알갱이들이 제멋대로 흔들리는 브라운 운동을 정밀하게 재서, 아인슈타인이 원자가 있다고 가정하고 계산한 값과 맞는다는 것을 보였어요. 원자가 실제로 있는지를 두고 이어진 오랜 논쟁이 이 측정으로 끝났어요. 1926년 노벨 물리학상을 받았어요."
  lessons: [22]
- id: planck
  name: 막스 플랑크
  original: Max Planck
  born: 1858
  died: 1947
  role: 독일의 물리학자
  summary: "베를린 대학의 이론물리학 교수였어요. 1900년 뜨거운 물체가 내는 빛의 세기를 설명하려고, 에너지가 정해진 크기의 덩어리로만 오간다는 가정을 세웠어요. 플랑크 자신은 이 가정을 계산을 위한 임시방편으로 여겼지만, 이 가정이 양자역학의 출발점이 됐어요. 1918년 노벨 물리학상을 받았어요."
  lessons: [32, 33]
  sources: ["Kragh, H. Max Planck: the reluctant revolutionary, Physics World (2000)"]
- id: thomson
  name: 조지프 존 톰슨
  original: J. J. Thomson
  born: 1856
  died: 1940
  role: 영국의 물리학자
  summary: "1897년 음극선이 원자보다 훨씬 가볍고 음전하를 띤 알갱이의 흐름이라는 것을 보였어요. 이 알갱이가 전자예요. 1906년 노벨 물리학상을 받았어요. 아들 조지 패짓 톰슨은 전자가 파동처럼 회절한다는 것을 보여서 1937년 노벨상을 받았어요."
  lessons: [37, 49]
- id: einstein
  name: 알베르트 아인슈타인
  original: Albert Einstein
  born: 1879
  died: 1955
  role: 독일 태생의 물리학자
  summary: "스위스 베른의 특허청에서 일하던 1905년, 광전 효과, 브라운 운동, 특수상대성이론에 관한 논문을 잇달아 냈어요. 1915년 일반상대성이론을 완성했어요. 1921년 노벨 물리학상은 광전 효과 연구로 받았어요. 양자역학을 확률로 해석하는 데에는 끝까지 만족하지 않았어요."
  lessons: [22, 35, 85, 88, 97, 103, 113]
- id: rutherford
  name: 어니스트 러더퍼드
  original: Ernest Rutherford
  born: 1871
  died: 1937
  role: 뉴질랜드 출신의 물리학자
  summary: "제자 가이거와 마스든이 한 금박 실험(1909)의 결과를 분석해서, 1911년 원자 한가운데에 아주 작고 무거운 원자핵이 있다고 발표했어요. 1908년 노벨 화학상을 받았어요."
  lessons: [39]
- id: millikan
  name: 로버트 밀리컨
  original: Robert Millikan
  born: 1868
  died: 1953
  role: 미국의 물리학자
  summary: "기름방울 실험(1909)으로 전하의 최소 단위를 쟀어요. 아인슈타인의 광전 효과 이론이 틀렸다고 보고 정밀하게 측정했는데, 결과는 오히려 그 이론이 맞다는 것을 확인해 주었어요(1916). 1923년 노벨 물리학상을 받았어요."
  lessons: [35, 38]
- id: bohr
  name: 닐스 보어
  original: Niels Bohr
  born: 1885
  died: 1962
  role: 덴마크의 물리학자
  summary: "1913년 원자 속 전자가 정해진 에너지에만 있을 수 있다는 모형을 내놓았어요. 코펜하겐에 연구소를 세워 양자역학 연구의 중심지로 만들었고, 양자역학을 어떻게 해석할지를 두고 아인슈타인과 오래 논쟁했어요. 1947년 기사 작위를 받을 때 문장에 \"대립하는 것은 서로 보완한다\"는 라틴어 문구를 새겼어요. 1922년 노벨 물리학상을 받았어요."
  lessons: [44, 51, 84, 85, 86, 120]
- id: noether
  name: 에미 뇌터
  original: Emmy Noether
  born: 1882
  died: 1935
  role: 독일의 수학자
  summary: "1918년, 물리 법칙이 어떤 대칭을 가지면 그에 맞는 보존 법칙이 반드시 있다는 정리를 증명했어요. 여성이라는 이유로 오랫동안 정식 교수 자리를 얻지 못했어요."
  lessons: [5, 125]
- id: born
  name: 막스 보른
  original: Max Born
  born: 1882
  died: 1970
  role: 독일의 물리학자
  summary: "1926년 파동함수 크기의 제곱이 그 자리에서 입자를 찾을 확률을 준다고 해석했어요. 이 생각은 논문의 각주에 처음 적혔어요. 1954년 노벨 물리학상을 받았어요."
  lessons: [56]
- id: schrodinger
  name: 에르빈 슈뢰딩거
  original: Erwin Schrödinger
  born: 1887
  died: 1961
  role: 오스트리아의 물리학자
  summary: "1926년 파동함수가 따르는 방정식을 발표했어요. 1935년에는 상자 속 고양이 사고 실험으로 양자역학의 측정 문제를 드러냈어요. 1933년 노벨 물리학상을 받았어요."
  lessons: [65, 87]
- id: debroglie
  name: 루이 드브로이
  original: Louis de Broglie
  born: 1892
  died: 1987
  role: 프랑스의 물리학자
  summary: "1924년 박사 논문에서 전자 같은 물질도 파동의 성질을 가진다고 제안했어요. 1929년 노벨 물리학상을 받았어요."
  lessons: [47]
- id: pauli
  name: 볼프강 파울리
  original: Wolfgang Pauli
  born: 1900
  died: 1958
  role: 오스트리아의 물리학자
  summary: "1925년 두 전자가 똑같은 상태에 있을 수 없다는 배타 원리를 내놓았어요. 1945년 노벨 물리학상을 받았어요."
  lessons: [73]
- id: heisenberg
  name: 베르너 하이젠베르크
  original: Werner Heisenberg
  born: 1901
  died: 1976
  role: 독일의 물리학자
  summary: "1925년 행렬역학을, 1927년 불확정성 원리를 발표했어요. 1932년 노벨 물리학상을 받았어요. 제2차 세계대전 동안 독일의 핵 연구를 이끌었고, 1941년 코펜하겐으로 보어를 찾아갔어요."
  lessons: [61, 84, 120]
- id: dirac
  name: 폴 디랙
  original: Paul Dirac
  born: 1902
  died: 1984
  role: 영국의 물리학자
  summary: "1928년 상대성이론과 맞는 전자의 방정식을 세우고, 이 방정식에서 반물질이 있다는 것을 예측했어요. 지금 양자역학에서 쓰는 표기법 상당수를 만들었어요. 1933년 노벨 물리학상을 받았어요."
  lessons: [79, 101]
- id: fermi
  name: 엔리코 페르미
  original: Enrico Fermi
  born: 1901
  died: 1954
  role: 이탈리아의 물리학자
  summary: "1934년 로마에서 느린 중성자로 실험했고, 1942년 시카고에서 연쇄 반응을 제어하는 원자로를 처음으로 가동했어요. 적은 정보로 답의 자릿수를 맞히는 어림 계산을 잘했어요. 트리니티 실험 때는 떨어뜨린 종잇조각이 날아간 거리로 폭발의 위력을 어림했어요. 1938년 노벨 물리학상을 받았어요."
  lessons: [3, 111, 114, 116]
- id: szilard
  name: 레오 실라르드
  original: Leo Szilard
  born: 1898
  died: 1964
  role: 헝가리 출신의 물리학자
  summary: "1933년 중성자로 연쇄 반응을 일으킬 수 있다는 생각을 했어요. 1939년 아인슈타인과 함께 미국 대통령에게 원자폭탄이 가능하다고 알리는 편지를 썼어요. 1945년 7월에는 원자폭탄을 경고 없이 일본 도시에 쓰지 말자는 청원을 돌렸어요."
  lessons: [111, 113, 117]
- id: meitner
  name: 리제 마이트너
  original: Lise Meitner
  born: 1878
  died: 1968
  role: 오스트리아의 물리학자
  summary: "1938년 말 조카 오토 프리슈와 함께, 우라늄 원자핵이 둘로 쪼개진다고 해석하고 그때 나오는 에너지를 계산했어요. 1944년 노벨 화학상은 함께 연구하던 오토 한만 받았어요."
  lessons: [112]
- id: oppenheimer
  name: J. 로버트 오펜하이머
  original: J. Robert Oppenheimer
  born: 1904
  died: 1967
  role: 미국의 물리학자
  summary: "1943년부터 로스앨러모스 연구소를 이끌며 원자폭탄 개발을 지휘했어요. 전쟁 뒤에는 수소폭탄 개발에 반대했고, 1954년 청문회 끝에 보안 인가를 잃었어요. 2022년 미국 에너지부가 그 결정을 취소했어요."
  lessons: [115, 116, 119]
- id: feynman
  name: 리처드 파인먼
  original: Richard Feynman
  born: 1918
  died: 1988
  role: 미국의 물리학자
  summary: "양자전기역학을 세운 사람 가운데 하나예요. 입자들이 주고받는 작용을 그림으로 계산하는 방법을 고안했어요. 1965년 노벨 물리학상을 받았어요."
  lessons: [50, 55, 122]
- id: chandrasekhar
  name: 수브라마니안 찬드라세카르
  original: Subrahmanyan Chandrasekhar
  born: 1910
  died: 1995
  role: 인도 출신의 천체물리학자
  summary: "1930년 인도에서 영국으로 가는 배 위에서, 죽은 별이 스스로를 버틸 수 있는 질량에 한계가 있다는 것을 계산했어요. 1983년 노벨 물리학상을 받았어요."
  lessons: [110]
- id: bell
  name: 존 스튜어트 벨
  original: John Stewart Bell
  born: 1928
  died: 1990
  role: 북아일랜드의 물리학자
  summary: "1964년, 측정하기 전부터 결과가 정해져 있고 멀리 떨어진 곳끼리 곧바로 영향을 주지 않는다면 실험 결과가 반드시 따라야 하는 부등식을 이끌어 냈어요. 그 뒤의 실험들은 자연이 이 부등식을 깬다는 것을 보였어요."
  lessons: [90, 91]
- id: rotblat
  name: 조지프 로트블랫
  original: Joseph Rotblat
  born: 1908
  died: 2005
  role: 폴란드 출신의 물리학자
  summary: "맨해튼 프로젝트에 참여했다가, 1944년 말 독일이 원자폭탄을 만들지 못한다는 것이 분명해지자 스스로 프로젝트를 떠났어요. 핵무기에 반대하는 과학자들의 모임인 퍼그워시 회의를 이끌었고, 1995년 노벨 평화상을 받았어요."
  lessons: [118]

# ══ 세션별로 새 인물을 더하는 자리 ═══════════════════════════════
# 위에 있는 항목은 세션 3만 고친다(문장을 해요체로). 다른 세션은 자기 자리 아래에만 더한다.
# 이미 있는 id인지 먼저 찾아보고, 있으면 새로 만들지 않는다(lessons를 더해야 하면 끝 보고에 적는다).

# ── 세션 1 (21~36강) ──
# (여기 아래에 더한다)

# ── 세션 2 (37~63강) ──
# (여기 아래에 더한다)
- id: braun
  name: 카를 페르디난트 브라운
  original: Karl Ferdinand Braun
  born: 1850
  died: 1918
  role: 독일의 물리학자
  summary: 1897년, 음극선이 화면에 닿는 자리로 전기의 변화를 그려 보이는 유리관을 만들었어요. 우리나라와 일본에서 이런 관을 브라운관이라고 부르는 것은 그의 이름에서 왔어요. 무선 통신을 발전시킨 공로로 1909년 노벨 물리학상을 받았어요.
  lessons: [37]
- id: fletcher
  name: 하비 플레처
  original: Harvey Fletcher
  born: 1884
  died: 1981
  role: 미국의 물리학자
  summary: 시카고 대학의 대학원생으로 로버트 밀리컨과 함께 기름방울 실험을 했어요. 그 뒤 벨 연구소에서 소리와 청각을 연구했어요.
  lessons: [38]
- id: geiger
  name: 한스 가이거
  original: Hans Geiger
  born: 1882
  died: 1945
  role: 독일의 물리학자
  summary: 맨체스터 대학에서 러더퍼드의 조수로 일하며, 1909년 어니스트 마스든과 함께 금속박에 쏜 알파 입자 가운데 일부가 되튕겨 나온다는 걸 발견했어요. 1913년에는 러더퍼드의 계산을 측정으로 확인했어요. 방사선을 세는 가이거 계수기에 이름이 남아 있어요.
  lessons: [39]
- id: marsden
  name: 어니스트 마스든
  original: Ernest Marsden
  born: 1889
  died: 1970
  role: 영국 출신의 물리학자
  summary: 맨체스터 대학의 학부생이던 1909년, 한스 가이거와 함께 알파 입자가 금속박에서 크게 휘어 되돌아오는 것을 처음 셌어요. 뒤에 뉴질랜드로 건너가 그곳의 과학 연구를 이끌었어요.
  lessons: [39]
- id: larmor
  name: 조지프 라머
  original: Joseph Larmor
  born: 1857
  died: 1942
  role: 아일랜드 출신의 물리학자
  summary: 1897년, 가속하는 전하가 1초에 빛으로 내보내는 에너지를 계산했어요. 그 양은 가속도의 제곱에 비례해요. 이 계산을 원자핵 둘레를 도는 전자에 쓰면, 원자는 1000억분의 1초쯤 만에 무너져야 해요.
  lessons: [41]
- id: fraunhofer
  name: 요제프 폰 프라운호퍼
  original: Joseph von Fraunhofer
  born: 1787
  died: 1826
  role: 독일의 광학 기술자, 물리학자
  summary: 렌즈를 만드는 기술자로 일하며, 1814년 햇빛의 스펙트럼에서 가는 검은 선을 500개 넘게 찾아 자리를 기록했어요. 이 선들은 지금도 프라운호퍼 선이라고 불려요.
  lessons: [42]
- id: kirchhoff
  name: 구스타프 키르히호프
  original: Gustav Kirchhoff
  born: 1824
  died: 1887
  role: 독일의 물리학자
  summary: 1859년, 원소의 기체는 뜨거울 때 내는 바로 그 진동수의 빛을 흡수한다는 것을 보였어요. 그래서 햇빛의 검은 선으로 태양의 성분을 읽을 수 있게 됐어요. 로베르트 분젠과 함께 선 스펙트럼으로 원소를 가려내는 방법을 세웠어요.
  lessons: [42]
- id: bunsen
  name: 로베르트 분젠
  original: Robert Bunsen
  born: 1811
  died: 1899
  role: 독일의 화학자
  summary: 그을음이 거의 없는 뜨거운 불꽃을 내는 버너를 널리 퍼뜨렸고, 키르히호프와 함께 그 불꽃 속 원소의 선 스펙트럼을 연구했어요. 1860년 세슘을, 1861년 루비듐을 선 스펙트럼으로 발견했어요.
  lessons: [42]
- id: janssen
  name: 쥘 장센
  original: Jules Janssen
  born: 1824
  died: 1907
  role: 프랑스의 천문학자
  summary: 1868년 8월 18일 인도에서 개기일식을 관측하며, 태양 가장자리의 붉은 불꽃에서 밝은 노란 선을 봤어요. 뒤에 이 선은 헬륨의 선으로 밝혀졌어요.
  lessons: [42]
- id: lockyer
  name: 노먼 로키어
  original: Norman Lockyer
  born: 1836
  died: 1920
  role: 영국의 천문학자
  summary: 1868년 일식이 아닐 때에도 태양 가장자리의 스펙트럼을 관측하는 방법을 찾았고, 그 노란 선이 아직 모르는 원소의 선이라고 보았어요. 그리스어로 태양을 뜻하는 말을 따 헬륨이라는 이름을 붙였어요. 과학 잡지 『네이처』를 만든 사람이기도 해요.
  lessons: [42]
- id: balmer
  name: 요한 야코프 발머
  original: Johann Jakob Balmer
  born: 1825
  died: 1898
  role: 스위스의 수학 교사
  summary: 바젤의 여학교에서 수학을 가르쳤어요. 1885년 예순 살에, 수소가 내는 네 선의 파장이 모두 364.56 nm × n² ÷ (n² − 4)라는 하나의 식에 맞는다는 것을 찾아냈어요. 왜 그런지는 모른 채 세상을 떠났고, 그 까닭은 1913년 보어가 설명했어요.
  lessons: [43]

# ── 세션 3 (64~83강, 106~110강) ──
# (여기 아래에 더한다)
- id: gamow
  name: 조지 가모프
  original: George Gamow
  born: 1904
  died: 1968
  role: 러시아 제국 출신의 미국 물리학자
  summary: 1928년 괴팅겐에 머물 때, 원자핵이 알파 입자를 내보내는 일을 터널 효과로 설명했어요. 알파 입자의 에너지가 조금만 달라도 내보내는 데 걸리는 시간이 엄청나게 달라진다는 것까지 계산으로 맞혔어요. 1948년에는 제자 랠프 앨퍼와 함께 우주 초기에 가벼운 원소가 만들어졌다는 생각을 내놓았어요.
  lessons: [68]
  sources: ["Gamow, G. Zur Quantentheorie des Atomkernes, Zeitschrift für Physik 51, 204 (1928)"]
- id: binnig
  name: 게르트 비니히
  original: Gerd Binnig
  born: 1947
  role: 독일의 물리학자
  summary: 1981년 IBM 취리히 연구소에서 하인리히 로러와 함께 주사 터널링 현미경을 처음 작동시켰어요. 바늘과 표면 사이를 터널 효과로 건너는 전자를 재서 원자 하나하나의 높낮이를 읽는 장치예요. 1986년 노벨 물리학상을 받았어요.
  lessons: [68]
- id: rohrer
  name: 하인리히 로러
  original: Heinrich Rohrer
  born: 1933
  died: 2013
  role: 스위스의 물리학자
  summary: IBM 취리히 연구소에서 게르트 비니히와 함께 주사 터널링 현미경을 만들었어요(1981). 1986년 노벨 물리학상을 받았어요.
  lessons: [68]

# ── 세션 4 (84~105강, 111~120강) ──
# (여기 아래에 더한다)
- id: wigner
  name: 유진 위그너
  original: Eugene Wigner
  born: 1902
  died: 1995
  role: 헝가리 출신의 미국 물리학자
  summary: 원자핵과 대칭에 관한 연구로 1963년 노벨 물리학상을 받았어요. 1939년 실라르드와 함께 아인슈타인을 찾아가 루스벨트 대통령에게 보낼 편지를 의논했어요. 1961년에는 실험실 안의 친구와 문밖의 관찰자를 견주는 "위그너의 친구" 사고 실험으로 측정 문제를 날카롭게 만들었어요.
  lessons: [87, 113]
- id: clauser
  name: 존 클라우저
  original: John F. Clauser
  born: 1942
  role: 미국의 실험물리학자
  summary: 1969년 동료들과 함께 벨 부등식을 실제 실험 장비로 시험할 수 있는 꼴로 다듬었어요. 1972년 스튜어트 프리드먼과 함께 얽힌 광자 쌍으로 첫 벨 실험을 해서, 벨 부등식이 깨진다는 결과를 얻었어요. 2022년 노벨 물리학상을 받았어요.
  lessons: [90, 91]
- id: aspect
  name: 알랭 아스페
  original: Alain Aspect
  born: 1947
  role: 프랑스의 실험물리학자
  summary: 1982년 파리 근교 오르세에서, 광자가 날아가는 동안 측정 방향을 빠르게 바꾸는 벨 실험을 했어요. 한쪽의 방향 선택이 빛의 속력으로도 다른 쪽에 닿을 수 없게 만들어 국소성 빈틈을 좁혔어요. 2022년 노벨 물리학상을 받았어요.
  lessons: [91]
- id: bohm
  name: 데이비드 봄
  original: David Bohm
  born: 1917
  died: 1992
  role: 미국 태생의 물리학자
  summary: 1951년 교과서에서 EPR 사고 실험을 두 입자의 스핀으로 바꿔 훨씬 따라가기 쉽게 만들었어요. 1952년에는 입자가 늘 정해진 자리에 있으면서도 양자역학과 같은 예측을 내는 이론을 내놓았어요. 이 이론에서 멀리 떨어진 입자들은 곧장 서로 영향을 주고받아요.
  lessons: [88, 92, 93]

# ── 세션 5 (121~137강) ──
# (여기 아래에 더한다)
