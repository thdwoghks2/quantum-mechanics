  summary: 1927년, 일반상대성이론으로 우주가 커지고 있다고 보고, 먼 은하일수록 빨리 멀어진다는 관계를 허블보다 먼저 내놓았어요. 우주가 아주 작은 '처음 원자'에서 시작했다는 생각도 처음 냈어요.
