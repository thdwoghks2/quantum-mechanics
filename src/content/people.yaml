  original: Robert Woodrow Wilson
  born: 1936
  role: 미국의 전파천문학자
  summary: 아노 펜지어스와 함께 벨 연구소의 나팔 모양 안테나로 우주 배경 복사를 찾았어요. 안테나 속 비둘기를 내보내고 닦아 내도 잡음이 그대로라는 것을 확인했어요.
  lessons: [126]
  sources:
    - "Penzias, A. A. & Wilson, R. W. The Astrophysical Journal 142, 419 (1965)"
- id: hubble
  name: 에드윈 허블
  original: Edwin Hubble
  born: 1889
  died: 1953
  role: 미국의 천문학자
