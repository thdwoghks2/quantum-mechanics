# 개념 카드. 강에서 <Concept id="…" />로 보여 주고, 용어집 페이지의 '개념' 칸에도 모인다.
#
# name   이름          core   핵심 한 문장
# why    왜 필요한가    steps  이해 단계 2~5개 (어려운 개념을 나눈 순서)
# wrong  흔한 오해 [{ wrong, right }]
# terms  관련 용어 id   formulas 관련 공식 id
# taughtIn 처음 배우는 강

- id: inertia-idea
  name: 관성
  core: 아무것도 방해하지 않으면 물체는 지금의 속도를 그대로 지켜요. 멈춰 있으면 멈춘 채로, 움직이면 같은 빠르기와 방향으로요.
  why: 왜 물체가 멈추는지, 왜 버스가 서면 몸이 앞으로 쏠리는지를 설명하려면 '그대로 있으려는 성질'부터 알아야 해요.
  steps:
    - 굴러가던 공이 멈추는 건 바닥과 공기가 방해하기 때문이에요.
    - 방해를 줄일수록(얼음판, 우주) 공은 더 오래 같은 빠르기로 가요.
    - 방해가 하나도 없으면 공은 끝없이 같은 속도로 가요. 이것이 관성이에요.
  wrong:
    - wrong: 움직이려면 계속 밀어야 한다.
      right: 미는 힘은 속도를 바꿀 때만 필요해요. 같은 속도를 지키는 데는 힘이 들지 않아요.
  terms: [inertia]
  formulas: []
  taughtIn: 5
