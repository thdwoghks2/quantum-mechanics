# 개념 카드. 강에서 <Concept id="…" />로 보여 주고, 용어집 페이지의 '개념' 칸에도 모인다.
#
# name   이름          core   핵심 한 문장
# why    왜 필요한가    steps  이해 단계 2~5개 (어려운 개념을 나눈 순서)
# wrong  흔한 오해 [{ wrong, right }]
# terms  관련 용어 id   formulas 관련 공식 id
# taughtIn 처음 배우는 강

- id: inertia-idea
  name: 관성
  core: 아무것도 방해하지 않으면 물체는 지금의 속도를 그대로 지켜요. 멈춰 있으면 멈춘 채로, 움직이면 같은 빠르기와 방향으로요.
  why: 왜 물체가 멈추는지, 왜 버스가 서면 몸이 앞으로 쏠리는지를 설명하려면 '그대로 있으려는 성질'부터 알아야 해요.
  steps:
    - 굴러가던 공이 멈추는 건 바닥과 공기가 방해하기 때문이에요.
    - 방해를 줄일수록(얼음판, 우주) 공은 더 오래 같은 빠르기로 가요.
    - 방해가 하나도 없으면 공은 끝없이 같은 속도로 가요. 이것이 관성이에요.
  wrong:
    - wrong: 움직이려면 계속 밀어야 한다.
      right: 미는 힘은 속도를 바꿀 때만 필요해요. 같은 속도를 지키는 데는 힘이 들지 않아요.
  terms: [inertia]
  formulas: []
  taughtIn: 5

- id: exponent-idea
  name: 지수로 크기 재기
  core: 10을 몇 번 곱했는지(지수)만 세면, 아주 큰 수와 아주 작은 수를 같은 방법으로 적고 크기를 비교할 수 있어요.
  why: 원자는 10⁻¹⁰ m, 우주는 10²⁶ m예요. 0을 일일이 세서는 이런 수를 비교할 수도, 계산할 수도 없어요.
  steps:
    - 1,000은 10을 세 번 곱한 수라서 10³으로 적어요. 지수 3은 곱한 횟수예요.
    - 지수가 1 커지면 수는 1이 아니라 10배 커져요. 10⁴는 10³의 10배예요.
    - 10으로 나눈 횟수는 −를 붙여 적어요. 10⁻³은 0.001이에요.
    - 곱하면 지수를 더하고, 나누면 지수를 빼요.
  wrong:
    - wrong: 10⁻³은 0보다 작은 수다.
      right: 10⁻³은 0.001이에요. −는 '10으로 나눈 횟수'라는 뜻이고, 수 자체는 0보다 커요.
    - wrong: 10⁶은 10⁵보다 조금 크다.
      right: 지수가 1 차이 나면 10배 차이예요. 10⁶은 10⁵의 10배예요.
  terms: [power-of-ten, exponent]
  formulas: [power-of-ten, exponent-product]
  taughtIn: 2

- id: unit-check-idea
  name: 단위로 검산하기
  core: 단위도 수처럼 곱하고 나눌 수 있어서, 식에서 나온 단위가 구하려던 양의 단위와 다르면 그 식은 틀린 거예요.
  why: 계산이 길어지면 어디서 틀렸는지 찾기 어려워요. 단위만 따라가 보면 답을 몰라도 틀린 식을 걸러 낼 수 있어요.
  steps:
    - 수끼리 계산하듯 단위끼리도 계산해요. m × m = m², m ÷ s = m/s예요.
    - 구하려는 양의 단위를 먼저 정해요. 시간이면 s, 거리면 m예요.
    - 식에서 나온 단위가 그것과 다르면 식이 틀렸어요.
    - 단위가 맞아도 앞에 붙는 숫자(2배, 절반)는 단위로 확인할 수 없어요.
  wrong:
    - wrong: 단위가 맞으면 식도 맞다.
      right: 단위 검산은 틀린 식을 걸러 줄 뿐이에요. 2 × 거리 ÷ 빠르기도 단위는 초지만 값은 두 배로 틀려요.
    - wrong: 단위가 다른 양도 더할 수 있다.
      right: m/s와 s는 더할 수 없어요. 사과 3개와 2시간을 더할 수 없는 것과 같아요.
  terms: [unit, si]
  taughtIn: 3

- id: acceleration-idea
  name: 가속도
  core: 가속도는 빠르기가 아니라 '속도가 바뀌는 빠르기'예요. 1초마다 속도가 몇 m/s씩 바뀌는지를 세요.
  why: 엘리베이터가 출발할 때나 버스가 설 때 몸이 느끼는 건 빠르기가 아니라 속도의 바뀜이에요.
  steps:
    - 속도는 빠르기에 방향을 붙인 양이에요.
    - 1초 동안 속도가 바뀐 양이 가속도예요. 단위는 m/s²예요.
    - 속도-시간 그래프에서 선의 기울기가 가속도예요. 평평하면 0이에요.
    - 느려질 때는 가속도가 음수이고, 방향만 바뀌어도 가속도가 있어요.
  wrong:
    - wrong: 빨리 달리면 가속도가 크다.
      right: 시속 300 km로 달려도 속도가 그대로면 가속도는 0이에요.
    - wrong: 느려지는 물체에는 가속도가 없다.
      right: 느려지는 것도 속도가 바뀌는 거예요. 가속도가 음수예요.
  terms: [velocity, acceleration, slope]
  formulas: [acceleration-formula]
  taughtIn: 4

- id: energy-conservation-idea
  name: 에너지 보존
  core: 에너지는 운동, 높이, 열, 빛처럼 모습만 바뀔 뿐, 모두 더한 양은 늘지도 줄지도 않아요.
  why: 힘과 가속도를 순간마다 따지지 않아도, 처음과 나중의 에너지만 비교하면 빠르기나 높이를 바로 구할 수 있어요.
  steps:
    - 움직이면 운동 에너지 ½mv², 높이 있으면 위치 에너지 mgh를 가져요.
    - 내려갈수록 위치 에너지가 줄고, 줄어든 만큼 운동 에너지가 늘어요.
    - 마찰이 있으면 일부가 열로 바뀌어요. 열까지 더하면 합은 그대로예요.
  wrong:
    - wrong: 마찰로 에너지가 사라진다.
      right: 사라지지 않고 열로 바뀌어요. 브레이크와 바퀴가 뜨거워지는 게 그 열이에요.
    - wrong: 무거운 차량이 바닥에서 더 빠르다.
      right: 위치 에너지와 운동 에너지가 모두 질량에 비례해서 질량은 지워져요. 속력은 높이로만 정해져요.
  terms: [energy, kinetic-energy, potential-energy, energy-conservation]
  formulas: [kinetic-energy-formula, potential-energy-formula, energy-conservation-formula]
  taughtIn: 6

- id: momentum-conservation-idea
  name: 운동량 보존
  core: 서로 힘을 주고받는 물체들의 운동량을 모두 더한 값은, 바깥에서 힘이 들어오지 않으면 바뀌지 않아요.
  why: 부딪히는 순간의 힘이 아무리 복잡해도, 부딪히기 전과 뒤의 운동량만 비교하면 결과를 구할 수 있어요.
  steps:
    - 운동량은 질량 × 속도이고 방향이 있어요. 마주 오는 물체의 운동량은 −예요.
    - 서로 미는 두 물체는 크기가 같고 방향이 반대인 힘을 같은 시간 동안 받아요(작용과 반작용).
    - 그래서 한쪽이 얻은 운동량만큼 다른 쪽이 잃어요. 합은 그대로예요.
  wrong:
    - wrong: 작용과 반작용은 서로 지워져서 아무 일도 안 일어난다.
      right: 두 힘은 서로 다른 물체에 작용해요. 각자 자기 물체를 움직이니 지워지지 않아요.
    - wrong: 달라붙는 충돌에서는 운동량이 줄어든다.
      right: 줄어드는 건 운동 에너지예요. 운동량의 합은 그대로예요.
  terms: [momentum, impulse, action-reaction, momentum-conservation]
  formulas: [momentum-formula, impulse-formula, momentum-conservation-formula]
  taughtIn: 7

- id: determinism-idea
  name: 결정론과 카오스
  core: 법칙과 초기 조건이 정해지면 미래는 하나로 정해져요(결정론). 그래도 처음 값의 작은 차이가 몇 배씩 불어나면(카오스) 먼 미래는 맞힐 수 없어요.
  why: 일식은 수천 년 앞을 맞히는데 날씨는 2주 앞도 어려운 까닭이 여기 있어요.
  steps:
    - 법칙에 지금의 위치와 속도를 넣으면 다음 순간이 정해지고, 되풀이하면 먼 미래까지 계산돼요.
    - 하지만 처음 값은 언제나 조금씩 틀리게 재요.
    - 카오스에서는 그 작은 오차가 몇 배씩 커져서, 계산이 곧 실제와 어긋나요.
  wrong:
    - wrong: 카오스는 법칙이 없다는 뜻이다.
      right: 법칙은 그대로예요. 작은 차이가 너무 빨리 커질 뿐이에요.
  terms: [initial-condition, determinism, chaos]
  taughtIn: 8

- id: physics-cycle-idea
  name: 법칙을 찾고, 예측하고, 고치기
  core: 물리학은 되풀이되는 일을 여러 번 보고 법칙을 찾고, 그 법칙으로 아직 보지 않은 일을 예측하고, 예측이 틀리면 법칙을 고쳐요. 법칙은 대개 중요한 것만 남긴 모형 위에서 찾아요.
  why: 물리학의 답은 '정답 목록'이 아니라 언제든 고칠 수 있는 설명이에요. 이 순서를 알면, 뒤에서 오래된 법칙이 무너지는 장면(2부, 3부)을 이해할 수 있어요.
  steps:
    - 관찰해요. 같은 조건에서 같은 일이 되풀이되는지 봐요.
    - 법칙을 적어요. 그 법칙이 맞는 조건까지 함께 적어요.
    - 예측해요. 아직 보지 않은 경우에 무슨 일이 일어날지 법칙으로 미리 말해요.
    - 확인해요. 예측이 틀리면 법칙이나 모형을 고쳐요.
  wrong:
    - wrong: 한 번 확인된 법칙은 영원히 맞다.
      right: 법칙은 지금까지 확인한 조건에서 맞을 뿐이에요. 새 조건에서 틀리면 고쳐요(1900년 무렵의 물리학처럼).
    - wrong: 모형은 대충 만든 틀린 설명이다.
      right: 모형은 중요한 것만 남기고 나머지를 일부러 버린 설명이에요. 버린 것이 결과를 바꾸지 않으면 아주 정확해요.
  terms: [law, prediction, model]
  taughtIn: 1

- id: vibration-idea
  name: 진동
  core: 가운데로 되돌리는 힘과 관성이 번갈아 일하면, 물체는 같은 움직임을 되풀이해요. 크게 흔들어도 한 번 오가는 시간(주기)은 그대로예요.
  why: 그네, 심장, 악기 줄처럼 되풀이되는 움직임은 모두 같은 말로 설명돼요. 소리와 빛을 이해하는 첫걸음이에요.
  steps:
    - 가운데에서 벗어나면 되돌리는 힘이 생겨 가운데로 끌어당겨요.
    - 가운데에 오면 힘은 0이지만, 관성 때문에 지나쳐 반대쪽으로 가요.
    - 이것이 되풀이되며 진동이 돼요. 주기는 한 번 오가는 시간, 진동수는 1초에 오가는 횟수예요.
    - 진폭을 키우면 더 멀리 가지만 되돌리는 힘도 커져서, 주기는 그대로예요.
  wrong:
    - wrong: 그네를 세게 밀면 한 번 오가는 데 시간이 더 걸린다.
      right: 더 멀리 가지만 그만큼 더 빨리 움직여서, 주기는 거의 그대로예요.
    - wrong: 진동수가 크면 주기도 길다.
      right: 반대예요. 1초에 많이 오갈수록 한 번에 걸리는 시간은 짧아요.
  terms: [vibration, period, frequency, amplitude]
  formulas: [frequency-period]
  taughtIn: 9

- id: wave-idea
  name: 파동
  core: 파동에서 멀리 가는 것은 물질이 아니라 흔들림과 그 흔들림이 나르는 에너지예요. 매질은 제자리에서 진동할 뿐이에요.
  why: 소리와 물결과 빛을 같은 말로 설명하려면, 무엇이 움직이고 무엇이 제자리에 있는지를 먼저 나눠야 해요.
  steps:
    - 매질의 한 부분이 흔들리면 이웃을 끌어서 조금 늦게 따라 흔들리게 해요.
    - 이 늦음이 차례로 이어지면 흔들림의 모양이 앞으로 나아가요.
    - 매질은 제자리에서 오르내릴 뿐, 파동을 따라 멀리 가지 않아요.
    - 흔들림이 나아가면서 에너지를 실어 날라요. 그래서 파도는 모래성을 무너뜨려요.
  wrong:
    - wrong: 파도를 따라 바닷물이 해변까지 밀려온다.
      right: 물은 제자리에서 오르내릴 뿐이에요. 해변까지 오는 건 흔들림과 에너지예요.
    - wrong: 위치-변위 그래프와 시간-변위 그래프는 같은 것이다.
      right: 가로축이 다르면 뜻이 달라요. 위치면 한 순간의 모양, 시간이면 점 하나의 기록이에요.
  terms: [wave, medium, displacement]
  taughtIn: 10

- id: wave-speed-idea
  name: 파동의 속력, 진동수, 파장
  core: 한 주기 동안 파동은 파장 하나만큼 나아가요. 그래서 속력 = 진동수 × 파장이에요. 속력은 매질이, 진동수는 흔드는 쪽이 정하고, 파장은 둘에 따라 정해져요.
  why: 진동수와 파장 가운데 하나만 알면 다른 하나를 계산할 수 있어요. 소리와 빛을 다룰 때 계속 쓰는 관계예요.
  steps:
    - 흔드는 쪽이 한 번 진동할 때(한 주기) 파동은 파장 하나만큼 나아가요.
    - 1초에는 진동수만큼 진동하니까, 1초에 나아가는 거리는 진동수 × 파장이에요.
    - 같은 매질에서는 속력이 정해져 있으니, 진동수가 크면 파장이 짧아요.
    - 매질이 바뀌어도 진동수는 그대로이고, 속력과 파장이 함께 바뀌어요.
  wrong:
    - wrong: 높은 소리가 낮은 소리보다 빨리 간다.
      right: 같은 공기 속에서는 모든 소리가 약 340 m/s로 같아요. 높은 소리는 파장이 짧을 뿐이에요.
    - wrong: 물에 들어가면 소리의 진동수가 바뀐다.
      right: 진동수는 소리를 낸 물체가 정해요. 물에서는 속력과 파장이 바뀌어요.
  terms: [wavelength, wave-speed]
  formulas: [wave-speed-formula]
  taughtIn: 11

- id: sine-idea
  name: 사인과 위상
  core: 원을 일정하게 도는 점의 높이를 각도에 따라 그리면 사인 곡선이 돼요. 진동은 한 주기에 원을 한 바퀴 도는 셈이라, 변위를 사인으로 적을 수 있고, 지금 원 위 어디쯤인지가 위상이에요.
  why: 진동과 파동은 모두 같은 모양(사인 곡선)을 되풀이해요. 사인을 알면 '언제 어디쯤 있는지'를 숫자 하나로 말할 수 있어요.
  steps:
    - 반지름 1인 원 위에서 각도 θ만큼 돈 점의 높이가 sin θ예요. −1과 1 사이예요.
    - 각도를 가로축에 놓고 높이를 그리면 360°마다 되풀이되는 사인 곡선이 돼요.
    - 진동은 한 주기에 360°를 도는 셈이라서, 변위 = 진폭 × sin(360° × 시간 ÷ 주기)예요.
    - 두 진동이 원 위에서 몇 도 떨어져 있는지(위상 차이)가 둘의 박자 차이예요.
  wrong:
    - wrong: 추는 원을 돌지 않으니 각도가 아무 뜻이 없다.
      right: 여기서 각도는 한 번의 되풀이 가운데 얼마나 왔는지 적는 눈금이에요. 한 주기를 360칸으로 나눈 시계예요.
  terms: [sine, phase]
  formulas: [oscillation-formula]
  taughtIn: 12

- id: superposition-idea
  name: 중첩
  core: 두 파동이 같은 곳을 지나면 그곳의 변위는 두 변위를 더한 값이에요. 겹친 뒤에는 둘 다 원래 모양 그대로 제 갈 길을 가요.
  why: 파동이 서로 부딪혀 튕겨 나가지 않고 그냥 더해진다는 사실 하나로, 노이즈 캔슬링 이어폰부터 다음 강의 무늬까지 설명할 수 있어요.
  steps:
    - 같은 자리에서 두 파동의 변위를 더해요. 위와 아래(+와 −)를 따져서 더해요.
    - 위상이 같으면 마루와 마루가 만나 더 커져요.
    - 위상이 반대면 마루와 골이 만나 작아지고, 진폭이 같으면 0이 돼요.
    - 겹친 곳을 지나면 두 파동은 아무 일도 없었던 것처럼 원래 모양으로 나아가요.
  wrong:
    - wrong: 두 파동이 부딪히면 서로 튕겨 나가거나 사라진다.
      right: 겹친 동안만 더해질 뿐, 지나간 뒤에는 둘 다 그대로예요.
  terms: [superposition]
  taughtIn: 13

- id: interference-idea
  name: 간섭과 경로차
  core: 두 파원에서 온 파동이 지나온 거리의 차이(경로차)가 파장의 정수배인 곳에서는 보강되고, 정수배에 반 파장을 더한 곳에서는 상쇄돼요.
  why: 같은 위상으로 나온 두 파동이 어디서 커지고 어디서 지워지는지를, 거리 차이 하나로 예측할 수 있어요. 16강에서 빛으로 같은 실험을 해요.
  steps:
    - 두 파원이 같은 위상으로 진동해요.
    - 한 지점까지 두 파동이 지나온 거리가 다르면, 도착할 때의 위상이 달라요.
    - 경로차가 0, 1, 2 … 파장이면 위상이 같아서 보강돼요.
    - 경로차가 ½, 1½, 2½ … 파장이면 위상이 반대라서 상쇄돼요.
  wrong:
    - wrong: 상쇄된 곳의 에너지는 사라진다.
      right: 상쇄되는 곳의 에너지가 보강되는 곳으로 옮겨 갈 뿐이에요. 전체는 그대로예요.
  terms: [interference, constructive, destructive, path-difference]
  taughtIn: 14

- id: diffraction-idea
  name: 회절
  core: 틈이나 모서리를 지난 파동은 그늘 쪽으로도 휘어 들어가요. 틈의 폭이 파장과 비슷하거나 작을 때 가장 크게 퍼져요.
  why: 담 너머 소리는 들리는데 사람은 안 보이는 까닭, 빛이 파동이라는 증거를 찾기 어려웠던 까닭이 모두 회절의 크기에 달려 있어요.
  steps:
    - 틈을 지나는 파동은 틈의 모든 점에서 새 물결이 퍼져 나가는 것처럼 행동해요.
    - 틈의 폭이 파장과 비슷하거나 작으면 그 물결들이 사방으로 퍼져요.
    - 틈이 파장보다 훨씬 넓으면 물결들이 서로 간섭해 거의 곧게 나아가요.
  wrong:
    - wrong: 빛은 회절하지 않는다.
      right: 빛도 회절해요. 파장이 아주 짧아서(0.5 μm쯤) 아주 좁은 틈에서만 눈에 띌 뿐이에요.
  terms: [diffraction]
  taughtIn: 15

- id: double-slit-idea
  name: 이중 슬릿 무늬
  core: 빛 하나를 좁은 틈 두 개로 나누면 같은 위상의 두 파원이 돼요. 화면의 각 점까지 경로차가 파장의 정수배인 곳마다 밝은 줄이 생기고, 그 간격은 λL ÷ d예요.
  why: 빛에 빛을 더했는데 어두운 줄이 생긴다는 건, 빛이 파동이라는 가장 분명한 증거예요. 무늬 간격을 재면 아주 작은 빛의 파장도 잴 수 있어요.
  steps:
    - 두 슬릿에서 나온 빛은 같은 위상으로 출발해요.
    - 화면의 한 점까지 두 빛이 지나온 거리의 차이는 d sin θ예요.
    - 경로차가 파장의 0배, 1배, 2배 …인 곳(d sin θ = mλ)이 밝은 줄이에요.
    - 화면이 멀면 이웃한 밝은 줄 사이는 λL ÷ d예요. 파장이 길수록, 슬릿이 가까울수록 넓어요.
  wrong:
    - wrong: 식의 m은 질량이다.
      right: 이 식의 m은 밝은 줄의 번호(0, 1, 2 …)예요. 그래서 이 강에서는 옅은 네모 바탕의 번호 모양으로 보여요.
    - wrong: 슬릿 간격을 넓히면 무늬도 넓어진다.
      right: 반대예요. d가 나누는 수라서 슬릿이 멀어지면 무늬는 좁아져요.
  terms: [slit, double-slit, fringe]
  formulas: [double-slit-formula]
  taughtIn: 16

- id: light-color-idea
  name: 빛의 색은 진동수로 정해져요
  core: 빛의 색은 1초에 진동하는 횟수(진동수)로 정해져요. 진공에서 모든 빛은 같은 속력 c로 가니까, 파장을 재면 진동수를 계산할 수 있어요.
  why: 같은 빛이 물이나 유리에 들어가면 속력과 파장은 바뀌어도 색은 그대로예요. 색을 정하는 건 바뀌지 않는 진동수라는 뜻이에요.
  steps:
    - 빨간빛은 1초에 약 430조 번, 보랏빛은 약 750조 번 진동해요.
    - 진공에서는 모든 빛이 같은 속력 c(약 3 × 10⁸ m/s)로 가요.
    - 그래서 c = fλ로 파장과 진동수를 서로 바꿀 수 있어요.
    - 물에 들어가면 빛은 느려지고 파장이 짧아지지만, 진동수와 색은 그대로예요.
  wrong:
    - wrong: 빛의 색은 파장이 정한다.
      right: 같은 빛도 물속에서는 파장이 짧아지지만 색은 그대로예요. 색은 바뀌지 않는 진동수로 정해져요.
  terms: [spectrum, speed-of-light, visible-light]
  formulas: [light-wave-formula]
  taughtIn: 17

- id: coulomb-idea
  name: 전하와 쿨롱 법칙
  core: 같은 종류의 전하는 밀고 다른 종류는 당겨요. 그 힘은 두 전하의 곱에 비례하고, 거리의 제곱에 반비례해요.
  why: 풍선이 머리카락을 끄는 일부터 물질이 서로 붙어 있는 까닭까지, 일상의 거의 모든 힘이 전하 사이의 전기력이에요.
  steps:
    - 문지르면 전하가 한쪽에서 다른 쪽으로 옮겨 가요. 새로 생기지는 않아요.
    - 같은 전하끼리는 밀고, 다른 전하끼리는 당겨요.
    - 힘은 전하가 클수록 세고, 거리가 2배면 4분의 1, 3배면 9분의 1로 약해져요.
  wrong:
    - wrong: 거리가 2배면 힘은 절반이 된다.
      right: 거리의 제곱에 반비례해서 4분의 1이 돼요. 영향이 공의 겉넓이만큼 퍼지기 때문이에요.
    - wrong: 문지르면 전하가 새로 생긴다.
      right: 원래 있던 전하가 한 물체에서 다른 물체로 옮겨 갈 뿐이에요.
  terms: [charge, electric-force, coulomb-law]
  formulas: [coulomb-formula]
  taughtIn: 18

- id: em-wave-idea
  name: 전자기파
  core: 전하가 흔들리면 주위의 전기적 변화와 자기적 변화가 서로를 만들며 퍼져 나가요. 빛, 전파, 적외선, 자외선, X선은 진동수만 다른 같은 파동이에요.
  why: 라디오, 리모컨, 전자레인지, 햇빛이 모두 같은 원리라는 걸 알면, 진동수 하나로 그 성질을 견줄 수 있어요.
  steps:
    - 흔들리는 전하 주위에서 전기적 영향이 바뀌어요.
    - 그 바뀜이 자기적 바뀜을 만들고, 자기적 바뀜이 다시 전기적 바뀜을 만들며 퍼져요.
    - 이 파동은 매질 없이 진공에서도 빛의 속력 c로 가요.
    - 진동수에 따라 전파, 적외선, 눈에 보이는 빛, 자외선, X선으로 부를 뿐이에요.
  wrong:
    - wrong: 전파와 빛은 다른 종류다.
      right: 진동수만 다를 뿐 같은 전자기파예요. 둘 다 진공에서 c로 가요.
  terms: [em-wave, radio-wave, infrared, ultraviolet, x-ray]
  formulas: [light-wave-formula]
  taughtIn: 19

- id: standing-wave-idea
  name: 정상파와 진동 모드
  core: 양 끝이 묶인 줄에서는 반 파장이 정수 개 들어가는 모양만 남아요. 그래서 진동수도 기본 진동의 정수배로만 나와요.
  why: 악기가 정해진 음만 내는 까닭이고, 나중에 원자의 에너지가 정해진 값만 갖는 까닭을 이해하는 열쇠가 돼요.
  steps:
    - 줄을 따라 간 파동이 끝에서 되돌아와, 오가는 두 파동이 겹쳐요(중첩).
    - 끝이 묶여 있으니 양 끝은 늘 마디예요.
    - 그래서 길이 L에 반 파장이 1개, 2개, 3개 … 들어가는 모양만 오래 남아요.
    - 진동수는 v ÷ 2L의 1배, 2배, 3배 …예요. 그 사이 진동수는 없어요.
  wrong:
    - wrong: 줄은 어떤 진동수로든 떨 수 있다.
      right: 양 끝이 묶이면 반 파장이 정수 개 들어가는 진동수만 남아요. 다른 진동수는 금방 사라져요.
  terms: [standing-wave, node, mode, fundamental, harmonic]
  formulas: [standing-wave-formula]
  taughtIn: 20
