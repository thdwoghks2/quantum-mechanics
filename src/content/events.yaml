- id: hertz-1883
  year: 1883
  title: 휘지 않은 음극선
  summary: 하인리히 헤르츠가 전기를 띤 두 판 사이로 음극선을 지나게 했지만 휘지 않았어요. 그래서 음극선이 빛 같은 파동이라는 생각에 힘이 실렸어요. 1897년 톰슨은 관 속에 남은 공기가 판의 전기를 가렸기 때문이라고 보고, 공기를 더 철저히 빼서 음극선을 휘게 했어요.
  lessons: [37]
  people: [hertz]
- id: braun-1897
  year: 1897
  title: 브라운관
  summary: 카를 페르디난트 브라운이 음극선으로 화면에 전기의 변화를 그리는 유리관을 만들었어요. 옛날 TV와 컴퓨터 모니터의 브라운관이 여기서 나왔어요.
  lessons: [37]
  people: [braun]
- id: millikan-1909
  year: 1909
  title: 밀리컨의 기름방울 실험
  summary: 로버트 밀리컨과 하비 플레처가 전기를 띤 기름방울을 두 판 사이에 띄워 전하를 쟀어요. 어느 방울의 전하든 약 1.6 × 10⁻¹⁹ C의 정수배였어요. 1913년에 더 정확한 값을 발표했어요.
  lessons: [38]
  people: [millikan, fletcher]

