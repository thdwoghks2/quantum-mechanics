# ── 87강 ─────────────────────────────
- id: measurement-problem
  term: 측정 문제
  definition: 재지 않을 때는 파동함수가 슈뢰딩거 방정식대로 겹친 채 부드럽게 바뀌고, 재면 결과 하나로 붕괴한다는 두 규칙 사이에서, 무엇이 측정이고 언제 결과 하나로 정해지는지를 이론이 분명히 말해 주지 않는 문제.
  examples:
    - 상자 속 고양이의 삶과 죽음이 원자 하나의 겹친 상태에 묶이면, 상자를 열기 전 고양이의 상태를 어떻게 말해야 하는지가 측정 문제예요.
    - 검출기도 원자들로 되어 있는데, 왜 검출기는 겹친 상태로 남지 않고 "찰칵" 소리 하나만 내는지 묻는 것도 측정 문제예요.
  notThis: 측정 기계가 서툴러서 생기는 오차 문제가 아니에요. 아무리 정밀한 장치로 재도 남는, 이론의 규칙에 관한 물음이에요.
  taughtIn: 87

