# ── 37강 ─────────────────────────────
- id: electron
  term: 전자
  definition: 모든 원자 안에 들어 있는, 아주 가볍고 음(−) 전하를 띤 알갱이. 질량은 가장 가벼운 원자인 수소 원자의 약 1,836분의 1이다.
  examples:
    - 옛날 브라운관 TV는 전자의 줄기로 화면 안쪽을 때려서 빛을 냈어요.
    - 겨울에 문손잡이를 잡을 때 찌릿한 건, 몸에 쌓였던 전자가 한꺼번에 손잡이로 옮겨 가기 때문이에요.
  notThis: 전류와는 달라요. 전류는 전자 같은 알갱이가 줄지어 흐르는 것이고, 전자는 그 알갱이 하나예요.
  taughtIn: 37
  previewIn: [16, 18, 19, 20, 34, 35, 36]
  q: charge
- id: cathode-ray
  term: 음극선
  definition: 공기를 거의 다 뺀 유리관 안에서, 전지의 − 극에 이은 금속판(음극)에서 나와 곧게 뻗어 가는 전자의 줄기.
  examples:
    - 옛날 브라운관 TV 속에서는 음극선이 화면 안쪽을 빠르게 훑으며 그림을 그렸어요.
    - 병원과 공항의 X선 장치는 음극선을 금속판에 세게 부딪혀서 X선을 만들어요.
  notThis: 빛의 한 종류가 아니에요. 이름에 '선'이 붙었지만, 전기를 띤 판 사이를 지나면 휘는 알갱이의 흐름이에요.
  taughtIn: 37

# ── 38강 ─────────────────────────────
- id: elementary-charge
  term: 기본 전하
  definition: 홀로 떨어져 있는 알갱이가 띨 수 있는 가장 작은 전하의 크기. 약 1.602 × 10⁻¹⁹ C이고 기호로 e라고 쓴다. 전자 하나의 전하는 −e다.
  unit: C (쿨롱)
  examples:
    - 머리카락에 문지른 풍선이 띤 전하도 e를 1조 번쯤 더한 값이에요. 수가 워낙 많아서 덩어리로 느껴지지 않을 뿐이에요.
    - 전하 1 C는 전자 약 6.2 × 10¹⁸개가 띤 전하를 모두 더한 크기예요.
  notThis: 전하를 아무 크기로나 나눌 수 있다는 생각과는 달라요. 0.5e나 1.3e 같은 전하를 띤 알갱이는 홀로 발견된 적이 없어요. 쿼크라는 알갱이는 e의 3분의 1 단위 전하를 띠지만, 늘 둘이나 셋씩 묶여 있어서 홀로 나타나지 않아요.
  taughtIn: 38
  q: charge
  highlight: true

