# ── 64강 ─────────────────────────────
- id: derivative
  term: 미분
  definition: 어떤 양이 한순간에 얼마나 빨리 바뀌는지 구하는 일, 또는 그렇게 구한 값. 짧은 동안 바뀐 양을 그 동안의 길이로 나누고, 그 길이를 0에 가깝게 줄여 갈 때 다가가는 값이다. 그래프에서는 그 점의 기울기다.
  examples:
    - 자동차 속도계 바늘은 지금 이 순간의 빠르기를 보여 줘요. 위치를 시간으로 미분한 값이에요.
    - 등산로의 한 자리에서 한 걸음 앞으로 갈 때 높이가 얼마나 오르는지가 그 자리의 가파른 정도예요. 높이를 거리로 미분한 값이죠.
  notThis: 긴 동안의 평균 변화율과는 달라요. 서울에서 대전까지 간 평균 속력은 하나지만, 미분으로 얻는 속력은 순간마다 달라요.
  taughtIn: 64
- id: curvature
  term: 곡률
  definition: 그래프의 기울기가 바뀌는 빠르기. 그래프가 얼마나 세게, 어느 방향으로 굽었는지를 나타낸다. 이 코스에서는 기울기를 한 번 더 미분한 값을 곡률이라고 부른다.
  examples:
    - 급하게 휘는 길에서는 운전대를 빨리 돌려야 해요. 짧은 거리 안에서 길의 방향이 크게 바뀌니까 곡률이 커요.
    - 같은 높이로 출렁이는 물결이라도 파장이 짧을수록 더 세게 굽어서 곡률이 커요.
  notThis: 기울기와는 달라요. 아무리 가파른 비탈도 곧게 뻗어 있으면 곡률이 0이에요. 수학에서 원의 굽은 정도로 정의하는 곡률과는 기울기가 클 때 값이 조금 달라요.
  taughtIn: 64

# ── 65강 ─────────────────────────────
- id: schrodinger-equation
  term: 슈뢰딩거 방정식
  definition: 파동함수가 따라야 하는 식. 자리마다 '파동함수의 곡률로 읽은 운동 에너지 + 위치 에너지 = 전체 에너지'가 맞아야 한다고 말한다. 시간에 따라 파동함수가 어떻게 바뀌는지 정하는 꼴도 있다.
  examples:
    - 전자가 위치 에너지가 높은 곳으로 넘어가면, 이 식에 따라 그곳에서 파동함수의 파장이 길어져요.
    - 화학자들은 컴퓨터로 이 식을 풀어서 분자의 모양과 성질을 미리 계산해요.
  notThis: 더 기본적인 법칙에서 이끌어 낸 식이 아니에요. 슈뢰딩거가 물질파 생각에서 출발해 세웠고, 예측이 실험과 맞아서 받아들여졌어요. 입자가 지나간 길을 알려 주는 식도 아니에요.
  taughtIn: 65

# ── 66강 ─────────────────────────────
- id: particle-in-a-box
  term: 상자 속 입자
  definition: 넘을 수 없는 두 벽 사이에 갇혀 한 줄로만 움직이는 입자의 모형. 벽에서 파동함수가 0이어야 해서, 상자 안에 반 파장이 정수 개 들어가는 파동만 허락되고 에너지는 1번째 에너지의 1, 4, 9, 16배처럼 나뉜다.
  examples:
    - 탄소가 사슬처럼 길게 이어진 색소 분자 속 전자를 상자 속 입자로 어림하면, 그 색소가 흡수하는 빛의 색을 대강 맞힐 수 있어요.
    - QLED TV의 양자점 속에 갇힌 전자의 에너지 간격도 이 모형으로 어림해요.
  notThis: 정말로 상자에 든 물건 이야기가 아니에요. 갇힌 입자의 행동을 가장 단순하게 보여 주려고 일부러 많은 것을 버린 모형이에요.
  taughtIn: 66
- id: quantum-dot
  term: 양자점
  definition: 지름이 수 nm인 아주 작은 결정 알갱이. 안에 갇힌 전자의 에너지 간격이 알갱이 크기로 정해져서, 같은 물질이라도 크기에 따라 다른 색의 빛을 낸다.
  examples:
    - QLED TV는 파란빛을 양자점 층에 비춰, 크기가 다른 양자점들이 초록빛과 붉은빛을 내게 해요.
    - 생물학 연구실에서는 양자점을 세포 속 물질에 붙여, 빛으로 그 위치를 찾는 표지로 써요.
  notThis: 물감처럼 물질의 종류로 색을 정하는 것과 달라요. 같은 물질이라도 알갱이가 작을수록 진동수가 높은 빛을 내요.
  taughtIn: 66

# ── 67강 ─────────────────────────────
- id: potential-well
  term: 퍼텐셜 우물
  definition: 둘레보다 위치 에너지가 낮아서 입자를 가둘 수 있는 곳. 위치 에너지를 자리에 따라 그리면 우물처럼 움푹 파인 모양이 된다. 퍼텐셜은 위치 에너지를 뜻한다.
  examples:
    - 원자 속 전자는 원자핵에 끌려서, 원자핵 둘레의 위치 에너지가 낮은 퍼텐셜 우물에 갇혀 있어요.
    - 양자점 속 전자는 알갱이 바깥보다 안의 위치 에너지가 낮아서 알갱이 안에 갇혀요.
  notThis: 땅에 판 진짜 우물이 아니에요. 위치 에너지 그래프의 모양을 빗대어 붙인 이름이에요.
  taughtIn: 67
- id: forbidden-region
  term: 금지 영역
  definition: 위치 에너지가 입자의 전체 에너지보다 커서, 고전 물리에서는 입자가 들어갈 수 없는 곳. 양자역학에서는 이곳에서도 파동함수가 0이 아니고, 깊이 들어갈수록 빠르게 0에 가까워진다.
  examples:
    - 그릇 속 구슬을 살살 굴리면 어느 높이 위로는 못 올라가고 되돌아와요. 그 높이 위가 이 구슬의 금지 영역이에요.
    - 원자 속 전자의 파동함수는 고전 물리라면 갈 수 없는 바깥쪽까지 조금 스며 나와 있어요.
  notThis: 누가 규칙으로 막아 둔 곳이 아니에요. 양자역학에서는 입자를 이곳에서 찾을 확률이 0이 아니어서, '고전 물리라면 갈 수 없는 곳'이라는 뜻으로 써요.
  taughtIn: 67

# ── 68강 ─────────────────────────────
- id: tunneling
  term: 터널 효과
  definition: 에너지가 모자라 고전 물리로는 넘을 수 없는 얇은 벽을, 입자가 일정한 확률로 지나가는 일. 벽 속에서 잦아드는 파동함수가 0이 되기 전에 벽 반대편에 닿기 때문에 생긴다. 벽이 두껍고 높을수록, 입자가 무거울수록 확률이 곱하기로 빠르게 작아진다.
  examples:
    - 우라늄 같은 무거운 원자핵은 그 안에 갇힌 알파 입자가 터널 효과로 빠져나오면서 알파 입자를 내보내요.
    - 주사 터널링 현미경은 바늘과 물체 사이의 빈틈을 전자가 터널 효과로 건너는 양을 재서, 원자 하나하나의 높낮이를 읽어요.
  notThis: 벽에 구멍을 뚫고 지나가는 게 아니에요. 벽 속에서 에너지를 잠깐 빌리는 것도 아니어서, 벽을 지난 입자의 에너지는 처음과 같아요.
  taughtIn: 68

# ── 69강 ─────────────────────────────
- id: harmonic-oscillator
  term: 조화 진동자
  definition: 위치 에너지가 가운데서 떨어진 거리의 제곱에 비례하는 우물에 갇힌 입자. 양자역학에서 에너지 칸이 hf의 ½, 1½, 2½배처럼 hf라는 같은 간격으로 늘어선다. f는 고전 물리로 흔들릴 때의 진동수다.
  examples:
    - 이산화탄소 분자 속 원자들은 용수철로 이어진 것처럼 흔들려서, 1초에 약 20조 번 진동하는 적외선을 흡수해요.
    - 용수철에 매달린 추도 조화 진동자예요. 다만 칸 사이 간격이 너무 작아서 우리 눈에는 칸이 보이지 않아요.
  notThis: 상자 속 입자와 달리 칸 간격이 위로 갈수록 벌어지지 않고 어디서나 같아요. '조화'는 음악의 화음이 아니라 사인 모양으로 고르게 흔들린다는 뜻이에요.
  taughtIn: 69

# ── 70강 ─────────────────────────────
- id: stationary-state
  term: 정상 상태
  definition: 에너지가 하나로 정해진 양자 상태. 파동함수의 값이 크기는 그대로 둔 채 복소평면 위에서 1초에 E/h바퀴씩 돌기만 해서, 어느 자리에서나 입자를 찾을 확률이 시간이 지나도 변하지 않는다.
  examples:
    - 바닥상태의 수소 원자는 오늘 재도 내일 재도 똑같은 크기와 모양이에요. 정상 상태라서 찾을 확률이 변하지 않거든요.
    - 상자 속 입자가 1번째 칸 하나에만 있으면, 입자를 찾을 확률이 가운데가 높은 모양 그대로 머물러요.
  notThis: 입자가 멈춰 있다는 뜻이 아니에요. 정상(定常)은 '늘 같은 모양'이라는 뜻이고, 운동 에너지도 0이 아니에요. 에너지가 다른 두 상태를 섞으면 더는 정상 상태가 아니어서 찾을 확률이 출렁여요.
  taughtIn: 70
  q: energy

# ── 71강 ─────────────────────────────
- id: quantum-number
  term: 양자수
  definition: 갇힌 입자의 정상 상태를 구별하는 정수 번호. 수소 원자에서는 에너지와 크기를 정하는 n, 모양을 정하는 l, 방향을 정하는 m 세 가지가 있다.
  examples:
    - 수소 원자의 바닥상태는 n = 1, l = 0, m = 0이에요.
    - 상자 속 입자의 1번째, 2번째 칸처럼 정상파를 세던 번호도 양자수예요.
  notThis: 아무렇게나 붙인 순서 번호가 아니에요. l은 0부터 n − 1까지, m은 −l부터 l까지처럼 정해진 규칙 안에서만 값을 가져요.
  taughtIn: 71
- id: orbital
  term: 오비탈
  definition: 원자 속 전자의 정상 상태 하나, 또는 그 상태에서 전자를 찾을 확률이 공간에 퍼진 모양. 양자수 n, l, m으로 정해지고, l이 0, 1, 2이면 s, p, d라는 이름이 붙는다.
  examples:
    - 수소의 1s 오비탈은 원자핵을 둘러싼 공 모양이고, 원자핵에서 약 0.053 nm 떨어진 곳에서 전자를 가장 자주 찾아요.
    - 2p 오비탈은 원자핵을 가운데 두고 양쪽으로 부푼 아령 모양이에요.
  notThis: 전자가 따라 도는 길(궤도)이 아니에요. 오비탈 그림의 구름은 전자가 쪼개져 퍼진 게 아니라, 여러 번 쟀을 때 어디서 자주 찾는지를 보여 줘요.
  taughtIn: 71

# ── 72강 ─────────────────────────────
- id: spin
  term: 스핀
  definition: 전자 같은 입자가 처음부터 지닌, 작은 막대자석처럼 행동하게 하는 성질. 전자의 스핀을 어느 축으로 재든 결과는 그 축의 '위'나 '아래' 두 값 가운데 하나다.
  examples:
    - 냉장고 자석이 쇠문에 붙는 건, 쇠 속 수많은 전자의 스핀이 한 방향으로 줄 서 있기 때문이에요.
    - 하드디스크는 아주 작은 칸마다 스핀이 줄 선 방향을 바꿔서 0과 1을 적어요.
  notThis: 전자가 팽이처럼 정말 도는 게 아니에요. 이름만 '돈다'는 뜻에서 왔고, 질량이나 전하처럼 전자가 처음부터 지닌 성질이에요.
  taughtIn: 72
- id: stern-gerlach
  term: 슈테른-게를라흐 실험
  definition: 원자를 고르지 않은 자석 사이로 보내, 원자 속 작은 자석의 방향을 재는 실험. 1922년 은 원자로 처음 했고, 원자들이 고르게 퍼지지 않고 두 갈래로만 갈라졌다.
  examples:
    - 은 원자 대신 수소 원자를 보내도 두 갈래로 갈라져요. 1927년의 실험에서 확인됐어요.
    - 자석을 옆으로 눕혀 놓고 재면, 원자들이 왼쪽과 오른쪽 두 갈래로 갈라져요.
  notThis: 원자를 무게에 따라 나누는 실험이 아니에요. 똑같은 원자들이 작은 자석의 방향에 따라 갈라져요.
  taughtIn: 72

# ── 73강 ─────────────────────────────
- id: pauli-exclusion
  term: 파울리 배타 원리
  definition: 원자 속 두 전자는 네 양자수(n, l, m, 스핀)가 모두 같은 상태에 함께 있을 수 없다는 규칙. 그래서 오비탈 하나에는 스핀이 반대인 전자가 많아야 둘 들어간다. 전자와 같은 무리의 다른 입자에도 적용된다.
  examples:
    - 헬륨의 두 전자는 1s 오비탈 하나에 스핀을 반대로 하고 들어가서 1s를 가득 채워요.
    - 리튬의 셋째 전자는 1s에 자리가 없어서 2s로 가고, 그래서 쉽게 떨어져 나가요.
  notThis: 전자끼리 밀어내는 전기력과는 달라요. 힘이 아니라 '같은 상태에 둘이 있을 수 없다'는 규칙이에요.
  taughtIn: 73

# ── 74강 ─────────────────────────────
- id: electron-configuration
  term: 전자 배치
  definition: 원자 속 전자들이 어느 오비탈에 몇 개씩 들어 있는지 적은 것. 배타 원리에 따라 에너지가 낮은 오비탈부터 둘씩 채운다. 1s² 2s² 2p⁶처럼 적는다.
  examples:
    - 나트륨의 전자 배치는 1s² 2s² 2p⁶ 3s¹이에요. 바깥에 전자 하나가 혼자 남아서 그 전자를 쉽게 내줘요.
    - 네온의 전자 배치 1s² 2s² 2p⁶는 n = 2 칸이 꽉 찬 모양이라, 네온은 거의 반응하지 않아요.
  notThis: 원자 속 전자의 위치를 그린 지도가 아니에요. 전자들이 어느 상태에 몇 개 있는지를 센 목록이에요.
  taughtIn: 74
- id: periodic-table
  term: 주기율표
  definition: 원소를 원자 번호 순서로 늘어놓되, 바깥 칸의 전자 배치가 같은 원소끼리 같은 세로줄에 오게 짠 표. 가로줄의 길이는 2, 8, 8, 18, 18, 32, 32다.
  examples:
    - 첫째 세로줄의 리튬, 나트륨, 칼륨은 모두 바깥에 전자 하나가 남아서 다른 물질과 세게 반응해요.
    - 마지막 세로줄의 헬륨, 네온, 아르곤은 바깥 칸이 꽉 차서 거의 반응하지 않아요.
  notThis: 원소를 무게 순서로만 늘어놓은 목록이 아니에요. 성질이 되풀이되는 간격에 맞춰 줄을 바꿔요.
  taughtIn: 74

# ── 75강 ─────────────────────────────
- id: degeneracy-pressure
  term: 축퇴압
  definition: 전자처럼 배타 원리를 따르는 입자들을 좁은 곳에 몰아넣을 때, 비어 있는 높은 칸까지 채워야 해서 생기는 버팀. 좁을수록 칸의 에너지가 빠르게 치솟아서, 입자들이 눌리지 않으려고 버틴다.
  examples:
    - 손으로 책상을 눌러도 손이 책상 속으로 들어가지 않는 데에는, 두 물체의 전자들이 겹치지 못하고 버티는 힘이 크게 작용해요.
    - 연료를 다 쓴 별의 중심은 전자의 축퇴압으로 중력을 버티며 지구만 한 크기에 머물러요.
  notThis: 기체를 데우면 커지는 압력과는 달라요. 온도가 0에 가까워도 사라지지 않고, 전기력처럼 거리에 따라 서서히 커지는 힘도 아니에요.
  taughtIn: 75

# ── 76강 ─────────────────────────────
- id: boson
  term: 보손
  definition: 같은 종류의 두 입자가 자리를 바꿔도 확률 진폭이 그대로인 입자. 같은 상태에 얼마든지 함께 있을 수 있고, 오히려 모이려는 경향이 있다. 스핀이 0, 1, 2처럼 정수다.
  examples:
    - 빛의 알갱이인 광자는 보손이라서, 수많은 광자가 같은 상태에 모일 수 있어요.
    - 헬륨-4 원자는 보손이라서, 아주 차갑게 식히면 많은 원자가 같은 상태에 모여 마찰 없이 흘러요.
  notThis: 서로 끌어당기는 힘이 있는 입자라는 뜻이 아니에요. 모이는 까닭은 힘이 아니라 진폭이 더해지는 방식이에요.
  taughtIn: 76
- id: fermion
  term: 페르미온
  definition: 같은 종류의 두 입자가 자리를 바꾸면 확률 진폭의 부호가 바뀌는 입자. 그래서 두 페르미온은 똑같은 상태에 함께 있을 수 없다(배타 원리). 스핀이 ½, 3/2처럼 반 정수다.
  examples:
    - 전자는 페르미온이라서 원자 속 오비탈마다 둘까지만 들어가고, 그 덕분에 원소마다 성질이 달라요.
    - 원자핵을 이루는 알갱이들도 페르미온이라서, 원자핵 속에서도 칸을 차례로 채워요.
  notThis: 서로 밀어내는 힘이 있는 입자라는 뜻이 아니에요. 같은 상태를 피하는 까닭은 부호가 바뀌는 규칙이에요.
  taughtIn: 76
- id: bose-einstein-condensate
  term: 보스-아인슈타인 응축
  definition: 보손인 원자들을 아주 차갑게 식혀, 대부분이 가장 낮은 하나의 상태에 모인 것. 원자 수천 개가 하나의 파동처럼 함께 움직인다. 1924~1925년 아인슈타인이 예언했고, 1995년 처음 만들었다.
  examples:
    - 1995년 루비듐 원자 약 2,000개를 0.00000017 K까지 식혀서 처음 만들었어요.
    - 응축된 원자 무리 두 개를 겹치면, 빛처럼 밝고 어두운 간섭 무늬가 생겨요.
  notThis: 보통 기체가 차가워져 액체가 되는 것과 달라요. 원자들이 서로 들러붙는 게 아니라 같은 상태에 모이는 거예요.
  taughtIn: 76

# ── 77강 ─────────────────────────────
- id: vector
  term: 벡터
  definition: 크기와 방향을 함께 가진 양. 화살표로 그리고, (3, 4)처럼 성분으로 적는다. 더할 때는 화살표를 이어 붙이고, 성분끼리 더한다.
  examples:
    - 학교에서 동쪽으로 3 km, 북쪽으로 4 km 떨어진 도서관의 자리는 벡터 (3, 4)로 적어요. 곧게 이으면 5 km예요.
    - 북쪽으로 60 km/h와 남쪽으로 60 km/h는 빠르기가 같아도 방향이 달라서, 서로 다른 속도 벡터예요.
  notThis: 온도나 질량처럼 크기만 있는 양은 벡터가 아니에요. 또 벡터는 그리는 자리가 아니라 길이와 방향으로 정해져서, 옮겨 그려도 같은 벡터예요.
  taughtIn: 77
- id: dot-product
  term: 내적
  definition: 두 벡터의 길이와 사이 각도의 코사인을 곱한 수. 성분끼리 곱해서 더해도 같은 값이 나온다. 두 벡터가 얼마나 같은 쪽을 향하는지 나타내고, 직각이면 0이다.
  examples:
    - (3, 4)와 (4, −3)의 내적은 3 × 4 + 4 × (−3) = 0이라서, 두 화살표는 서로 직각이에요.
    - 수레를 비스듬히 끌 때, 끄는 힘과 '수레가 가는 방향으로 길이 1인 화살표'의 내적이 수레를 앞으로 끄는 힘의 크기예요.
  notThis: 내적의 결과는 화살표가 아니라 수 하나예요. 두 벡터를 단순히 이어 붙인 합과도 달라요.
  taughtIn: 77

# ── 78강 ─────────────────────────────
- id: polarization
  term: 편광
  definition: 빛처럼 진행 방향과 직각으로 흔들리는 파동에서, 흔들리는 방향. 벡터로 나타낸다. 편광판은 자기 축 방향의 성분만 통과시켜서, 빛의 세기를 cos²(사이 각도)배로 줄인다.
  examples:
    - 편광 선글라스는 물이나 젖은 도로에서 반사된, 주로 가로로 흔들리는 빛을 막아 눈부심을 줄여요.
    - 액정 화면(LCD)은 편광판 두 장 사이에서 빛의 흔들림 방향을 돌려 칸마다 밝기를 정해요.
  notThis: 빛의 색이나 세기와는 다른 성질이에요. 같은 색, 같은 세기의 빛도 흔들리는 방향이 다를 수 있어요.
  taughtIn: 78

# ── 79강 ─────────────────────────────
- id: qubit
  term: 큐비트
  definition: 재면 0이나 1 두 값 가운데 하나가 나오는 양자 대상. 상태는 α|0⟩ + β|1⟩이라는 길이 1인 화살표이고, 0이 나올 확률은 |α|², 1이 나올 확률은 |β|²이다.
  examples:
    - 광자의 편광은 가로를 |0⟩, 세로를 |1⟩로 두면 큐비트예요. 45° 기운 광자를 재면 0과 1이 반반 나와요.
    - 전자의 스핀도 위를 |0⟩, 아래를 |1⟩로 두면 큐비트예요.
  notThis: 0과 1을 함께 담아 두었다가 둘 다 꺼내 쓸 수 있는 칸이 아니에요. 한 번 재면 0이나 1 가운데 하나만 얻어요.
  taughtIn: 79
- id: dirac-notation
  term: 디랙 표기
  definition: 양자 상태를 |0⟩, |가로⟩처럼 꺾쇠 기호 | ⟩ 안에 이름을 넣어 적는 방법. 꺾쇠 하나가 상태를 나타내는 화살표(벡터) 하나다. 1939년 폴 디랙이 정리했다.
  examples:
    - 가로로 흔들리는 광자의 상태는 |가로⟩, 세로로 흔들리는 광자는 |세로⟩로 적어요.
    - 45° 기운 광자는 (1/√2)|가로⟩ + (1/√2)|세로⟩로 적어요.
  notThis: 절댓값 기호 | |와는 달라요. 오른쪽이 뾰족한 꺾쇠 ⟩로 끝나고, 안에 든 것은 수가 아니라 상태의 이름이에요.
  taughtIn: 79

# ── 80강 ─────────────────────────────
- id: basis
  term: 기저
  definition: 재는 방법 하나를 정하는, 서로 직각이고 길이가 1인 화살표들의 묶음. 큐비트에서는 |0⟩과 |1⟩, 또는 45° 돌린 |+⟩와 |−⟩처럼 화살표 두 개로 이루어진다. 어떤 상태든 기저 화살표들을 섞어 적을 수 있다.
  examples:
    - 편광판을 가로와 세로로 두고 재면 |가로⟩, |세로⟩ 기저로 재는 거예요.
    - 편광판을 45° 돌려 재면 |+⟩, |−⟩ 기저로 재는 거예요.
  notThis: "'기초'나 '바탕'이라는 일상의 뜻과 달라요. 여기서는 재는 방향을 정하는 직각인 화살표 한 묶음이에요."
  taughtIn: 80
- id: projection
  term: 투영
  definition: 한 화살표를 어떤 방향에 수직으로 비추어 생기는 그림자, 또는 그 그림자를 얻는 일. 길이 1인 방향 화살표와의 내적이 그림자의 길이다. 양자역학에서 측정 결과의 확률은 상태를 그 결과의 기저 화살표로 투영한 길이의 제곱이다.
  examples:
    - 한낮에 해가 머리 위에 있을 때, 땅과 60°를 이루게 비스듬히 세운 1 m 막대는 땅에 0.5 m 그림자를 드리워요.
    - 0.87|0⟩ + 0.5|1⟩을 |0⟩ 방향으로 투영하면 길이가 0.87이고, 0이 나올 확률은 그 제곱인 0.75예요.
  notThis: 영화를 스크린에 크게 비추는 일과는 뜻이 달라요. 크기를 키우는 게 아니라 한 방향의 성분만 남기는 거예요.
  taughtIn: 80

