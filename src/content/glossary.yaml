# ── 121강 ────────────────────────────
- id: field
  term: 장
  pattern: "장\\(場\\)"
  definition: 공간의 모든 자리마다 값이 하나씩 정해져 있는 것. 전기와 자기의 장이라면, 그 자리에 놓인 전하나 쇳조각이 받는 힘의 방향과 세기.
  examples:
    - 일기 예보의 기온 지도에는 지역마다 온도가 하나씩 적혀 있어요. 기온의 장이에요.
    - 바람 지도는 자리마다 바람의 세기와 방향을 화살표로 그려요. 화살표의 장이에요.
    - 자석 위 종이에 뿌린 쇳가루는 자리마다 자석의 장이 가리키는 방향으로 늘어서요.
  notThis: 운동장, 시장의 '장'과 같은 한자예요. 하지만 물리학의 장은 어떤 장소 하나가 아니라, 공간 전체에 걸쳐 자리마다 정해진 값이에요.
  taughtIn: 121
  q: force

# ── 122강 ────────────────────────────
- id: qed
  term: 양자전기역학
  definition: 빛의 장과 전자의 장이 광자를 내놓고 흡수하며 주고받는 일을, 일이 일어나는 방법마다 확률 진폭을 구해 더하는 방식으로 계산하는 이론.
  examples:
    - 형광등 속 원자가 빛을 내놓는 비율을 계산할 때 써요.
    - 두 전자가 서로 밀어내는 힘도 두 전자가 광자를 주고받는 일로 계산해요.
    - 전자가 띤 작은 자석의 세기를 계산해서, 잰 값과 열두 자리 가까이 맞혔어요.
  notThis: 원자핵을 묶는 힘은 다루지 않아요. 빛과 전하를 띤 입자 사이의 일만 다뤄요.
  taughtIn: 122
- id: feynman-diagram
  term: 파인먼 다이어그램
  definition: 전자가 가는 곧은 선, 광자가 가는 물결선, 광자를 내놓거나 흡수하는 점으로, 일이 일어나는 방법 하나를 그린 그림. 그림마다 확률 진폭이 하나씩 정해진다.
  examples:
    - 두 전자가 밀어내는 가장 간단한 그림은, 두 곧은 선 사이를 물결선 하나가 잇는 모양이에요.
    - 전자가 광자를 내놓았다가 다시 흡수하는 그림은, 곧은 선 위에 물결선이 둥글게 걸친 모양이에요.
  notThis: 전자가 실제로 지나간 길을 찍은 사진이 아니에요. 계산할 확률 진폭의 목록에서 한 줄이에요.
  taughtIn: 122
- id: fine-structure-constant
  term: 미세 구조 상수
  definition: 빛과 전하를 띤 입자가 서로 얼마나 세게 주고받는지를 정하는, 단위가 없는 수. 약 1/137.036. 기호는 α.
  examples:
    - 파인먼 다이어그램에서 점이 하나 늘 때마다 진폭이 얼마나 작아지는지를 이 수가 정해요.
    - 수소 원자의 에너지 준위가 아주 조금씩 갈라지는 정도도 이 수로 정해져요. 그래서 '미세 구조'라는 이름이 붙었어요.
    - 단위가 없어서, 어느 나라의 단위로 계산해도 값이 똑같아요.
  notThis: 왜 하필 1/137.036인지 알려 주는 이론은 아직 없어요. 재서 알아낸 값이에요.
  taughtIn: 122

# ── 123강 ────────────────────────────
- id: fundamental-interaction
  term: 기본 상호작용
  definition: 더는 다른 힘으로 나눌 수 없는 자연의 기본 힘. 중력, 전자기력, 강한 힘, 약한 힘 넷이 알려져 있다.
  examples:
    - 사과가 떨어지고 달이 지구를 도는 건 중력이에요.
    - 손으로 미는 힘, 마찰, 줄의 당김은 모두 원자 사이의 전자기력이에요.
    - 원자핵을 묶는 건 강한 힘이고, 중성자를 양성자로 바꾸는 건 약한 힘이에요.
  notThis: 마찰이나 물이 떠받치는 힘은 기본 힘이 아니에요. 원자 사이의 전자기력이 모여서 나타나는 힘이에요.
  taughtIn: 123

# ── 124강 ────────────────────────────
- id: standard-model
  term: 표준 모형
  definition: 물질을 이루는 입자 12가지(쿼크 6, 전자 무리 6)와 힘을 나르는 입자, 힉스 입자를 모아, 중력을 뺀 세 기본 힘으로 그 입자들이 주고받는 일을 계산하는 이론.
  examples:
    - 우리 몸을 이루는 업 쿼크, 다운 쿼크, 전자가 모두 이 이론의 표에 들어 있어요.
    - 가속기에서 양성자를 부딪쳤을 때 어떤 입자가 얼마나 자주 생길지 이 이론으로 계산해요.
  notThis: 중력은 들어 있지 않아요. 그리고 '모형'이라는 이름과 달리, 1강의 모형처럼 대충 줄인 그림이 아니라 아주 정밀하게 맞는 이론이에요.
  taughtIn: 124
- id: higgs-boson
  term: 힉스 입자
  aliases: ["힉스 보손"]
  definition: 온 공간을 고르게 채운 힉스 장이 한 덩어리만큼 들뜬 것. 질량은 약 125 GeV로, 2012년에 발견되었다.
  examples:
    - 가속기에서 양성자를 수십억 번 부딪치면 한 번쯤 생겨요.
    - 생기자마자 10⁻²²초쯤 만에 광자 두 개 같은 다른 입자로 바뀌어서, 그 광자로 찾아요.
  notThis: 다른 입자에 붙어서 무게를 더해 주는 알갱이가 아니에요. 질량을 주는 건 온 공간에 퍼진 힉스 장이고, 힉스 입자는 그 장이 있다는 증거예요.
  taughtIn: 124

# ── 125강 ────────────────────────────
- id: symmetry
  term: 대칭
  definition: 어떤 변화를 주어도 그대로인 성질. 물리학에서는 특히 실험을 다른 곳으로 옮기거나, 다른 때에 하거나, 방향을 돌려도 자연의 법칙이 그대로인 것.
  examples:
    - 눈송이는 60°씩 돌려도 모양이 똑같아요. 회전 대칭이에요.
    - 끝없이 이어진 벽지 무늬는 한 칸만큼 옆으로 밀어도 똑같아 보여요.
    - 진자의 주기는 오늘 재든 내일 재든, 조건이 같으면 같은 값이 나와요.
  notThis: 좌우가 똑같은 모양만 뜻하지 않아요. 무엇을 바꿔도 그대로인지가 대칭의 종류를 정해요.
  taughtIn: 125
- id: noether-theorem
  term: 뇌터 정리
  definition: 자연의 법칙이 매끄러운 대칭을 하나 가지면, 그 대칭과 짝이 되는 보존되는 양이 하나 있다는 정리. 1918년 에미 뇌터가 증명했다.
  examples:
    - 실험을 어디로 옮겨도 법칙이 같아서, 운동량이 보존돼요.
    - 실험을 언제 해도 법칙이 같아서, 에너지가 보존돼요.
    - 실험대를 어느 방향으로 돌려도 법칙이 같아서, 피겨 선수가 도는 운동의 양(각운동량)이 보존돼요.
  notThis: 거울에 비추기처럼 한 번에 뚝 바뀌는 대칭에는 이 정리가 쓰이지 않아요. 얼마든지 잘게 바꿀 수 있는 대칭에만 쓰여요.
  taughtIn: 125

# ── 126강 ────────────────────────────
- id: cmb
  term: 우주 배경 복사
  definition: 하늘 어느 방향에서나 거의 같은 세기로 오는, 온도 약 2.725 K의 흑체 복사. 우주가 처음 투명해졌을 때 나온 빛이 우주가 커지면서 식은 것.
  examples:
    - 하늘 어디로 안테나를 돌려도 같은 세기의 잡음으로 잡혀요.
    - 가장 세게 나오는 빛은 1초에 약 1,600억 번 진동하는 전파라서, 맨눈에는 밤하늘이 까맣게 보여요.
  notThis: 우주의 한 점에서 터져 나온 빛이 아니에요. 처음부터 공간 전체를 채우고 있던 빛이라서 사방에서 와요.
  taughtIn: 126
  q: heat

# ── 127강 ────────────────────────────
- id: big-bang
  term: 빅뱅
  definition: 우주가 약 138억 년 전 아주 뜨겁고 빽빽한 상태에서 커지기 시작해 지금에 이르렀다는 우주의 역사.
  examples:
    - 먼 은하일수록 더 빨리 멀어지는 것을 거꾸로 따라가면, 은하들이 한데 모여 있던 때가 나와요.
    - 하늘 어디서나 오는 2.7 K의 우주 배경 복사는 우주가 뜨겁고 빽빽했던 때의 빛이에요.
  notThis: 빈 공간의 한 점에서 일어난 폭발이 아니에요. 공간 전체가 어디서나 함께 커지기 시작한 일이라서, 가운데도 바깥도 없어요.
  taughtIn: 127
- id: inflation
  term: 인플레이션
  definition: 우주가 맨 처음 1초보다 훨씬 짧은 동안 적어도 10²⁶배 넘게 엄청나게 빨리 커졌다는 생각.
  examples:
    - 지금 하늘의 동쪽 끝과 서쪽 끝이 처음엔 한곳에 붙어 있었다고 보면, 두 곳의 온도가 같은 까닭이 풀려요.
    - 원자보다 작던 흔들림이 이때 우주만 한 크기로 늘어났다고 봐요.
  notThis: 물가가 오르는 경제의 인플레이션에서 이름만 따왔어요. 지금도 우주는 커지고 있지만, 그건 인플레이션이 아니라 훨씬 느린 팽창이에요.
  taughtIn: 127
- id: quantum-fluctuation
  term: 양자 요동
  definition: 불확정성 원리 때문에 장의 값이 한 값으로 딱 정해지지 못하고, 아주 작은 크기에서 늘 조금씩 흔들리는 것.
  examples:
    - 텅 빈 공간의 장도 가만히 있지 못하고 원자보다 훨씬 작은 크기에서 흔들려요.
    - 인플레이션 동안 이 흔들림이 늘어나, 우주 배경 복사의 10만분의 1 얼룩이 되었다고 봐요.
  notThis: 재는 기계가 흔들려서 생기는 오차가 아니에요. 자연이 원래 그렇게 흔들려요.
  taughtIn: 127

# ── 128강 ────────────────────────────
- id: dark-matter
  term: 암흑물질
  definition: 빛과는 거의 주고받지 않아 보이지 않지만, 중력은 가진 물질. 원자로 된 보통 물질의 다섯 배쯤 있다고 본다.
  examples:
    - 은하 가장자리의 별이 멀리서도 빨리 도는 건, 은하를 둘러싼 암흑물질이 붙잡아 주기 때문이라고 봐요.
    - 은하단 너머에서 오는 빛이 휘는 정도를 재면, 보이는 것보다 훨씬 많은 질량이 나와요.
  notThis: 검은색 물질이라는 뜻이 아니에요. 빛을 내지도 막지도 않아서 빛으로는 볼 수 없다는 뜻이에요. 암흑에너지와도 달라요.
  taughtIn: 128
  q: force
- id: dark-energy
  term: 암흑에너지
  definition: 공간 어디에나 고르게 퍼져 우주의 팽창을 점점 빨라지게 하는 것. 우주를 이루는 것의 68%쯤으로 본다.
  examples:
    - 먼 초신성이 예상보다 어둡게 보이는 건, 암흑에너지 때문에 우주가 예상보다 빨리 커졌기 때문이라고 봐요.
    - 위로 던진 공은 중력 때문에 느려지지만, 우주의 팽창은 암흑에너지 때문에 오히려 빨라져요.
  notThis: 암흑물질과 하는 일이 거꾸로예요. 암흑물질은 당겨서 은하를 붙잡고, 암흑에너지는 팽창을 밀어붙여요.
  taughtIn: 128
  q: energy

# ── 129강 ────────────────────────────
- id: hawking-radiation
  term: 호킹 복사
  definition: 사건의 지평선 바깥의 양자 요동 때문에 블랙홀이 흑체처럼 내놓는 아주 약한 빛. 온도는 블랙홀의 질량에 반비례한다.
  examples:
    - 해만큼 무거운 블랙홀의 호킹 복사는 6 × 10⁻⁸ K쯤이라, 우주 배경 복사보다 훨씬 차가워요.
    - 작은 산만큼 가벼운 블랙홀이라면 10¹¹ K로 아주 뜨겁게 빛나며 빨리 줄어들어요.
  notThis: 블랙홀 둘레의 뜨거운 가스가 내는 빛(인터스텔라 가르강튀아의 빛나는 고리)과 달라요. 그건 블랙홀로 빨려 드는 물질이 내는 빛이에요.
  taughtIn: 129
  q: heat
- id: information-paradox
  term: 정보 역설
  definition: 블랙홀이 호킹 복사로 다 사라지면 떨어진 것의 정보가 없어지는 것처럼 보이는데, 양자역학은 정보가 사라지지 않는다고 말해서 생기는 맞부딪힘.
  examples:
    - 블랙홀에 책을 떨어뜨리면, 블랙홀이 다 사라진 뒤 그 책의 글자는 어디에 남을까 하는 물음이에요.
    - 1997년 호킹과 킵 손, 존 프레스킬이 이 문제를 두고 백과사전 내기를 했어요.
  notThis: 책을 태우면 다시 읽기 어려운 것과는 달라요. 태운 책의 정보는 재와 연기와 빛에 뒤섞여 원리로는 남아요. 블랙홀은 정보를 원리로도 지우는 것처럼 보여서 문제예요.
  taughtIn: 129

# ── 130강 ────────────────────────────
- id: quantum-gravity
  term: 양자 중력
  definition: 양자역학과 중력(일반상대성이론)을 함께 담아, 플랑크 길이처럼 둘이 함께 중요해지는 곳에서도 맞게 계산하는 이론. 아직 완성되지 않았다.
  examples:
    - 블랙홀의 한가운데에서 무슨 일이 일어나는지 말하려면 양자 중력이 있어야 해요.
    - 우주가 커지기 시작한 맨 처음을 계산하려면 양자 중력이 있어야 해요.
  notThis: 이미 있는 이론의 이름이 아니에요. 끈 이론, 고리 양자 중력 같은 후보가 있지만, 아직 시험으로 가려지지 않았어요.
  taughtIn: 130

