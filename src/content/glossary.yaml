# ── 37강 ─────────────────────────────
- id: electron
  term: 전자
  definition: 모든 원자 안에 들어 있는, 아주 가볍고 음(−) 전하를 띤 알갱이. 질량은 가장 가벼운 원자인 수소 원자의 약 1,836분의 1이다.
  examples:
    - 옛날 브라운관 TV는 전자의 줄기로 화면 안쪽을 때려서 빛을 냈어요.
    - 겨울에 문손잡이를 잡을 때 찌릿한 건, 몸에 쌓였던 전자가 한꺼번에 손잡이로 옮겨 가기 때문이에요.
  notThis: 전류와는 달라요. 전류는 전자 같은 알갱이가 줄지어 흐르는 것이고, 전자는 그 알갱이 하나예요.
  taughtIn: 37
  previewIn: [16, 18, 19, 20, 34, 35, 36]
  q: charge
- id: cathode-ray
  term: 음극선
  definition: 공기를 거의 다 뺀 유리관 안에서, 전지의 − 극에 이은 금속판(음극)에서 나와 곧게 뻗어 가는 전자의 줄기.
  examples:
    - 옛날 브라운관 TV 속에서는 음극선이 화면 안쪽을 빠르게 훑으며 그림을 그렸어요.
    - 병원과 공항의 X선 장치는 음극선을 금속판에 세게 부딪혀서 X선을 만들어요.
  notThis: 빛의 한 종류가 아니에요. 이름에 '선'이 붙었지만, 전기를 띤 판 사이를 지나면 휘는 알갱이의 흐름이에요.
  taughtIn: 37

# ── 38강 ─────────────────────────────
- id: elementary-charge
  term: 기본 전하
  definition: 홀로 떨어져 있는 알갱이가 띨 수 있는 가장 작은 전하의 크기. 약 1.602 × 10⁻¹⁹ C이고 기호로 e라고 쓴다. 전자 하나의 전하는 −e다.
  unit: C (쿨롱)
  examples:
    - 머리카락에 문지른 풍선이 띤 전하도 e를 1조 번쯤 더한 값이에요. 수가 워낙 많아서 덩어리로 느껴지지 않을 뿐이에요.
    - 전하 1 C는 전자 약 6.2 × 10¹⁸개가 띤 전하를 모두 더한 크기예요.
  notThis: 전하를 아무 크기로나 나눌 수 있다는 생각과는 달라요. 0.5e나 1.3e 같은 전하를 띤 알갱이는 홀로 발견된 적이 없어요. 쿼크라는 알갱이는 e의 3분의 1 단위 전하를 띠지만, 늘 둘이나 셋씩 묶여 있어서 홀로 나타나지 않아요.
  taughtIn: 38
  q: charge
  highlight: true

# ── 39강 ─────────────────────────────
- id: nucleus
  term: 원자핵
  definition: 원자 한가운데에 있는 아주 작은 부분. 원자의 + 전하 전부와 질량의 99.9 % 이상이 여기 모여 있고, 지름은 원자의 1만분의 1에서 10만분의 1쯤이다.
  examples:
    - 원자를 지름 100 m인 축구장만큼 키우면, 원자핵은 한가운데 놓인 몇 mm짜리 구슬만 해요.
    - 우리 몸무게도 거의 다 몸을 이루는 원자들의 원자핵 무게예요.
  notThis: 원자 전체와는 달라요. 원자핵은 원자 안의 아주 작은 중심이고, 원자의 크기는 그 둘레의 전자들이 정해요.
  taughtIn: 39
- id: alpha-particle
  term: 알파 입자
  definition: 라듐 같은 물질이 저절로 내뿜는, + 전하 2e를 띤 무거운 알갱이. 헬륨 원자에서 전자 두 개가 빠진 것과 같고, 질량은 전자의 약 7,300배다.
  examples:
    - 집에 다는 연기 감지기 가운데에는 알파 입자로 공기에 전기가 통하게 해 두고, 연기가 들어와 전기가 줄어들면 울리는 것이 있어요.
    - 알파 입자는 종이 한 장이나 피부의 바깥층에도 막혀요.
  notThis: 빛의 한 종류가 아니에요. 질량과 + 전하를 가진 알갱이라서, 전기를 띤 판 사이를 지나면 − 판으로 휘어요.
  taughtIn: 39

# ── 40강 ─────────────────────────────
- id: circular-motion
  term: 원운동
  definition: 물체가 한 점을 중심에 두고 같은 거리를 유지하며 원을 그리는 움직임. 빠르기가 일정해도 움직이는 방향이 계속 바뀌므로 가속도가 있다.
  examples:
    - 놀이공원 회전목마의 말은 가운데 기둥을 중심으로 원운동을 해요.
    - 국제우주정거장은 지구 둘레를 약 92분에 한 바퀴씩 원운동에 가깝게 돌아요.
  notThis: 가속도가 없는 움직임이 아니에요. 속도계 바늘이 그대로여도 방향이 계속 바뀌니까 속도는 계속 바뀌어요.
  taughtIn: 40
  previewIn: [12]
  q: motion
- id: centripetal-force
  term: 구심력
  definition: 원운동하는 물체를 원의 중심으로 끌어당기는 힘. 크기는 질량 × 속력² ÷ 반지름이다. 새로운 종류의 힘이 아니라 줄이 당기는 힘, 중력, 마찰, 전기력 같은 힘이 이 역할을 맡는다.
  unit: N
  examples:
    - 물 담은 양동이를 빙빙 돌릴 때, 팔이 손잡이를 당기는 힘이 구심력이에요.
    - 자동차가 굽은 길을 돌 때는 타이어와 길 사이의 마찰이 구심력이 돼요. 빙판길에서 차가 미끄러지는 건 이 힘이 모자라서예요.
  notThis: 원 바깥으로 미는 힘이 아니에요. 버스가 돌 때 몸이 바깥으로 쏠리는 느낌은 몸이 하던 대로 곧게 가려는 관성 때문이에요.
  taughtIn: 40
  q: force
  highlight: true

# ── 41강 ─────────────────────────────
# (새 용어 없음)

# ── 42강 ─────────────────────────────
- id: line-spectrum
  term: 선 스펙트럼
  definition: 원소의 기체가 내는 빛을 진동수에 따라 나눴을 때, 어두운 바탕에 몇 개의 밝은 선만 나타나는 스펙트럼. 선이 놓이는 진동수는 원소마다 정해져 있다.
  examples:
    - 네온사인의 빛을 나누면 붉은빛과 주황빛 근처에 밝은 선이 여럿 보여요.
    - 노란 나트륨 가로등의 빛은 거의 다 노란빛 근처의 선 두 개에 몰려 있어요.
  notThis: 햇빛이나 백열전구의 빛처럼 모든 진동수가 끊김 없이 이어진 무지개 띠와는 달라요.
  taughtIn: 42
- id: absorption-line
  term: 흡수선
  definition: 모든 진동수가 섞인 빛이 차가운 기체를 지날 때, 그 기체가 흡수한 진동수의 자리만 어둡게 빠져서 스펙트럼에 생기는 검은 선. 그 자리는 같은 기체가 뜨거울 때 내는 밝은 선의 자리와 같다.
  examples:
    - 햇빛의 스펙트럼에는 태양 바깥층의 나트륨이 만든 검은 선 두 개가 노란빛 근처에 있어요.
    - 천문학자는 별빛의 흡수선을 보고, 가 보지 않고도 그 별에 어떤 원소가 있는지 알아내요.
  notThis: 빛이 하나도 없는 자리는 아니에요. 그 진동수의 빛이 주변보다 훨씬 약할 뿐이에요.
  taughtIn: 42

# ── 43강 ─────────────────────────────
- id: balmer-formula
  term: 발머 공식
  definition: 수소가 내는 눈에 보이는 선들의 자리를 하나의 식으로 맞힌 공식. 파장으로 쓰면 364.56 nm × n² ÷ (n² − 4)이고, 진동수로 쓰면 약 822조 Hz × (1 − 4 ÷ n²)이다. n에 3, 4, 5, 6을 넣으면 수소의 네 선이 나온다.
  examples:
    - n = 3을 넣으면 822조 × 5/9 ≈ 457조 Hz, 수소의 붉은 선이 나와요.
    - n을 아주 크게 하면 진동수가 822조 Hz에 다가가요. 그래서 수소의 선들은 그 근처로 갈수록 빽빽하게 몰려요.
  notThis: 원자 속에서 왜 그런 선이 생기는지 설명하는 이론이 아니에요. 측정값에 꼭 맞는 규칙을 찾아낸 것이고, 그 까닭은 1913년 보어가 설명했어요.
  taughtIn: 43

# ── 44강 ─────────────────────────────
- id: energy-level
  term: 에너지 준위
  definition: 원자 속 전자가 가질 수 있도록 허락된 에너지 값 하나하나. 수소에서는 −2.18 × 10⁻¹⁸ J ÷ n²(n = 1, 2, 3 …)이고, 그 사이의 값은 가질 수 없다.
  unit: J
  examples:
    - 네온사인이 늘 같은 색으로 빛나는 건 네온 원자의 에너지 준위가 늘 같은 자리에 있기 때문이에요.
    - 나트륨 가로등의 노란빛은 나트륨 원자의 두 에너지 준위 사이의 차이만큼의 에너지를 가진 빛이에요.
  notThis: 전자가 있는 장소의 높이가 아니에요. 에너지의 크기를 늘어놓은 것이에요. 계단처럼 그리지만 실제로 위아래에 층이 있는 건 아니에요.
  taughtIn: 44
  q: energy
- id: ground-state
  term: 바닥상태
  definition: 원자가 가질 수 있는 가장 낮은 에너지 상태. 수소에서는 n = 1이고 에너지는 −2.18 × 10⁻¹⁸ J다. 더 내려갈 준위가 없으니 빛을 내지 않고 그대로 머문다.
  examples:
    - 우리가 숨 쉬는 공기 속 원자는 거의 다 바닥상태에 있어요. 그래서 공기는 스스로 빛나지 않아요.
    - 꺼진 형광등 속 수은 원자는 바닥상태에 있다가, 전기가 흐르면 위의 준위로 올라갔다 내려오며 빛을 내요.
  notThis: 에너지가 0인 상태가 아니에요. 바닥상태의 에너지는 음수이고, 0은 전자가 원자에서 떨어져 나간 상태예요.
  taughtIn: 44
  q: energy
- id: bohr-model
  term: 보어 모형
  definition: 1913년 닐스 보어가 내놓은 원자 모형. 전자는 정해진 에너지 준위에만 있을 수 있고 그동안은 빛을 내지 않으며, 한 준위에서 다른 준위로 옮겨 갈 때만 그 차이만큼의 에너지를 가진 빛 하나를 내거나 흡수한다.
  examples:
    - 보어 모형으로 계산한 수소의 선의 진동수는 측정값과 꼭 맞아요.
    - 과학책에서 원자핵 둘레에 원 몇 개를 겹쳐 그린 원자 그림은 보어 모형을 그린 거예요.
  notThis: 원자의 정확한 모습은 아니에요. 전자가 정말 원 위를 도는 게 아니라는 걸 뒤에서 배워요. 수소에는 잘 맞지만 전자가 여럿인 원자에는 잘 맞지 않아요.
  taughtIn: 44

# ── 45강 ─────────────────────────────
- id: rydberg-constant
  term: 뤼드베리 상수
  definition: 수소가 내는 모든 선의 진동수를 정하는 상수. 진동수로 쓰면 약 3.29 × 10¹⁵ Hz(3,289조 Hz)이고, 선의 진동수는 이 값 × (1/m² − 1/n²)이다. 파장의 역수로 쓰면 약 1.097 × 10⁷ /m다.
  examples:
    - 천문학자는 뤼드베리 상수로 계산한 수소 선의 자리와 별빛의 선을 견줘서, 별에 수소가 있는지 알아봐요.
    - 뤼드베리 상수는 지금까지 가장 정밀하게 잰 물리 상수 가운데 하나로, 열두 자리 넘게 알려져 있어요.
  notThis: 발머 공식의 3,289조 Hz와 다른 수가 아니에요. 같은 수 하나로 자외선, 눈에 보이는 빛, 적외선의 모든 수소 선을 계산할 수 있어요.
  taughtIn: 45

# ── 46강 ─────────────────────────────
- id: excited-state
  term: 들뜬상태
  definition: 원자가 바닥상태보다 높은 에너지 준위에 있는 상태. 대개 아주 짧은 시간 안에 빛을 내며 더 낮은 준위로 내려온다.
  examples:
    - 형광등 속 수은 원자는 부딪힌 전자에게서 에너지를 받아 들뜬상태가 됐다가, 내려오며 자외선을 내요. 그 자외선이 관 안쪽에 바른 물질을 빛나게 해요.
    - 네온사인의 네온 원자도 전기를 흘리면 들뜬상태가 됐다가 내려오며 붉은 주황빛을 내요.
  notThis: 원자가 망가지거나 쪼개진 상태가 아니에요. 전자는 여전히 원자에 붙어 있고, 에너지만 바닥상태보다 높아요.
  taughtIn: 46
  q: energy

# ── 47강 ─────────────────────────────
- id: matter-wave
  term: 물질파
  definition: 전자나 원자처럼 질량이 있는 알갱이가 함께 지니는 파동의 성질. 1924년 루이 드브로이가 처음 내놓았다.
  examples:
    - 전자현미경은 전자의 물질파를 써서, 빛으로는 볼 수 없는 바이러스나 원자의 배열까지 보여 줘요.
    - 1999년에는 탄소 원자 60개가 축구공 모양으로 묶인 분자도 회절해서 간섭 무늬를 만들었어요.
  notThis: 알갱이가 물결 모양으로 출렁이며 날아간다는 뜻이 아니에요. 전자는 언제 재도 알갱이 하나로 발견돼요. 무엇이 파동처럼 퍼지는지는 58강에서 다뤄요.
  taughtIn: 47
- id: de-broglie-wavelength
  term: 드브로이 파장
  definition: 질량이 있는 알갱이가 지니는 물질파의 파장. 플랑크 상수 h를 그 알갱이의 운동량 p(질량 × 속도)로 나눈 값, λ = h ÷ p다.
  unit: m
  examples:
    - 시속 144 km로 날아가는 야구공의 드브로이 파장은 약 10⁻³⁴ m로, 원자핵보다도 10¹⁹배쯤 짧아요.
    - 전압 100 V로 가속한 전자의 드브로이 파장은 약 0.12 nm로, 원자 하나의 크기와 비슷해요.
  notThis: 알갱이의 크기가 아니에요. 같은 전자라도 빠를수록 운동량이 커져서 파장이 짧아져요.
  taughtIn: 47
  q: space
  highlight: true

# ── 48강 ─────────────────────────────
# (새 용어 없음)

# ── 49강 ─────────────────────────────
- id: electron-diffraction
  term: 전자 회절
  definition: 전자가 결정 속 원자의 줄이나 아주 얇은 막을 지나며 파동처럼 퍼지고 간섭해서, 정해진 방향으로 몰려 나가는 현상. 전자의 물질파가 실제로 있다는 증거다.
  examples:
    - 과학자들은 전자 회절 무늬를 찍어서 금속이나 얼음 결정 속 원자가 어떻게 늘어서 있는지 알아내요.
    - 스마트폰 칩 공장에서는 칩에 쌓는 아주 얇은 막의 원자가 고르게 늘어섰는지 전자 회절로 확인해요.
  notThis: 전자가 원자에 부딪혀 아무렇게나 튕기는 게 아니에요. 아무렇게나 튕긴다면 모든 방향으로 고르게 퍼졌을 텐데, 전자 회절에서는 정해진 방향에만 몰려요.
  taughtIn: 49

# ── 50강 ─────────────────────────────
- id: wave-particle-duality
  term: 파동-입자 이중성
  aliases: ["이중성"]
  definition: 빛과 전자 같은 것들이, 검출될 때는 늘 알갱이 하나로 한 점에 나타나지만, 어디에 나타날지의 확률은 파동처럼 퍼지고 간섭하는 성질.
  examples:
    - 전자를 하나씩 이중 슬릿에 보내면 화면에 점이 하나씩 찍히는데, 수만 개가 모이면 간섭 무늬가 돼요.
    - 아주 어두운 곳에서 찍은 스마트폰 사진이 자글자글한 까닭 가운데 하나는, 빛이 광자 하나하나로 띄엄띄엄 닿기 때문이에요. 밝은 곳에서는 수많은 광자가 모여 매끈한 사진이 돼요.
  notThis: 반은 파동이고 반은 알갱이라는 뜻도, 때에 따라 파동이 됐다가 알갱이가 됐다가 한다는 뜻도 아니에요. 늘 알갱이 하나로 검출되고, 그 확률이 늘 파동처럼 움직여요.
  taughtIn: 50

# ── 51강 ─────────────────────────────
- id: complementarity
  term: 상보성
  definition: 같은 대상을 온전히 설명하는 데 둘 다 필요하지만, 한 실험에서 동시에 다 드러낼 수는 없는 두 모습이 짝을 이룬다는 생각. 1927년 닐스 보어가 내놓았다. 전자가 어느 길로 갔는지 알아낼수록 간섭 무늬는 흐려진다.
  examples:
    - 꽃병으로도, 마주 보는 두 얼굴로도 보이는 그림은 한 번에 한 가지로만 보여요. 상보성을 설명할 때 자주 드는 비유예요.
    - 전자가 어느 틈으로 지났는지 기록하는 장치를 켜면, 하나씩 쌓이던 점들이 더는 간섭 무늬를 그리지 않아요.
  notThis: 두 모습이 반씩 섞여 있다는 뜻이 아니에요. 그리고 사람이 보느냐 마느냐가 아니라, 경로를 알아낼 수 있는 기록이 어딘가에 남느냐가 무늬를 정해요.
  taughtIn: 51

# ── 52강 ─────────────────────────────
- id: imaginary-number
  term: 허수
  definition: 제곱하면 음수가 되는 수. 제곱해서 −1이 되는 수를 i라고 쓰고(i² = −1), 3i, −2i처럼 실수에 i를 곱한 수를 허수라고 한다.
  examples:
    - 계산기에 √−1을 넣으면 오류가 나요. 계산기는 실수만 다루는데, 제곱해서 −1이 되는 실수는 없거든요.
    - 와이파이와 휴대전화의 신호를 처리하는 칩은 신호의 세기와 박자를 함께 다루려고 허수가 들어간 수로 계산해요.
  notThis: 상상 속에만 있는 가짜 수라는 뜻이 아니에요. 이름이 그렇게 붙었을 뿐, 계산 규칙이 분명하고 물리학과 공학에서 늘 써요.
  taughtIn: 52
- id: complex-number
  term: 복소수
  definition: 실수와 허수를 더한 꼴의 수. a + bi로 쓰고, a를 실수부, b를 허수부라고 한다.
  examples:
    - 3 + 2i는 실수부가 3, 허수부가 2인 복소수예요.
    - 실수 5도 5 + 0i로 볼 수 있으니, 실수는 모두 복소수에 들어가요.
  notThis: 두 수를 따로 늘어놓은 것이 아니에요. a + bi는 하나의 수이고, 더하고 곱하는 규칙이 정해져 있어요.
  taughtIn: 52
- id: complex-plane
  term: 복소평면
  definition: 복소수 a + bi를 가로로 a, 세로로 b만큼 간 점으로 나타내는 평면. 가로축을 실수 축, 세로축을 허수 축이라고 한다.
  examples:
    - 복소수 2 + 3i는 복소평면에서 0에서 가로로 2, 세로로 3만큼 간 점이에요.
    - 지도에서 동쪽으로 몇 km, 북쪽으로 몇 km 간 자리를 찍듯이, 복소수 하나는 평면 위의 자리 하나예요.
  notThis: 수직선이 두 개 있는 것이 아니에요. 실수는 가로축 위에만 있고, 복소수는 평면 전체에 퍼져 있어요.
  taughtIn: 52

# ── 53강 ─────────────────────────────
- id: modulus
  term: 절댓값
  definition: 복소평면에서 0부터 그 복소수까지의 거리. a + bi의 절댓값은 √(a² + b²)이고 |a + bi|로 쓴다.
  examples:
    - 3 + 4i의 절댓값은 √(9 + 16) = 5예요. 가로 3, 세로 4인 직각삼각형의 빗변이죠.
    - 실수 −7의 절댓값은 7이에요. 수직선에서 0까지의 거리라서, 중학교에서 배운 절댓값과 같은 뜻이에요.
  notThis: 실수부와 허수부를 더한 값이 아니에요. 3 + 4i의 절댓값은 7이 아니라 5예요.
  taughtIn: 53
- id: argument
  term: 편각
  definition: 복소평면에서 양의 실수 축으로부터, 0에서 그 복소수로 뻗은 화살표까지 시곗바늘과 반대 방향으로 잰 각도.
  unit: ° (도)
  examples:
    - i의 편각은 90°이고, −1의 편각은 180°예요.
    - 1 + i의 편각은 45°예요. 가로와 세로가 같아서 대각선 방향을 가리키거든요.
  notThis: 시곗바늘 방향으로 잰 각도가 아니에요. 복소평면에서는 시곗바늘과 반대로 도는 쪽을 +로 재요.
  taughtIn: 53

