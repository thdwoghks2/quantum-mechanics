# 용어집. 용어마다 정식으로 가르치는 강(taughtIn)이 하나 있다.
# 그 강보다 앞선 강에서는 이 용어를 쓸 수 없다(npm run validate가 검사한다).
# 정식 도입 = 정의 카드 + 일상 예시 2개 + 시각 자료 + 확인 문제.
# q: 물리량 묶음(색). highlight: 글 속에서 색 밑줄을 칠지.

# ── 1강 ───────────────────────────────
- id: law
  term: 법칙
  definition: 같은 조건이면 언제 어디서나 똑같이 일어나는 자연의 규칙.
  examples:
    - 손에서 놓은 물체는 아래로 떨어진다.
    - 해수면 높이에서 물은 100 ℃에서 끓는다.
  notThis: 사람이 정한 규칙(교통 법규, 학교 규칙). 자연의 법칙은 사람이 바꿀 수 없고, 관찰과 맞지 않으면 법칙 쪽을 고친다.
  taughtIn: 1
- id: prediction
  term: 예측
  definition: 법칙을 써서, 아직 보지 않은 일이 어떻게 될지 미리 말하는 것.
  examples:
    - 천문학자는 수십 년 뒤 일식이 일어날 날짜와 시각을 미리 알려 준다.
    - 공을 던지는 순간 그 공이 떨어질 자리를 짐작한다.
  notThis: 맞았는지 확인할 방법이 없는 말(점괘). 과학의 예측은 맞았는지 틀렸는지 나중에 확인할 수 있다.
  taughtIn: 1
- id: model
  term: 모형
  definition: 실제 대상에서 지금 알고 싶은 것에 중요한 부분만 남기고 나머지를 버려, 단순하게 만든 설명.
  examples:
    - 지하철 노선도는 역의 순서와 갈아타는 곳만 남기고, 실제 거리와 방향은 버렸다.
    - 던진 공의 움직임을 계산할 때 공기를 무시하고 공을 점 하나로 본다.
  notThis: 실물을 그대로 작게 줄인 모형 비행기. 물리학의 모형은 일부러 많은 것을 버린다.
  taughtIn: 1

# ── 2강 ───────────────────────────────
- id: power-of-ten
  term: 10의 거듭제곱
  aliases: [거듭제곱]
  definition: 10을 여러 번 곱한 수. 10ⁿ은 10을 n번 곱한 수로, 1 뒤에 0이 n개 붙는다. 10⁻ⁿ은 1을 10으로 n번 나눈 수다.
  examples:
    - 10³ = 10 × 10 × 10 = 1,000
    - 10⁻³ = 1 ÷ 10 ÷ 10 ÷ 10 = 0.001
  notThis: 10 × n. 10³은 30이 아니라 1,000이다.
  taughtIn: 2
- id: scientific-notation
  term: 과학적 표기법
  definition: 어떤 수를 (1 이상 10 미만의 수) × 10ⁿ 꼴로 쓰는 방법.
  examples:
    - 지구에서 태양까지의 거리 150,000,000,000 m = 1.5 × 10¹¹ m
    - 머리카락 굵기 0.0001 m = 1 × 10⁻⁴ m
  notThis: 15 × 10¹⁰처럼 앞의 수가 10 이상인 꼴. 값은 같지만 과학적 표기법으로는 1.5 × 10¹¹로 쓴다.
  taughtIn: 2
- id: order-of-magnitude
  term: 자릿수
  definition: 어떤 양이 10의 몇 제곱쯤인지를 나타낸 크기의 단계. 10배 차이가 날 때마다 한 단계씩 달라진다.
  examples:
    - 사람의 키(약 1 m)와 30층 건물의 높이(약 100 m)는 자릿수가 두 단계 다르다.
    - 해변의 모래알 수를 어림할 때는 정확한 개수 대신 자릿수를 맞힌다.
  notThis: 숫자를 쓸 때의 자리 개수만 뜻하는 일상어. 여기서는 0.001처럼 1보다 작은 수에도 쓴다.
  taughtIn: 2

# ── 3강 ───────────────────────────────
- id: unit
  term: 단위
  definition: 양을 잴 때 기준으로 삼는 정해진 크기. 측정값은 그 양이 기준의 몇 배인지를 센 수다.
  examples:
    - 키 165 cm는 1 cm의 165배라는 뜻이다.
    - 1시간에 60 km를 가는 빠르기는 60 km/h로 쓴다.
  notThis: 숫자만 있는 값. 3이라고만 쓰면 3 m인지 3 km인지 알 수 없다.
  taughtIn: 3
- id: si
  term: 국제단위계
  aliases: [SI 단위]
  definition: 전 세계 과학자가 함께 쓰는 단위 체계. 길이는 미터(m), 물체의 양은 킬로그램(kg), 시간은 초(s)를 기본으로 한다.
  examples:
    - 100 m 달리기 세계 기록은 9.58초(s)다.
    - 생수 1리터는 약 1 kg이다.
  notThis: 나라마다 따로 쓰는 단위(자, 근, 마일, 파운드).
  taughtIn: 3
- id: prefix
  term: 접두어
  definition: 단위 앞에 붙여 10의 거듭제곱 배를 나타내는 말. 킬로(k)는 10³, 밀리(m)는 10⁻³, 마이크로(μ)는 10⁻⁶, 나노(n)는 10⁻⁹이다.
  examples:
    - 1 km = 10³ m = 1,000 m
    - 1 nm = 10⁻⁹ m. 머리카락 굵기의 약 10만분의 1이다.
  notThis: 단위 자체. km는 새 단위가 아니라 m에 '천 배'를 붙인 것이다.
  taughtIn: 3

# ── 4강 ───────────────────────────────
- id: speed
  term: 속력
  definition: 1초 동안 움직인 거리. 움직인 거리를 걸린 시간으로 나눠 구한다.
  unit: m/s (미터 매 초)
  examples:
    - 100 m를 10초에 달리면 속력은 10 m/s다.
    - 고속도로를 100 km/h로 달리는 자동차의 속력은 약 28 m/s다.
  notThis: 속도. 속력에는 방향이 없다.
  taughtIn: 4
  q: motion
  highlight: true
- id: velocity
  term: 속도
  definition: 속력에 움직이는 방향까지 붙인 양.
  unit: m/s
  examples:
    - 북쪽으로 10 m/s
    - 원형 트랙을 같은 속력으로 도는 사람은 방향이 계속 바뀌므로 속도가 계속 바뀐다.
  notThis: 속력. 일상에서는 둘을 섞어 쓰지만 물리학에서는 구별한다.
  taughtIn: 4
  q: motion
  highlight: true
- id: acceleration
  term: 가속도
  definition: 1초 동안 속도가 얼마나 바뀌었는지 나타낸 양. 바뀐 속도를 걸린 시간으로 나눠 구한다.
  unit: m/s² (미터 매 초 제곱)
  examples:
    - 멈춰 있던 자동차가 5초 만에 25 m/s가 되면 가속도는 5 m/s²다.
    - 손에서 놓은 공은 1초마다 약 9.8 m/s씩 빨라진다.
  notThis: 빠르기 자체. 아무리 빨리 달려도 속도가 바뀌지 않으면 가속도는 0이다.
  taughtIn: 4
  q: motion
  highlight: true

# ── 5강 ───────────────────────────────
- id: inertia
  term: 관성
  definition: 물체가 지금의 속도를 그대로 유지하려는 성질. 멈춰 있는 물체는 멈춰 있으려 하고, 움직이는 물체는 같은 속도로 계속 움직이려 한다.
  examples:
    - 달리던 버스가 급정거하면 승객의 몸이 앞으로 쏠린다.
    - 얼음 위에서 한 번 민 퍽은 멈추지 않고 오래 미끄러진다.
  notThis: 물체를 움직이게 하는 힘. 관성은 힘이 아니라 물체의 성질이다.
  taughtIn: 5
- id: force
  term: 힘
  pattern: '힘(?![들쓸겹껏])'
  definition: 물체의 속도를 바꾸는 밀기나 당기기.
  unit: N (뉴턴)
  examples:
    - 마트 카트를 미는 손
    - 공을 아래로 끌어당기는 지구
  notThis: 움직임 자체. 같은 속도로 미끄러지는 물체에는 속도를 바꾸는 힘이 없어도 된다.
  taughtIn: 5
  q: force
  highlight: true
- id: mass
  term: 질량
  definition: 물체의 속도를 바꾸기 어려운 정도. 물체에 든 물질의 양이라고 봐도 된다.
  unit: kg (킬로그램)
  examples:
    - 짐이 가득 찬 카트는 빈 카트보다 같은 힘으로 밀어도 덜 빨라진다.
    - 같은 사람의 질량은 지구에서나 달에서나 같다.
  notThis: 무게. 무게는 지구가 끌어당기는 힘이라서 장소에 따라 달라진다.
  taughtIn: 5
  q: force
  highlight: true
- id: newton-unit
  term: 뉴턴(N)
  pattern: '뉴턴\(N\)'
  definition: 힘의 단위. 질량 1 kg인 물체를 1초에 1 m/s씩 빨라지게 하는 힘이 1 N이다.
  examples:
    - 100 g짜리 사과를 지구가 끌어당기는 힘은 약 1 N이다.
    - 어른이 카트를 힘껏 밀 때의 힘은 수백 N이다.
  notThis: 사람 이름 뉴턴. 단위 이름이 그의 이름에서 왔다.
  taughtIn: 5
  q: force
- id: gravity
  term: 중력
  definition: 질량을 가진 물체끼리 서로 끌어당기는 힘. 지구 위에서는 모든 물체를 지구 중심 쪽으로 당긴다.
  examples:
    - 손에서 놓은 사과가 떨어진다.
    - 달이 지구 둘레를 돈다.
  notThis: 자석이 쇠를 당기는 힘. 그것은 자기력이다.
  taughtIn: 5
  q: force
- id: weight
  term: 무게
  definition: 물체를 지구가 끌어당기는 힘의 크기. 질량에 9.8을 곱하면 뉴턴 단위의 무게가 된다.
  unit: N
  examples:
    - 질량 1 kg인 물체의 지구에서의 무게는 약 9.8 N이다.
    - 같은 물체도 달에서는 무게가 지구의 약 6분의 1이다.
  notThis: 질량. 체중계에 뜨는 kg은 무게를 재서 질량으로 바꿔 보여 준 값이다.
  taughtIn: 5
  q: force
- id: second-law
  term: 가속도 법칙
  aliases: [F = ma]
  definition: 물체가 얻는 가속도는 받는 힘에 비례하고, 질량에 반비례한다. 식으로는 힘 = 질량 × 가속도, F = ma.
  examples:
    - 같은 힘으로 밀면 질량이 2배인 카트는 가속도가 절반이다.
    - 같은 카트를 2배의 힘으로 밀면 가속도가 2배다.
  notThis: 힘이 속력을 만든다는 생각. 힘은 속도를 '바꾼다'.
  taughtIn: 5

# ── 6강 ───────────────────────────────
- id: energy
  term: 에너지
  definition: 모습을 바꿔도 모두 더한 양은 늘지도 줄지도 않는 양. 물체를 움직이거나 데우는 데 쓰인다.
  unit: J (줄)
  examples:
    - 달리는 자동차, 높이 들린 돌, 충전된 배터리, 뜨거운 물은 모두 에너지를 가지고 있다.
    - 브레이크를 밟으면 자동차의 운동 에너지가 브레이크를 데우는 열로 바뀐다.
  notThis: 힘. 힘은 속도를 바꾸는 밀기·당기기이고, 에너지는 모습이 바뀌어도 총량이 남는 양이다.
  taughtIn: 6
  q: energy
  highlight: true
- id: kinetic-energy
  term: 운동 에너지
  definition: 움직이는 물체가 가진 에너지. ½ × 질량 × 속력².
  unit: J
  examples:
    - 속력이 2배가 되면 운동 에너지는 4배가 된다.
    - 질량 1 kg인 공이 10 m/s로 날아가면 운동 에너지는 50 J이다.
  notThis: 운동량. 운동량은 질량 × 속도이고, 7강에서 다룬다.
  taughtIn: 6
  q: energy
  highlight: true
- id: potential-energy
  term: 위치 에너지
  definition: 높은 곳에 있어서 가진 에너지. 질량 × 9.8 × 높이(mgh). 물체가 떨어지면 운동 에너지로 바뀐다.
  unit: J
  examples:
    - 롤러코스터는 첫 언덕 꼭대기에서 위치 에너지가 가장 크다.
    - 질량 1 kg인 물체를 1 m 들어 올리면 위치 에너지가 약 9.8 J 늘어난다.
  notThis: 이미 쓴 에너지. 위치 에너지는 아직 다른 모습으로 바뀌지 않고 남아 있는 에너지다.
  taughtIn: 6
  q: energy
  highlight: true
- id: joule
  term: 줄(J)
  pattern: '줄\(J\)'
  definition: 에너지의 단위. 1 J은 100 g짜리 사과를 약 1 m 들어 올리는 데 드는 에너지다.
  examples:
    - 스마트폰 배터리 하나를 가득 채우면 약 5만 J이다.
    - 밥 한 공기(약 300 kcal)에 든 에너지는 약 125만 J이다.
  notThis: 기타 줄의 '줄'. 단위 이름은 영국의 물리학자 제임스 줄의 이름에서 왔다.
  taughtIn: 6
  q: energy
- id: energy-conservation
  term: 에너지 보존
  aliases: [에너지 보존 법칙]
  definition: 에너지는 모습만 바뀔 뿐, 모두 더한 양은 늘지도 줄지도 않는다는 법칙.
  examples:
    - 마찰이 없는 롤러코스터는 운동 에너지와 위치 에너지를 더한 값이 처음부터 끝까지 같다.
    - 마찰이 있으면 줄어든 운동 에너지만큼 열이 생긴다.
  notThis: 에너지를 아껴 쓰자는 말(에너지 절약). 보존 법칙은 사람이 지키는 규칙이 아니라 자연의 법칙이다.
  taughtIn: 6

# ── 7강 ───────────────────────────────
- id: momentum
  term: 운동량
  definition: 질량 × 속도. 움직이는 물체를 멈추게 하기가 얼마나 어려운지를 나타낸다.
  unit: kg·m/s
  examples:
    - 같은 빠르기라면 트럭이 자전거보다 운동량이 훨씬 크다.
    - 0.15 kg 야구공이 40 m/s로 날아오면 운동량은 6 kg·m/s다.
  notThis: 운동 에너지. 운동량에는 방향이 있고, 속도에 비례한다(제곱이 아니다).
  taughtIn: 7
  q: force
  highlight: true
- id: impulse
  term: 충격량
  definition: 힘 × 그 힘이 작용한 시간. 물체의 운동량이 바뀐 양과 같다.
  unit: N·s
  examples:
    - 공을 받을 때 손을 당기면 같은 충격량을 더 긴 시간 동안 받으므로 힘이 작아진다.
    - 자동차 에어백은 몸이 멈추는 시간을 늘려 충격을 줄인다.
  notThis: 힘. 같은 충격량이라도 시간이 짧으면 큰 힘, 길면 작은 힘이 된다.
  taughtIn: 7
  q: force
- id: action-reaction
  term: 작용 반작용
  aliases: [작용 반작용 법칙]
  definition: 두 물체가 서로에게 주는 힘은 크기가 같고 방향이 반대라는 법칙.
  examples:
    - 스케이트장에서 친구를 밀면 나도 뒤로 밀려난다.
    - 로켓은 가스를 뒤로 밀어내고, 가스는 로켓을 앞으로 민다.
  notThis: 한 물체에 작용하는 두 힘이 서로 상쇄되는 것. 작용과 반작용은 서로 다른 물체에 작용한다.
  taughtIn: 7
- id: momentum-conservation
  term: 운동량 보존
  aliases: [운동량 보존 법칙]
  definition: 서로 힘을 주고받는 물체들의 운동량을 모두 더한 값은, 밖에서 힘이 들어오지 않으면 바뀌지 않는다는 법칙.
  examples:
    - 당구공이 부딪힌 뒤에도 두 공의 운동량을 더한 값은 부딪히기 전과 같다.
    - 멈춰 있던 두 사람이 서로 밀면, 두 사람의 운동량은 크기가 같고 방향이 반대가 된다.
  notThis: 운동 에너지 보존. 부딪힐 때 운동 에너지는 열이나 소리로 줄어들 수 있지만 운동량의 합은 그대로다.
  taughtIn: 7

# ── 8강 ───────────────────────────────
- id: initial-condition
  term: 초기 조건
  definition: 계산을 시작하는 순간의 위치와 속도처럼, 법칙에 넣어 주는 처음 값.
  examples:
    - 공을 던질 때의 위치, 빠르기, 방향
    - 일기예보를 시작하는 순간의 기온, 기압, 바람
  notThis: 법칙. 법칙은 어떤 초기 조건에서든 같고, 초기 조건은 상황마다 다르다.
  taughtIn: 8
- id: determinism
  term: 결정론
  definition: 지금 상태를 정확히 알면 법칙에 따라 미래가 하나로 정해진다는 생각.
  examples:
    - 일식 날짜를 수십 년 앞서 계산할 수 있다는 것은 결정론의 강한 근거였다.
    - 라플라스는 모든 것의 현재를 아는 지성에게 미래는 과거처럼 훤히 보일 것이라고 썼다.
  notThis: 운명론. 결정론은 법칙과 초기 조건으로 미래를 계산할 수 있다는 과학적 주장이다.
  taughtIn: 8
- id: chaos
  term: 카오스
  definition: 처음 값의 아주 작은 차이가 시간이 지나며 크게 벌어져, 법칙이 정해져 있어도 먼 미래를 예측하기 어려운 현상.
  examples:
    - 열흘 넘는 날씨 예보가 정확하기 어려운 이유
    - 당구에서 첫 충돌 각도가 조금만 달라도 공들이 전혀 다른 곳으로 간다.
  notThis: 법칙이 없는 무질서. 카오스는 법칙을 정확히 따르면서도 예측이 어려운 경우다.
  taughtIn: 8

# ── 9강 ───────────────────────────────
- id: vibration
  term: 진동
  definition: 물체가 한 위치를 가운데에 두고 같은 움직임을 되풀이하는 것.
  examples:
    - 앞뒤로 오가는 그네
    - 퉁긴 기타 줄의 떨림
  notThis: 한 방향으로 계속 가는 움직임. 진동은 같은 자리를 오간다.
  taughtIn: 9
- id: period
  term: 주기
  pattern: '주기(?!율)'
  definition: 진동이 한 번 되풀이되는 데 걸리는 시간.
  unit: s (초)
  examples:
    - 그네가 앞으로 갔다가 제자리로 돌아오는 데 3초 걸리면 주기는 3초다.
    - 1분에 60번 뛰는 심장의 주기는 1초다.
  notThis: 진동수. 주기는 '한 번에 몇 초', 진동수는 '1초에 몇 번'이다.
  taughtIn: 9
  q: time
  highlight: true
- id: frequency
  term: 진동수
  definition: 1초 동안 진동이 되풀이되는 횟수.
  unit: Hz (헤르츠). 1 Hz는 1초에 한 번.
  examples:
    - 1초에 두 번 왕복하는 진동의 진동수는 2 Hz다.
    - 피아노의 '라'(A4) 음을 내는 줄은 1초에 440번 진동한다.
  notThis: 진동의 크기(진폭). 크게 흔들리든 작게 흔들리든 1초에 되풀이되는 횟수가 같으면 진동수는 같다.
  taughtIn: 9
  q: time
  highlight: true
- id: hertz
  term: 헤르츠
  aliases: [Hz]
  definition: 진동수의 단위. 1 Hz는 1초에 한 번 되풀이된다는 뜻이다.
  examples:
    - 우리나라 가정용 전기는 1초에 60번 방향이 바뀐다. 60 Hz다.
    - 사람 귀는 약 20 Hz에서 20,000 Hz까지의 소리를 듣는다.
  notThis: 주기의 단위(초). 1초에 한 번이면 1 Hz, 주기는 1초다.
  taughtIn: 9
  q: time
- id: amplitude
  term: 진폭
  definition: 진동하는 물체가 가운데 위치에서 가장 멀리 벗어난 거리.
  unit: m
  examples:
    - 그네를 세게 밀면 진폭이 커진다.
    - 기타 줄을 세게 퉁기면 진폭이 커지고 소리가 커진다.
  notThis: 진동수. 진폭이 커져도 1초에 되풀이되는 횟수는 거의 그대로다.
  taughtIn: 9
  q: space
  highlight: true

# ── 10강 ──────────────────────────────
- id: wave
  term: 파동
  pattern: '파동(?!함수|묶음)'
  definition: 한 곳의 흔들림이 이웃으로 차례차례 넘겨지며 퍼져 나가는 현상. 물질은 제자리에서 흔들리고, 흔들림만 멀리 간다.
  examples:
    - 경기장 관중석의 파도타기 응원
    - 연못에 돌을 던졌을 때 퍼지는 물결
  notThis: 물질의 이동. 물결이 지나가도 물 위의 낙엽은 제자리에서 오르내릴 뿐이다.
  taughtIn: 10
- id: medium
  term: 매질
  definition: 파동을 전해 주는 물질.
  examples:
    - 물결의 매질은 물이다.
    - 소리의 매질은 공기다. 공기가 없는 우주에서는 소리가 전해지지 않는다.
  notThis: 파동 자체. 매질은 제자리에서 흔들릴 뿐 파동과 함께 떠나가지 않는다.
  taughtIn: 10
- id: displacement
  term: 변위
  definition: 매질의 한 점이 원래 자리에서 벗어난 거리와 방향. 위로 벗어나면 +, 아래로 벗어나면 −로 쓴다.
  unit: m
  examples:
    - 흔들리는 줄 위 한 점이 원래 높이보다 2 cm 위에 있으면 변위는 +2 cm다.
    - 물결이 가장 낮게 꺼진 곳에서 물 표면의 변위는 −다.
  notThis: 이동 거리. 변위는 지금 원래 자리에서 얼마나 떨어져 있는지만 본다.
  taughtIn: 10
  q: space
  highlight: true

# ── 11강 ──────────────────────────────
- id: wavelength
  term: 파장
  definition: 파동에서 같은 모양이 되풀이되는 거리. 가장 높이 솟은 곳에서 다음으로 가장 높이 솟은 곳까지의 거리.
  unit: m
  examples:
    - 바다의 파도는 파장이 수십 m다.
    - 피아노 '라'(440 Hz) 소리의 파장은 공기 중에서 약 0.77 m다.
  notThis: 진폭. 파장은 옆으로 잰 거리, 진폭은 위아래로 잰 거리다.
  taughtIn: 11
  q: space
  highlight: true
- id: wave-speed
  term: 파동의 속력
  definition: 파동의 모양이 1초 동안 나아가는 거리. 진동수 × 파장과 같다.
  unit: m/s
  examples:
    - 공기 중 소리의 속력은 약 340 m/s다.
    - 같은 줄에서는 진동수를 높여도 파동의 속력은 그대로이고 파장이 짧아진다.
  notThis: 매질이 흔들리는 빠르기. 줄 위 한 점은 위아래로만 움직이고, 앞으로 나아가는 것은 모양이다.
  taughtIn: 11
  q: motion
  highlight: true

# ── 12강 ──────────────────────────────
- id: sine
  term: 사인
  aliases: [사인 함수]
  definition: 반지름이 1인 원 위를 도는 점이 각도 θ만큼 돌았을 때의 높이. sin θ로 쓴다.
  examples:
    - sin 0° = 0, sin 30° = 0.5, sin 90° = 1
    - 관람차 칸의 높이는 시간에 따라 사인 함수 모양으로 오르내린다.
  notThis: 서명(사인). 같은 소리지만 영어 sine에서 온 말이다.
  taughtIn: 12
- id: phase
  term: 위상
  definition: 진동이 한 번 되풀이되는 동안 어디쯤에 와 있는지를 각도로 나타낸 것. 한 번 되풀이가 360°다.
  examples:
    - 위상 0°는 가운데에서 위로 출발하는 순간, 90°는 가장 높은 곳이다.
    - 두 그네가 늘 같이 앞에 있으면 위상이 같고, 하나가 앞일 때 다른 하나가 뒤에 있으면 위상이 180° 다르다.
  notThis: 진폭. 위상은 '언제쯤', 진폭은 '얼마나 크게'다.
  taughtIn: 12
  q: time
  highlight: true

# ── 13강 ──────────────────────────────
- id: superposition
  term: 중첩
  aliases: [중첩 원리]
  definition: 두 파동이 같은 곳을 지날 때, 그곳의 변위는 두 파동의 변위를 더한 값이 된다는 원리.
  examples:
    - 줄 양쪽에서 보낸 두 물결이 만나는 순간 두 높이가 더해진다.
    - 노이즈 캔슬링 이어폰은 소음과 반대 모양의 소리를 더해 소음을 지운다.
  notThis: 두 파동이 부딪혀 튕겨 나가는 것. 겹쳤던 파동은 지나간 뒤 원래 모양 그대로 제 갈 길을 간다.
  taughtIn: 13

# ── 14강 ──────────────────────────────
- id: source
  term: 파원
  definition: 파동이 시작되는 곳.
  examples:
    - 연못에 떨어진 돌
    - 소리를 내는 스피커
  notThis: 매질. 파원은 흔들림을 만드는 곳이고, 매질은 흔들림을 전하는 물질이다.
  taughtIn: 14
- id: interference
  term: 간섭
  pattern: '간섭(?! 무늬)'
  definition: 두 파동이 겹쳐서 어떤 곳에서는 더 커지고 어떤 곳에서는 작아지거나 사라지는 현상.
  examples:
    - 물웅덩이에 돌 두 개를 동시에 던지면 물결이 잔잔한 줄과 크게 출렁이는 줄이 번갈아 생긴다.
    - 비눗방울 표면의 무지갯빛
  notThis: 한 파동이 다른 파동을 막는 것. 간섭은 변위가 더해진 결과다.
  taughtIn: 14
- id: constructive
  term: 보강 간섭
  definition: 두 파동이 위상이 같은 채로 만나 더 크게 흔들리는 것.
  examples:
    - 두 물결의 가장 높은 곳끼리 만나 더 높이 솟는다.
    - 두 스피커에서 같은 박자로 온 소리가 더 크게 들린다.
  notThis: 소리가 두 번 들리는 것. 한 번에 더 크게 들린다.
  taughtIn: 14
- id: destructive
  term: 상쇄 간섭
  definition: 두 파동이 위상이 180° 다른 채로 만나 서로 지우는 것.
  examples:
    - 한 물결의 가장 높은 곳과 다른 물결의 가장 낮은 곳이 만나 잔잔해진다.
    - 노이즈 캔슬링 이어폰
  notThis: 파동이 사라져 없어지는 것. 그 자리에서만 지워지고, 다른 곳에서는 보강된다.
  taughtIn: 14
- id: path-difference
  term: 경로차
  definition: 두 파원에서 한 지점까지 오는 거리의 차이.
  unit: m
  examples:
    - 한 스피커까지 5 m, 다른 스피커까지 6 m인 자리의 경로차는 1 m다.
    - 경로차가 파장의 정수배인 곳에서는 보강 간섭이 일어난다.
  notThis: 두 파원 사이의 거리.
  taughtIn: 14
  q: space
  highlight: true

# ── 15강 ──────────────────────────────
- id: diffraction
  term: 회절
  definition: 파동이 틈이나 모서리를 지나면서 그 뒤쪽으로 퍼져 들어가는 현상. 틈의 폭이 파장과 비슷하거나 작을수록 많이 퍼진다.
  examples:
    - 열린 문 옆에 서 있으면 방 안 사람은 안 보여도 목소리는 들린다.
    - 방파제의 좁은 입구를 지난 물결이 항구 안쪽으로 둥글게 퍼진다.
  notThis: 반사. 회절은 되돌아오는 것이 아니라 뒤쪽으로 돌아 들어가는 것이다.
  taughtIn: 15

# ── 16강 ──────────────────────────────
- id: slit
  term: 슬릿
  definition: 빛이 지나가도록 판에 낸 아주 좁고 긴 틈.
  examples:
    - 검게 칠한 유리에 면도날로 그은 선
    - 폭이 0.1 mm 정도인 틈
  notThis: 구멍 아무것이나. 슬릿은 폭이 빛의 파장과 견줄 만큼 좁다.
  taughtIn: 16
- id: double-slit
  term: 이중 슬릿 실험
  definition: 가까이 붙은 슬릿 두 개에 빛을 비추고, 뒤쪽 화면에 생기는 무늬를 보는 실험.
  examples:
    - 토머스 영이 1800년대 초에 처음 한 실험
    - 레이저 포인터와 면도날로 집에서도 할 수 있다.
  notThis: 슬릿 하나만 쓰는 실험(단일 슬릿). 무늬의 모양이 다르다.
  taughtIn: 16
- id: fringe
  term: 간섭 무늬
  definition: 간섭 때문에 밝은 곳과 어두운 곳이 번갈아 줄지어 생기는 무늬.
  examples:
    - 이중 슬릿 뒤 화면의 밝고 어두운 줄
    - 비눗방울 표면의 색 띠
  notThis: 그림자. 간섭 무늬의 어두운 줄은 빛이 막혀서가 아니라 빛끼리 지워서 생긴다.
  taughtIn: 16

# ── 17강 ──────────────────────────────
- id: visible-light
  term: 가시광선
  definition: 사람 눈에 보이는 빛. 1초에 약 400조 번에서 750조 번 진동한다.
  examples:
    - 무지개의 빨강부터 보라까지
    - 형광등과 햇빛에 섞인 여러 색의 빛
  notThis: 모든 빛. 눈에 보이지 않는 빛도 있다(19강).
  taughtIn: 17
- id: speed-of-light
  term: 빛의 속력
  definition: 진공에서 빛이 1초 동안 가는 거리. 약 3 × 10⁸ m/s이고, 기호로 c라고 쓴다.
  unit: m/s
  examples:
    - 빛은 1초에 지구를 일곱 바퀴 반 돈다.
    - 태양에서 출발한 빛은 약 8분 20초 뒤에 지구에 닿는다.
  notThis: 무한히 빠른 것. 빛도 가는 데 시간이 걸린다.
  taughtIn: 17
  q: motion
  highlight: true
- id: spectrum
  term: 스펙트럼
  pattern: '스펙트럼(?! 그래프)'
  definition: 빛을 진동수에 따라 나누어 늘어놓은 것. 프리즘을 지난 햇빛이 만드는 색의 띠가 그 예다.
  examples:
    - 프리즘을 지난 햇빛의 무지개색 띠
    - 비 갠 하늘의 무지개
  notThis: 색 하나. 스펙트럼은 여러 진동수를 늘어놓은 전체다.
  taughtIn: 17

# ── 18강 ──────────────────────────────
- id: charge
  term: 전하
  pattern: '전하(?![다고며면여해했지게기자는])'
  definition: 물체가 띤 전기의 양. 양(+)과 음(−) 두 종류가 있다.
  unit: C (쿨롱)
  examples:
    - 머리카락에 문지른 풍선은 음(−) 전하를 띤다.
    - 대부분의 물체는 양 전하와 음 전하가 같은 양만큼 있어서 전기를 띠지 않는 것처럼 보인다.
  notThis: 전류. 전류는 전하가 흐르는 것이다.
  taughtIn: 18
  q: charge
  highlight: true
- id: electric-force
  term: 전기력
  definition: 전하를 띤 물체끼리 서로 밀거나 당기는 힘. 같은 종류끼리는 밀고, 다른 종류끼리는 당긴다.
  unit: N
  examples:
    - 문지른 풍선에 머리카락이 끌려 올라간다.
    - 겨울에 문손잡이를 잡을 때 찌릿한 것은 몸에 쌓인 전하가 한꺼번에 움직이기 때문이다.
  notThis: 중력. 중력은 당기기만 하지만 전기력은 밀기도 한다.
  taughtIn: 18
  q: charge
  highlight: true
- id: coulomb-law
  term: 쿨롱 법칙
  definition: 두 전하 사이의 전기력은 두 전하의 곱에 비례하고, 거리의 제곱에 반비례한다.
  examples:
    - 거리가 2배가 되면 전기력은 4분의 1이 된다.
    - 거리가 절반이 되면 전기력은 4배가 된다.
  notThis: 거리에 반비례하는 관계. 거리의 '제곱'에 반비례한다.
  taughtIn: 18

# ── 19강 ──────────────────────────────
- id: em-wave
  term: 전자기파
  definition: 전하가 흔들릴 때, 다른 전하가 받는 힘의 변화가 물결처럼 퍼져 나가는 파동. 진공에서 빛의 속력으로 나아가고, 빛도 전자기파다.
  examples:
    - 라디오 방송국 안테나가 내보내는 전파
    - 햇빛
  notThis: 소리. 소리는 공기가 매질인 파동이고, 전자기파는 매질 없이 진공에서도 간다.
  taughtIn: 19
- id: radio-wave
  term: 전파
  definition: 전자기파 가운데 진동수가 가장 낮은 쪽. 라디오, 휴대전화, 와이파이에 쓴다.
  examples:
    - FM 라디오 89.1 MHz는 1초에 8,910만 번 진동한다.
    - 와이파이는 주로 1초에 약 24억 번 진동하는 전파를 쓴다.
  notThis: 전기가 전선 속을 흐르는 것. 전파는 공간을 건너간다.
  taughtIn: 19
- id: infrared
  term: 적외선
  definition: 빨간빛보다 진동수가 낮아서 눈에 보이지 않는 전자기파. 1초에 약 400조 번보다 적게 진동한다.
  examples:
    - TV 리모컨이 보내는 신호
    - 난로 앞에서 얼굴을 따뜻하게 하는 빛
  notThis: 빨간색 빛. 적외선은 눈에 보이지 않는다.
  taughtIn: 19
- id: ultraviolet
  term: 자외선
  definition: 보랏빛보다 진동수가 높아서 눈에 보이지 않는 전자기파. 1초에 약 750조 번보다 많이 진동한다.
  examples:
    - 햇볕에 피부가 타는 원인
    - 자외선 차단제는 이 빛을 막는다.
  notThis: 보라색 빛. 자외선은 눈에 보이지 않는다.
  taughtIn: 19
- id: x-ray
  term: X선
  definition: 자외선보다도 진동수가 훨씬 높은 전자기파. 몸의 부드러운 부분은 대부분 지나가고, 뼈에는 더 많이 막힌다.
  examples:
    - 병원의 X선 사진
    - 공항 수하물 검색대
  notThis: 방사능 물질 자체. X선은 빛의 한 종류다.
  taughtIn: 19

# ── 20강 ──────────────────────────────
- id: standing-wave
  term: 정상파
  definition: 양쪽 끝 사이를 오가며 겹친 파동이, 앞으로 나아가지 않고 제자리에서 흔들리기만 하는 것처럼 보이는 파동.
  examples:
    - 퉁긴 기타 줄의 떨림
    - 두 사람이 돌리는 긴 줄넘기 줄
  notThis: 멈춘 파동. 정상파도 흔들린다. 다만 흔들리는 모양이 옆으로 움직이지 않는다.
  taughtIn: 20
- id: node
  term: 마디
  pattern: '마디(?!로)'
  definition: 정상파에서 전혀 흔들리지 않는 점.
  examples:
    - 기타 줄의 양 끝
    - 기타 줄 한가운데를 살짝 짚고 퉁기면 그곳이 마디가 된다.
  notThis: 손가락 마디나 말 한마디. 같은 말이지만 뜻이 다르다.
  taughtIn: 20
  q: space
- id: mode
  term: 진동 모드
  definition: 줄이나 관이 정상파로 떨 수 있는 모양 하나하나. 양 끝이 고정된 줄에서는 반 파장이 정수 개 들어가는 모양만 생긴다.
  examples:
    - 기타 줄이 통째로 하나의 활 모양으로 떠는 것(첫째 모드)
    - 한가운데가 마디가 되어 두 덩어리로 떠는 것(둘째 모드)
  notThis: 아무 모양의 흔들림. 줄 길이에 맞지 않는 모양은 금방 사라진다.
  taughtIn: 20
- id: fundamental
  term: 기본 진동
  aliases: [기본 진동수]
  definition: 진동 모드 가운데 진동수가 가장 낮은 것. 줄 전체에 반 파장 하나가 들어간다. 그 진동수가 기본 진동수다.
  examples:
    - 기타 개방현을 퉁겼을 때 들리는 음의 높이는 기본 진동수로 정해진다.
    - 줄을 반으로 짧게 짚으면 기본 진동수가 2배가 된다.
  notThis: 가장 큰 진동. 기본 진동은 진폭이 아니라 진동수가 가장 낮은 모드다.
  taughtIn: 20
  q: time
- id: harmonic
  term: 배음
  definition: 기본 진동수의 2배, 3배, 4배 … 진동수를 가진 진동 모드. 악기의 음색은 배음이 섞인 비율로 정해진다.
  examples:
    - 기타 줄 길이의 정확히 절반 지점을 살짝 짚고 퉁기면 둘째 모드만 남아, 한 옥타브 높은 맑은 소리가 난다.
    - 같은 '라'를 내도 피아노와 바이올린 소리가 다른 것은 배음의 비율이 달라서다.
  notThis: 다른 음을 함께 치는 것(화음). 배음은 한 줄이 한 번에 내는 소리 안에 섞여 있다.
  taughtIn: 20
  q: time
