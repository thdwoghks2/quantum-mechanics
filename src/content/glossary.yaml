# ── 92강 ─────────────────────────────
- id: local-realism
  term: 국소 실재론
  definition: 국소성과 실재성을 함께 지키는 생각. 물체의 성질은 재기 전부터 정해진 값으로 있고, 멀리 떨어진 곳에는 빛보다 빠르게 영향을 줄 수 없다는 두 믿음을 한데 묶은 것.
  examples:
    - 두 상자에 나눠 담은 장갑은 국소 실재론으로 깔끔하게 설명돼요. 포장할 때 정해졌고, 한 상자를 열어도 다른 상자에는 아무 일도 생기지 않아요.
    - 서로 연락할 수 없는 두 학생이 미리 짠 답안지대로만 답한다면, 두 사람의 답은 국소 실재론으로 설명되고 벨 부등식을 지켜요.
  notThis: 세상이 실제로 있다는 일상의 믿음 전체를 뜻하지 않아요. 벨 실험이 틀렸다고 보인 건 재지 않은 성질의 값과 영향의 빠르기에 관한 이 두 믿음을 함께 지키는 이론이에요.
  taughtIn: 92

# ── 93강 ─────────────────────────────
- id: decoherence
  term: 결어긋남
  definition: 겹친 상태에 있는 물체가 주변의 공기 분자나 빛과 부딪혀 얽히면서, 그 물체만 따로 볼 때 두 상태가 서로 간섭하는 능력을 잃는 과정.
  examples:
    - 공기 속을 날아가는 큰 분자는 공기 분자와 부딪힐 때마다 지나간 길을 남겨서, 간섭 무늬가 흐려져요.
    - 큐비트를 아주 차갑고 고요한 곳에 두는 건, 주변과 부딪혀 결어긋남이 일어나면 계산에 필요한 겹침이 무너지기 때문이에요.
  notThis: 겹친 상태 가운데 결과 하나를 골라 주는 과정은 아니에요. 두 가능성은 주변까지 포함한 전체 상태 안에 여전히 함께 남아 있어요.
  taughtIn: 93
- id: many-worlds
  term: 다세계 해석
  definition: 파동함수의 붕괴는 일어나지 않고, 측정하면 가능한 결과가 모두 일어나 세계가 여러 갈래로 나뉜다고 보는 해석. 1957년 휴 에버렛이 처음 내놓았다.
  examples:
    - 슈뢰딩거의 고양이 상자를 열면, 다세계 해석에서는 산 고양이를 본 나와 죽은 고양이를 본 나가 서로 다른 갈래에 함께 있어요.
    - 얽힌 짝의 스핀을 재서 위가 나왔다면, 다세계 해석에서는 아래가 나온 갈래의 나도 있다고 봐요.
  notThis: 공상 과학 영화처럼 다른 세계로 건너가거나 연락할 수 있다는 뜻이 아니에요. 갈래들은 결어긋남 때문에 서로 간섭하지 않아서, 다른 갈래를 볼 방법은 없어요.
  taughtIn: 93

# ── 94강 ─────────────────────────────
# (새 용어 없음)

# ── 95강 ─────────────────────────────
- id: falsifiability
  term: 반증 가능성
  definition: 어떤 주장이 틀렸다면 그것을 드러낼 관찰이나 실험이 있을 수 있는 성질. 칼 포퍼는 이것을 과학 이론이 갖춰야 할 조건으로 봤다.
  examples:
    - "\"내일 서울에 비가 온다\"는 내일 하늘을 보면 틀렸는지 알 수 있으니 반증 가능해요."
    - "\"모든 백조는 희다\"는 검은 백조 한 마리만 보면 틀렸다는 게 드러나요. 실제로 1697년 오스트레일리아에서 검은 백조가 발견됐어요."
  notThis: 이미 틀렸다는 뜻이 아니에요. 틀렸다면 드러날 길이 열려 있다는 뜻이에요. 반대로 "언젠가 좋은 일이 생긴다"처럼 무슨 일이 일어나도 맞는 말은 반증할 수 없어요.
  taughtIn: 95
- id: paradigm
  term: 패러다임
  definition: 한 시대의 과학자들이 함께 받아들이는 문제, 풀이 방법, 본보기의 묶음. 토머스 쿤은 과학의 큰 변화를 패러다임이 바뀌는 일로 설명했다.
  examples:
    - 뉴턴의 물리학이 패러다임이던 때, 과학자들은 거의 모든 움직임을 힘과 가속도로 푸는 문제로 봤어요.
    - 지구가 우주의 중심이라는 천문학에서 해가 중심이라는 천문학으로 넘어간 일은 패러다임이 바뀐 대표적인 예예요.
  notThis: 일상에서 쓰는 "생각의 틀"이라는 넓은 말과 닮았지만, 여기서는 과학자 집단이 실제로 문제를 고르고 푸는 방식을 가리켜요. 유행이나 한 사람의 의견을 뜻하지 않아요.
  taughtIn: 95

# ── 96강 ─────────────────────────────
- id: reference-frame
  term: 기준틀
  definition: 위치, 속도, 시간을 재는 기준이 되는 자리와 그 자리에 붙은 자와 시계. 같은 움직임도 어느 기준틀에서 재느냐에 따라 다르게 적힌다.
  examples:
    - 달리는 기차 안에서 위로 던진 공은 기차를 기준틀로 삼으면 곧게 오르내리고, 땅을 기준틀로 삼으면 포물선을 그려요.
    - 공항의 무빙워크 위를 걷는 사람의 빠르기는 무빙워크에서 재면 걷는 빠르기이고, 공항 바닥에서 재면 걷는 빠르기에 무빙워크의 빠르기를 더한 값이에요.
  notThis: 어느 기준틀이 진짜이고 나머지는 착각이라는 뜻이 아니에요. 일정한 빠르기로 곧게 움직이는 기준틀들은 모두 똑같이 정당하고, 그 안에서 운동 법칙도 똑같이 성립해요.
  taughtIn: 96

# ── 97강 ─────────────────────────────
- id: constancy-of-light-speed
  term: 광속 불변
  definition: 진공 속 빛의 속력은 빛을 내는 물체가 어떻게 움직이든, 재는 사람이 어떤 기준틀에 있든 언제나 초속 299,792,458 m로 같다는 원리. 1905년 아인슈타인이 상대성이론의 바탕으로 삼았다.
  examples:
    - 빛을 향해 달려가며 재도, 빛에서 멀어지며 재도 빛의 속력은 같은 값으로 나와요.
    - 달리는 기차의 전조등 빛을 기차 안에서 재도, 철길 옆에서 재도 빛의 속력은 같아요. 기차의 빠르기가 더해지지 않아요.
  notThis: 물이나 유리 속에서도 빛의 속력이 같다는 뜻은 아니에요. 유리 속에서 빛은 더 느리게 가요. 여기서 말하는 건 진공 속 빛의 속력이 기준틀마다 같다는 거예요.
  taughtIn: 97

# ── 98강 ─────────────────────────────
- id: time-dilation
  term: 시간 지연
  definition: 나에 대해 움직이는 시계가 내 시계보다 느리게 가는 현상. 빠르기 v로 움직이는 시계는 1/√(1 − v²/c²)배만큼 느리게 간다.
  examples:
    - 빛의 속력의 0.6배로 날아가는 우주선의 시계는, 지구에서 볼 때 지구 시계가 10시간 갈 동안 8시간만 가요.
    - 우주에서 날아오는 뮤온은 아주 빠르게 움직여서 시간이 느리게 가기 때문에, 수명보다 훨씬 먼 땅까지 살아서 닿아요.
  notThis: 시계가 고장 나거나 기계가 둔해져서 느려지는 게 아니에요. 움직이는 쪽 안에서는 모든 것이 평소대로 가고, 시간 자체가 기준틀마다 다르게 흘러요.
  taughtIn: 98
  q: time

# ── 99강 ─────────────────────────────
- id: length-contraction
  term: 길이 수축
  definition: 나에 대해 움직이는 물체의 길이가 움직이는 방향으로 √(1 − v²/c²)배만큼 짧게 재지는 현상. 움직이는 방향과 수직인 길이는 그대로다.
  examples:
    - 빛의 0.6배로 지나가는 길이 20 m의 우주선은 땅에서 재면 16 m예요.
    - 빛의 0.995배로 내려오는 뮤온의 기준틀에서는 15 km 두께의 대기가 약 1.5 km로 짧아져요.
  notThis: 물체가 눌려서 찌그러지는 게 아니에요. 물체와 함께 움직이는 사람에게는 길이가 그대로이고, 기준틀마다 앞끝과 뒤끝을 재는 "같은 순간"이 다르기 때문에 생겨요.
  taughtIn: 99
  q: space
- id: relativity-of-simultaneity
  term: 동시성의 상대성
  definition: 한 기준틀에서 같은 순간에 일어난 떨어진 두 사건이, 그에 대해 움직이는 다른 기준틀에서는 서로 다른 순간에 일어난다는 것.
  examples:
    - 달리는 기차 한가운데서 켠 빛은 기차 안에서 보면 앞끝과 뒤끝에 동시에 닿지만, 땅에서 보면 뒤끝에 먼저 닿아요.
    - 기차 안에서 앞 칸과 뒤 칸의 시계를 똑같이 맞춰 놓아도, 땅에서 보면 두 시계가 서로 다른 시각을 가리켜요.
  notThis: 빛이 늦게 도착해서 늦게 본 것과는 달라요. 빛이 오는 데 걸린 시간을 다 빼고 계산해도 남는 차이예요. 또 원인과 결과의 순서는 어느 기준틀에서도 뒤바뀌지 않아요.
  taughtIn: 99

# ── 100강 ────────────────────────────
- id: mass-energy-equivalence
  term: 질량-에너지 등가
  definition: 질량과 에너지는 정해진 비율로 서로 바꿔 셀 수 있다는 원리. 질량 m은 E = mc²만큼의 에너지에 해당하고, 물체가 에너지 E를 내놓으면 질량이 E/c²만큼 줄어든다.
  examples:
    - 휴대폰 배터리를 가득 충전하면, 들어간 전기 에너지만큼 배터리가 잴 수 없을 만큼 조금(약 6 × 10⁻¹³ kg) 무거워져요.
    - 해는 빛으로 에너지를 내놓는 만큼 1초에 약 400만 톤씩 가벼워져요.
  notThis: 원자핵에서만 일어나는 특별한 일이 아니에요. 에너지가 들고 나는 모든 일에 질량이 함께 들고 나요. 일상에서는 그 질량이 너무 작아서 보이지 않을 뿐이에요.
  taughtIn: 100
  q: energy

# ── 101강 ────────────────────────────
- id: antimatter
  term: 반물질
  definition: 보통의 물질을 이루는 입자와 질량은 같고 전하 같은 성질은 반대인 반입자들로 된 물질. 입자와 반입자가 만나면 둘 다 사라지고, 질량에 해당하는 에너지가 빛 같은 꼴로 나온다.
  examples:
    - 병원의 PET 검사는 몸에 넣은 약이 내놓는 양전자가 몸속 전자와 만나 사라지면서 나오는 빛으로 몸속을 찍어요.
    - 유럽입자물리연구소는 반수소 원자를 만들어 붙잡아 두고, 2023년에는 반수소도 보통 물질처럼 아래로 떨어진다는 걸 확인했어요.
  notThis: 공상 과학의 반중력이나 음의 질량이 아니에요. 반물질의 질량은 보통 물질과 똑같이 양수이고, 중력을 받으면 아래로 떨어져요.
  taughtIn: 101
- id: positron
  term: 양전자
  definition: 전자의 반입자. 질량은 전자와 같고, 전하는 전자와 반대인 양전하를 띤다. 1931년 디랙이 예언했고 1932년 앤더슨이 발견했다.
  examples:
    - 우주에서 온 입자가 공기와 부딪히면 양전자가 생겨서, 자석 속 구름 상자에 전자와 반대로 휘는 자취를 남겨요.
    - PET 검사용 약 속의 원자핵은 양전자를 내놓고, 양전자는 곧 몸속 전자와 만나 반대 방향으로 날아가는 빛 두 줄기로 바뀌어요.
  notThis: 전자를 잃어서 양전하를 띠게 된 원자(양이온)와는 달라요. 양전자는 그 자체로 전자와 짝을 이루는 하나의 입자예요.
  taughtIn: 101
  q: charge

# ── 102강 ────────────────────────────
- id: equivalence-principle
  term: 등가 원리
  definition: 중력 속에 가만히 있는 것과, 같은 크기로 빨라지는 기준틀 안에 있는 것을 작은 상자 안에서 하는 어떤 실험으로도 구별할 수 없다는 원리. 모든 물체가 질량과 상관없이 똑같이 떨어진다는 사실에서 나온다.
  examples:
    - 엘리베이터가 아래로 빨라지기 시작하면, 중력이 약해진 것처럼 몸이 가벼워져요.
    - 우주 정거장의 우주인은 중력이 지구 표면의 약 90%인 높이에 있지만, 정거장과 함께 떨어지고 있어서 둥둥 떠요.
  notThis: 우주 정거장에 중력이 없다는 뜻이 아니에요. 중력은 그대로 있지만, 모두 함께 떨어지니 상자 안에서는 느껴지지 않을 뿐이에요.
  taughtIn: 102

# ── 103강 ────────────────────────────
- id: general-relativity
  term: 일반상대성이론
  definition: 중력을, 질량과 에너지가 휘게 한 시공간으로 설명하는 아인슈타인의 이론. 1915년에 완성했다. 물체와 빛은 휘어진 시공간에서 가장 곧은 길을 따라 움직이고, 무거운 천체 가까이에서는 시간이 느리게 간다.
  examples:
    - 휴대폰의 GPS는 위성 시계가 하루 약 38마이크로초 빨리 간다는 일반상대성이론의 계산으로 고쳐 쓰지 않으면, 하루에 약 10 km씩 위치가 틀려져요.
    - 1919년 개기일식 때, 해 곁을 지나는 별빛이 일반상대성이론이 예측한 만큼 휘는 것이 관측됐어요.
  notThis: 뉴턴의 중력 법칙을 완전히 버린 이론이 아니에요. 중력이 약하고 물체가 느릴 때는 뉴턴의 법칙과 거의 같은 답을 내고, 중력이 아주 세거나 아주 정밀하게 잴 때 차이가 드러나요.
  taughtIn: 103
- id: spacetime
  term: 시공간
  definition: 시간과 공간을 따로따로가 아니라 하나로 묶어 본 무대. 사건 하나는 언제(시간)와 어디서(공간의 세 방향)로 시공간의 한 점이 된다.
  examples:
    - 친구와 "내일 오후 3시, 학교 정문 앞"에서 만나기로 했다면, 시공간의 한 점을 약속한 거예요.
    - 지구 근처의 시공간은 아주 조금 휘어 있어서, 높은 곳의 시계와 낮은 곳의 시계가 다르게 가요.
  notThis: 시간 방향으로 마음대로 오갈 수 있다는 뜻이 아니에요. 시간은 공간과 묶여 있어도 늘 한 방향으로만 흘러요.
  taughtIn: 103

# ── 104강 ────────────────────────────
- id: black-hole
  term: 블랙홀
  definition: 질량이 아주 좁은 곳에 모여 시공간이 크게 휘어서, 어떤 경계 안쪽에서는 빛도 빠져나오지 못하는 천체.
  examples:
    - 우리 은하 한가운데에는 해 질량의 약 400만 배인 블랙홀이 있어서, 둘레의 별들이 그 둘레를 빠르게 돌아요.
    - 2019년 사건지평선 망원경은 5,500만 광년 떨어진 M87 은하 한가운데 블랙홀의 그림자를 처음 찍었어요.
  notThis: 모든 것을 빨아들이는 진공청소기가 아니에요. 멀리서 보면 같은 질량의 별과 똑같이 당겨요. 해가 같은 질량의 블랙홀로 바뀌어도 지구는 지금 궤도를 그대로 돌아요.
  taughtIn: 104
- id: event-horizon
  term: 사건의 지평선
  definition: 블랙홀을 둘러싼 경계. 이 안쪽에서는 빛도 바깥으로 빠져나올 수 없어서, 안에서 일어난 일은 바깥에 어떤 소식도 전하지 못한다. 돌지 않는 블랙홀에서 그 반지름은 2GM/c²이다.
  examples:
    - 해와 질량이 같은 블랙홀의 사건의 지평선은 반지름이 약 3 km예요.
    - 멀리서 보면 사건의 지평선 쪽으로 떨어지는 물체는 점점 느려지고 붉어지다가, 그 앞에서 멈춘 듯 흐려져요.
  notThis: 단단한 벽이나 표면이 아니에요. 떨어지는 사람은 그 경계를 지나는 순간 특별한 것을 느끼지 못할 수도 있어요. 다만 한번 지나면 다시 나올 길이 없어요.
  taughtIn: 104

# ── 105강 ────────────────────────────
- id: gravitational-wave
  term: 중력파
  definition: 무거운 천체가 빠르게 움직일 때 시공간의 휘어짐이 물결처럼 빛의 속력으로 퍼져 나가는 것. 지나가는 곳의 길이를 한 방향으로는 늘리고 그와 수직인 방향으로는 줄이기를 되풀이한다.
  examples:
    - 2015년 9월 14일, 약 13억 광년 떨어진 곳에서 두 블랙홀이 합쳐질 때 생긴 중력파가 지구에 닿아 처음으로 검출됐어요.
    - 중력파가 지나가면 4 km 길이의 검출기 팔이 원자 지름의 1,000만분의 1보다도 작게 늘었다 줄었다 해요.
  notThis: 공기를 흔드는 소리나, 전자기파인 빛과는 달라요. 매질 없이 시공간 자체가 흔들리는 거예요. 기상학에서 말하는 '중력파'(공기와 물의 출렁임)와도 다른 말이에요.
  taughtIn: 105

