# ── 64강 ─────────────────────────────
- id: derivative
  term: 미분
  definition: 어떤 양이 한순간에 얼마나 빨리 바뀌는지 구하는 일, 또는 그렇게 구한 값. 짧은 동안 바뀐 양을 그 동안의 길이로 나누고, 그 길이를 0에 가깝게 줄여 갈 때 다가가는 값이다. 그래프에서는 그 점의 기울기다.
  examples:
    - 자동차 속도계 바늘은 지금 이 순간의 빠르기를 보여 줘요. 위치를 시간으로 미분한 값이에요.
    - 등산로의 한 자리에서 한 걸음 앞으로 갈 때 높이가 얼마나 오르는지가 그 자리의 가파른 정도예요. 높이를 거리로 미분한 값이죠.
  notThis: 긴 동안의 평균 변화율과는 달라요. 서울에서 대전까지 간 평균 속력은 하나지만, 미분으로 얻는 속력은 순간마다 달라요.
  taughtIn: 64
- id: curvature
  term: 곡률
  definition: 그래프의 기울기가 바뀌는 빠르기. 그래프가 얼마나 세게, 어느 방향으로 굽었는지를 나타낸다. 이 코스에서는 기울기를 한 번 더 미분한 값을 곡률이라고 부른다.
  examples:
    - 급하게 휘는 길에서는 운전대를 빨리 돌려야 해요. 짧은 거리 안에서 길의 방향이 크게 바뀌니까 곡률이 커요.
    - 같은 높이로 출렁이는 물결이라도 파장이 짧을수록 더 세게 굽어서 곡률이 커요.
  notThis: 기울기와는 달라요. 아무리 가파른 비탈도 곧게 뻗어 있으면 곡률이 0이에요. 수학에서 원의 굽은 정도로 정의하는 곡률과는 기울기가 클 때 값이 조금 달라요.
  taughtIn: 64

# ── 65강 ─────────────────────────────
- id: schrodinger-equation
  term: 슈뢰딩거 방정식
  definition: 파동함수가 따라야 하는 식. 자리마다 '파동함수의 곡률로 읽은 운동 에너지 + 위치 에너지 = 전체 에너지'가 맞아야 한다고 말한다. 시간에 따라 파동함수가 어떻게 바뀌는지 정하는 꼴도 있다.
  examples:
    - 전자가 위치 에너지가 높은 곳으로 넘어가면, 이 식에 따라 그곳에서 파동함수의 파장이 길어져요.
    - 화학자들은 컴퓨터로 이 식을 풀어서 분자의 모양과 성질을 미리 계산해요.
  notThis: 더 기본적인 법칙에서 이끌어 낸 식이 아니에요. 슈뢰딩거가 물질파 생각에서 출발해 세웠고, 예측이 실험과 맞아서 받아들여졌어요. 입자가 지나간 길을 알려 주는 식도 아니에요.
  taughtIn: 65

