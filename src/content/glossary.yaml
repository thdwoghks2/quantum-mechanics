# 용어집. 용어마다 정식으로 가르치는 강(taughtIn)이 하나 있다.
# 그 강보다 앞선 강에서는 이 용어를 쓸 수 없다(npm run validate가 검사한다).
# 정식 도입 = 정의 카드 + 일상 예시 2개 + 시각 자료 + 확인 문제.
# q: 물리량 묶음(색). highlight: 글 속에서 색 밑줄을 칠지.

# ── 1강 ───────────────────────────────
- id: law
  term: 법칙
  definition: 같은 조건이면 언제 어디서나 똑같이 일어나는 자연의 규칙.
  examples:
    - 지구 위에서는 손에서 놓은 물체가 아래로 떨어져요.
    - 바닷가 높이에서 물은 100 ℃에서 끓어요.
  notThis: 사람이 정한 규칙(교통 법규, 학교 규칙)은 법칙이 아니에요. 자연이 따르는 규칙은 사람이 바꿀 수 없어요. 다만 우리가 찾아서 적어 둔 법칙이 관찰과 맞지 않으면, 적어 둔 쪽을 고쳐요.
  taughtIn: 1
- id: prediction
  term: 예측
  definition: 법칙을 써서, 아직 보지 않은 일이 어떻게 될지 미리 말하는 것.
  examples:
    - 천문학자는 수십 년 뒤 일식이 일어날 날짜와 시각을 미리 알려 줘요.
    - 일기 예보는 내일 비가 올지 미리 알려 주고, 다음 날이 되면 맞았는지 확인할 수 있어요.
  notThis: "'언젠가 좋은 일이 생긴다'처럼 맞았는지 확인할 방법이 없는 말은 예측이 아니에요. 과학의 예측은 법칙에서 나오고, 맞았는지 틀렸는지 나중에 확인할 수 있어요."
  taughtIn: 1
- id: model
  term: 모형
  definition: 지금 알고 싶은 것과 상관있는 부분만 남기고 나머지는 일부러 버려서 단순하게 만든 설명.
  examples:
    - 지하철 노선도는 역의 순서와 갈아타는 곳만 남기고, 실제 거리와 방향은 버렸어요.
    - 던진 공의 움직임을 계산할 때 공기를 무시하고 공을 점 하나로 봐요.
  notThis: 실물을 그대로 작게 줄인 모형 비행기와는 달라요. 물리학의 모형은 일부러 많은 것을 버려요.
  taughtIn: 1

# ── 2강 ───────────────────────────────
- id: power-of-ten
  term: 10의 거듭제곱
  aliases: [거듭제곱]
  definition: 10을 여러 번 곱한 수. 10ⁿ은 10을 n번 곱한 수로 1 뒤에 0이 n개 붙고, 10⁻ⁿ은 1을 10으로 n번 나눈 수.
  examples:
    - 10³은 10 × 10 × 10이라서 1,000이에요.
    - 10⁻³은 1을 10으로 세 번 나눈 수라서 0.001이에요.
  notThis: 10 × n이 아니에요. 10³은 30이 아니라 1,000이에요.
  taughtIn: 2
- id: exponent
  term: 지수
  definition: 10ⁿ에서 10 옆에 작게 올려 쓴 수 n. 10을 몇 번 곱했는지, −가 붙으면 몇 번 나눴는지를 센 수.
  examples:
    - 10⁵의 지수는 5예요. 1 뒤에 0이 5개 붙은 100,000이죠.
    - 10⁻²의 지수는 −2예요. 1을 10으로 두 번 나눈 0.01이죠.
  notThis: 앞에 곱한 수는 지수가 아니에요. 3 × 10⁵에서 3은 지수가 아니고, 지수는 5예요.
  taughtIn: 2
- id: scientific-notation
  term: 과학적 표기법
  definition: 어떤 수를 (1 이상 10 미만의 수) × 10ⁿ 꼴로 쓰는 방법.
  examples:
    - 지구에서 태양까지 150,000,000,000 m는 1.5 × 10¹¹ m로 써요.
    - 머리카락 굵기 0.0001 m는 1 × 10⁻⁴ m로 써요.
  notThis: 15 × 10¹⁰처럼 앞의 수가 10 이상이면 과학적 표기법이 아니에요. 값은 같아도 1.5 × 10¹¹로 고쳐 써요.
  taughtIn: 2
- id: order-of-magnitude
  term: 자릿수
  definition: 10배 차이를 한 단계로 삼아, 어떤 양이 10의 몇 제곱쯤인지 나타낸 크기의 단계.
  examples:
    - 사람의 키(약 1 m)와 30층 건물의 높이(약 100 m)는 자릿수가 두 단계 달라요.
    - 해변의 모래알 수를 어림할 때는 정확한 개수 대신 자릿수를 맞혀요.
  notThis: 숫자를 쓸 때 자리가 몇 개인지만 뜻하는 일상어와는 달라요. 여기서는 0.001처럼 1보다 작은 수에도 써요.
  taughtIn: 2

# ── 3강 ───────────────────────────────
- id: unit
  term: 단위
  definition: 양을 잴 때 기준으로 삼는 정해진 크기. 측정값은 재려는 양이 이 기준의 몇 배인지 센 수.
  examples:
    - 키 165 cm는 1 cm의 165배라는 뜻이에요.
    - 1시간에 60 km를 가는 빠르기는 60 km/h로 써요.
  notThis: 숫자만 있는 값에는 단위가 없어요. 3이라고만 쓰면 3 m인지 3 km인지 알 수 없어요.
  taughtIn: 3
- id: si
  term: 국제단위계
  aliases: [SI 단위]
  definition: 전 세계 과학자가 함께 쓰는 단위 묶음. 길이는 미터(m), 물체의 양은 킬로그램(kg), 시간은 초(s)가 기본.
  examples:
    - 100 m 달리기 세계 기록은 9.58초(s)예요.
    - 생수 1리터는 약 1 kg이에요.
  notThis: 나라마다 따로 쓰던 단위(자, 근, 마일, 파운드)는 국제단위계가 아니에요.
  taughtIn: 3
- id: prefix
  term: 접두어
  definition: 단위 앞에 붙여 10의 거듭제곱 배를 나타내는 말. 킬로(k)는 10³, 밀리(m)는 10⁻³, 마이크로(μ)는 10⁻⁶, 나노(n)는 10⁻⁹.
  examples:
    - 1 km는 10³ m, 그러니까 1,000 m예요.
    - 1 nm는 10⁻⁹ m예요. 머리카락 굵기의 약 10만분의 1이죠.
  notThis: 접두어는 새 단위가 아니에요. km는 m에 '천 배'를 붙인 거예요.
  taughtIn: 3

# ── 4강 ───────────────────────────────
- id: speed
  term: 속력
  definition: 1초 동안 움직인 거리. 움직인 거리를 걸린 시간으로 나눠서 구하는 값.
  unit: m/s (미터 매 초)
  examples:
    - 100 m를 10초에 달리면 속력은 10 m/s예요.
    - 고속도로를 100 km/h로 달리는 자동차의 속력은 약 28 m/s예요.
  notThis: 속도와는 달라요. 속력에는 방향이 없어요.
  taughtIn: 4
  q: motion
  highlight: true
- id: velocity
  term: 속도
  definition: 속력에 움직이는 방향까지 붙인 양.
  unit: m/s
  examples:
    - "\"북쪽으로 10 m/s\"는 속도예요."
    - 원형 트랙을 같은 빠르기로 도는 사람은 방향이 계속 바뀌니까 속도도 계속 바뀌어요.
  notThis: 속력과는 달라요. 일상에서는 둘을 섞어 쓰지만 물리학에서는 방향이 있는지로 구별해요.
  taughtIn: 4
  q: motion
  highlight: true
- id: acceleration
  term: 가속도
  definition: 1초 동안 속도가 바뀐 양. 바뀐 속도를 걸린 시간으로 나눠서 구하는 값.
  unit: m/s² (미터 매 초 제곱)
  examples:
    - 멈춰 있던 자동차가 5초 만에 25 m/s가 되면 가속도는 5 m/s²예요.
    - 손에서 놓은 공은 1초마다 약 9.8 m/s씩 빨라져요.
  notThis: 빠르기 자체가 아니에요. 아무리 빨리 달려도 속도가 바뀌지 않으면 가속도는 0이에요.
  taughtIn: 4
  q: motion
  highlight: true

# ── 5강 ───────────────────────────────
- id: inertia
  term: 관성
  definition: 물체가 지금의 속도를 그대로 유지하려는 성질.
  examples:
    - 달리던 버스가 급정거하면 승객의 몸이 앞으로 쏠려요.
    - 얼음 위에서 한 번 민 퍽은 멈추지 않고 오래 미끄러져요.
  notThis: 물체를 움직이게 하는 힘이 아니에요. 관성은 힘이 아니라 물체의 성질이에요.
  taughtIn: 5
- id: force
  term: 힘
  pattern: '힘(?![들쓸겹껏])'
  definition: 물체의 속도를 바꾸는 밀기나 당기기.
  unit: N (뉴턴)
  examples:
    - 마트 카트를 미는 손은 카트에 힘을 줘요.
    - 지구는 공을 아래로 끌어당기는 힘을 줘요.
  notThis: 움직임 자체가 힘은 아니에요. 같은 속도로 미끄러지는 물체에는 속도를 바꾸는 힘이 없어도 돼요.
  taughtIn: 5
  q: force
  highlight: true
- id: mass
  term: 질량
  definition: 물체의 속도를 바꾸기 어려운 정도. 물체에 든 물질의 양이라고 봐도 되는 양.
  unit: kg (킬로그램)
  examples:
    - 짐이 가득 찬 카트는 빈 카트보다 같은 힘으로 밀어도 덜 빨라져요.
    - 같은 사람의 질량은 지구에서나 달에서나 같아요.
  notThis: 무게와는 달라요. 무게는 지구가 끌어당기는 힘이라서 장소에 따라 달라져요.
  taughtIn: 5
  q: force
  highlight: true
- id: friction
  term: 마찰
  definition: 맞닿은 두 물체가 서로 미끄러지려 할 때 그 움직임을 방해하는 힘.
  unit: N
  examples:
    - 손을 뗀 마트 카트가 곧 멈추는 건 바닥과 바퀴 사이의 마찰 때문이에요.
    - 얼음 위에서는 마찰이 아주 작아서 한 번 민 퍽이 오래 미끄러져요.
  notThis: 공기가 물체를 붙잡는 것도 움직임을 방해하지만, 맞닿은 면 사이의 마찰과는 따로 다뤄요.
  taughtIn: 5
  q: force
- id: gravity
  term: 중력
  definition: 질량을 가진 물체끼리 서로 끌어당기는 힘.
  examples:
    - 손에서 놓은 사과가 떨어지는 건 중력 때문이에요.
    - 달이 지구 둘레를 도는 것도 중력 때문이에요.
  notThis: 자석이 쇠를 당기는 힘은 중력이 아니에요. 그건 자기력이에요.
  taughtIn: 5
  q: force
- id: weight
  term: 무게
  definition: 지구가 물체를 끌어당기는 힘의 크기. 질량에 9.8을 곱하면 뉴턴 단위의 무게.
  unit: N
  examples:
    - 질량 1 kg인 물체의 지구에서의 무게는 약 9.8 N이에요.
    - 같은 물체도 달에서는 무게가 지구의 약 6분의 1이에요.
  notThis: 질량과는 달라요. 체중계에 뜨는 kg은 무게를 재서 질량으로 바꿔 보여 준 값이에요.
  taughtIn: 5
  q: force
- id: second-law
  term: 가속도 법칙
  aliases: [F = ma]
  definition: 가속도는 받는 힘에 비례하고 질량에 반비례한다는 법칙. 식으로는 F = ma.
  examples:
    - 같은 힘으로 밀면 질량이 2배인 카트는 가속도가 절반이에요.
    - 같은 카트를 2배의 힘으로 밀면 가속도가 2배예요.
  notThis: 힘이 빠르기를 만든다는 생각과는 달라요. 힘은 속도를 '바꿔요'.
  taughtIn: 5

# ── 6강 ───────────────────────────────
- id: energy
  term: 에너지
  definition: 모습을 바꿔도 모두 더한 양은 늘지도 줄지도 않는 양. 물체를 움직이거나 데우는 데 쓰이는 것.
  unit: J (줄)
  examples:
    - 달리는 자동차, 높이 들린 돌, 충전된 배터리, 뜨거운 물은 모두 에너지를 가지고 있어요.
    - 브레이크를 밟으면 자동차의 운동 에너지가 브레이크를 데우는 열로 바뀌어요.
  notThis: 힘과는 달라요. 힘은 속도를 바꾸는 밀기·당기기이고, 에너지는 모습이 바뀌어도 합이 남는 양이에요.
  taughtIn: 6
  q: energy
  highlight: true
- id: kinetic-energy
  term: 운동 에너지
  definition: 움직이는 물체가 가진 에너지. ½ × 질량 × 속력².
  unit: J
  examples:
    - 속력이 2배가 되면 운동 에너지는 4배가 돼요.
    - 질량 1 kg인 공이 10 m/s로 날아가면 운동 에너지는 50 J이에요.
  notThis: 운동량과는 달라요. 운동량은 질량 × 속도이고, 7강에서 배워요.
  taughtIn: 6
  q: energy
  highlight: true
- id: potential-energy
  term: 위치 에너지
  definition: 높은 곳에 있어서 가진 에너지. 질량 × 9.8 × 높이(mgh)로, 물체가 떨어지면 운동 에너지로 바뀌는 것.
  unit: J
  examples:
    - 롤러코스터는 첫 언덕 꼭대기에서 위치 에너지가 가장 커요.
    - 질량 1 kg인 물체를 1 m 들어 올리면 위치 에너지가 약 9.8 J 늘어요.
  notThis: 이미 써 버린 에너지가 아니에요. 아직 다른 모습으로 바뀌지 않고 남아 있는 에너지예요.
  taughtIn: 6
  q: energy
  highlight: true
- id: joule
  term: 줄(J)
  pattern: '줄\(J\)'
  definition: 에너지의 단위. 1 J은 100 g짜리 사과를 약 1 m 들어 올리는 데 드는 에너지.
  examples:
    - 스마트폰 배터리 하나를 가득 채우면 약 5만 J이에요.
    - 밥 한 공기(약 300 kcal)에 든 에너지는 약 125만 J이에요.
  notThis: 기타 줄의 '줄'과는 달라요. 단위 이름은 영국의 물리학자 제임스 줄의 이름에서 왔어요.
  taughtIn: 6
  q: energy
- id: energy-conservation
  term: 에너지 보존
  aliases: [에너지 보존 법칙]
  definition: 에너지는 모습만 바뀔 뿐 모두 더한 양은 늘지도 줄지도 않는다는 법칙.
  examples:
    - 마찰이 없는 롤러코스터는 운동 에너지와 위치 에너지를 더한 값이 처음부터 끝까지 같아요.
    - 마찰이 있으면 줄어든 운동 에너지만큼 열이 생겨요.
  notThis: 에너지를 아껴 쓰자는 말(에너지 절약)과는 달라요. 보존 법칙은 사람이 지키는 규칙이 아니라 자연의 법칙이에요.
  taughtIn: 6

# ── 7강 ───────────────────────────────
- id: momentum
  term: 운동량
  definition: 질량 × 속도. 움직이는 물체를 멈추게 하기가 얼마나 어려운지 나타내는 양.
  unit: kg·m/s
  examples:
    - 같은 빠르기라면 트럭이 자전거보다 운동량이 훨씬 커요.
    - 0.15 kg 야구공이 40 m/s로 날아오면 운동량은 6 kg·m/s예요.
  notThis: 운동 에너지와는 달라요. 운동량에는 방향이 있고, 속도를 제곱하지 않고 그대로 곱해요.
  taughtIn: 7
  q: force
  highlight: true
- id: impulse
  term: 충격량
  definition: 힘 × 그 힘이 작용한 시간. 물체의 운동량이 바뀐 양과 같은 값.
  unit: N·s
  examples:
    - 공을 받을 때 손을 당기면 같은 충격량을 더 긴 시간 동안 받으니까 힘이 작아져요.
    - 자동차 에어백은 몸이 멈추는 시간을 늘려 몸이 받는 힘을 줄여요.
  notThis: 힘과는 달라요. 같은 충격량이라도 시간이 짧으면 큰 힘, 길면 작은 힘이 돼요.
  taughtIn: 7
  q: force
- id: action-reaction
  term: 작용 반작용
  aliases: [작용 반작용 법칙]
  definition: 두 물체가 서로에게 주는 힘은 크기가 같고 방향이 반대라는 법칙.
  examples:
    - 스케이트장에서 친구를 밀면 나도 뒤로 밀려나요.
    - 로켓은 가스를 뒤로 밀어내고, 가스는 로켓을 앞으로 밀어요.
  notThis: 한 물체에 작용하는 두 힘이 서로 지워지는 것과는 달라요. 작용과 반작용은 서로 다른 물체에 작용해요.
  taughtIn: 7
- id: momentum-conservation
  term: 운동량 보존
  aliases: [운동량 보존 법칙]
  definition: 서로 힘을 주고받는 물체들의 운동량을 모두 더한 값은, 바깥에서 힘이 들어오지 않으면 바뀌지 않는다는 법칙.
  examples:
    - 당구공이 부딪힌 뒤에도 두 공의 운동량을 더한 값은 부딪히기 전과 같아요.
    - 멈춰 있던 두 사람이 서로 밀면, 두 사람의 운동량은 크기가 같고 방향이 반대가 돼요.
  notThis: 운동 에너지 보존과는 달라요. 부딪힐 때 운동 에너지는 열이나 소리로 줄 수 있지만, 운동량의 합은 그대로예요.
  taughtIn: 7

# ── 8강 ───────────────────────────────
- id: initial-condition
  term: 초기 조건
  definition: 계산을 시작하는 순간의 위치와 속도처럼, 법칙에 넣어 주는 처음 값.
  examples:
    - 공을 던질 때의 위치, 빠르기, 방향이 초기 조건이에요.
    - 일기예보를 시작하는 순간의 기온, 기압, 바람이 초기 조건이에요.
  notThis: 법칙과는 달라요. 법칙은 어떤 초기 조건에서든 같고, 초기 조건은 상황마다 달라요.
  taughtIn: 8
- id: determinism
  term: 결정론
  definition: 지금 상태를 정확히 알면 법칙에 따라 미래가 하나로 정해진다는 생각.
  examples:
    - 일식 날짜를 수십 년 앞서 계산할 수 있다는 건 결정론의 강한 근거였어요.
    - 라플라스는 모든 것의 지금을 아는 지성에게 미래가 과거처럼 훤히 보일 거라고 썼어요.
  notThis: 운명론과는 달라요. 결정론은 법칙과 초기 조건으로 미래를 계산할 수 있다는 과학의 주장이에요.
  taughtIn: 8
- id: chaos
  term: 카오스
  definition: 처음 값의 아주 작은 차이가 시간이 지나며 크게 벌어져서, 법칙이 정해져 있어도 먼 미래를 예측하기 어려운 현상.
  examples:
    - 열흘 넘는 날씨 예보가 정확하기 어려운 건 카오스 때문이에요.
    - 당구에서 첫 충돌 각도가 조금만 달라도 공들이 전혀 다른 곳으로 가요.
  notThis: 법칙이 없는 무질서가 아니에요. 카오스는 법칙을 정확히 따르면서도 예측이 어려운 경우예요.
  taughtIn: 8

# ── 9강 ───────────────────────────────
- id: vibration
  term: 진동
  definition: 물체가 한 위치를 가운데에 두고 같은 움직임을 되풀이하는 것.
  examples:
    - 앞뒤로 오가는 그네는 진동해요.
    - 퉁긴 기타 줄은 아주 빠르게 진동해요.
  notThis: 한 방향으로 계속 가는 움직임은 진동이 아니에요. 진동은 같은 자리를 오가요.
  taughtIn: 9
- id: period
  term: 주기
  pattern: '주기(?!율)'
  definition: 진동이 한 번 되풀이되는 데 걸리는 시간.
  unit: s (초)
  examples:
    - 그네가 앞으로 갔다가 제자리로 돌아오는 데 3초 걸리면 주기는 3초예요.
    - 1분에 60번 뛰는 심장의 주기는 1초예요.
  notThis: 진동수와는 달라요. 주기는 '한 번에 몇 초', 진동수는 '1초에 몇 번'이에요.
  taughtIn: 9
  q: time
  highlight: true
- id: frequency
  term: 진동수
  definition: 1초 동안 진동이 되풀이되는 횟수.
  unit: Hz (헤르츠). 1 Hz는 1초에 한 번.
  examples:
    - 1초에 두 번 왕복하는 진동의 진동수는 2 Hz예요.
    - 피아노의 '라'(A4) 음을 내는 줄은 1초에 440번 진동해요.
  notThis: 진동의 크기(진폭)와는 달라요. 크게 흔들리든 작게 흔들리든 1초에 되풀이되는 횟수가 같으면 진동수는 같아요.
  taughtIn: 9
  q: time
  highlight: true
- id: hertz
  term: 헤르츠
  aliases: [Hz]
  definition: 진동수의 단위. 1 Hz는 1초에 한 번 되풀이된다는 뜻.
  examples:
    - 우리나라 가정용 전기는 1초에 60번 방향이 바뀌어서 60 Hz예요.
    - 사람 귀는 약 20 Hz에서 20,000 Hz까지의 소리를 들어요.
  notThis: 주기의 단위(초)와는 달라요. 1초에 한 번이면 1 Hz이고, 그때 주기는 1초예요.
  taughtIn: 9
  q: time
- id: amplitude
  term: 진폭
  definition: 진동하는 물체가 가운데 위치에서 가장 멀리 벗어난 거리.
  unit: m
  examples:
    - 그네를 세게 밀면 진폭이 커져요.
    - 기타 줄을 세게 퉁기면 진폭이 커지고 소리가 커져요.
  notThis: 진동수와는 달라요. 진폭이 커져도 1초에 되풀이되는 횟수는 거의 그대로예요.
  taughtIn: 9
  q: space
  highlight: true

# ── 10강 ──────────────────────────────
- id: wave
  term: 파동
  pattern: '파동(?!함수|묶음)'
  definition: 한 곳의 흔들림이 이웃으로 차례차례 넘겨지며 퍼져 나가는 현상. 물질은 제자리에서 흔들리고 흔들림만 멀리 가는 것.
  examples:
    - 경기장 관중석의 파도타기 응원은 파동이에요.
    - 연못에 돌을 던졌을 때 퍼지는 물결도 파동이에요.
  notThis: 물질이 옮겨 가는 게 아니에요. 물결이 지나가도 물 위의 낙엽은 제자리에서 오르내릴 뿐이에요.
  taughtIn: 10
- id: medium
  term: 매질
  definition: 파동을 전해 주는 물질.
  examples:
    - 물결의 매질은 물이에요.
    - 소리의 매질은 공기라서, 공기가 없는 우주에서는 소리가 전해지지 않아요.
  notThis: 파동 자체가 아니에요. 매질은 제자리에서 흔들릴 뿐 파동과 함께 떠나가지 않아요.
  taughtIn: 10
- id: displacement
  term: 변위
  definition: 매질의 한 점이 원래 자리에서 벗어난 거리와 방향. 위로 벗어나면 +, 아래로 벗어나면 −.
  unit: m
  examples:
    - 흔들리는 줄 위 한 점이 원래 높이보다 2 cm 위에 있으면 변위는 +2 cm예요.
    - 물결이 가장 낮게 꺼진 곳에서 물 표면의 변위는 −예요.
  notThis: 지금까지 움직인 거리가 아니에요. 변위는 지금 원래 자리에서 얼마나 떨어져 있는지만 봐요.
  taughtIn: 10
  q: space
  highlight: true

# ── 11강 ──────────────────────────────
- id: wavelength
  term: 파장
  definition: 파동에서 같은 모양이 되풀이되는 거리. 가장 높이 솟은 곳에서 다음으로 가장 높이 솟은 곳까지의 거리.
  unit: m
  examples:
    - 바다의 파도는 파장이 수십 m예요.
    - 피아노 '라'(440 Hz) 소리의 파장은 공기 중에서 약 0.77 m예요.
  notThis: 진폭과는 달라요. 파장은 옆으로 잰 거리, 진폭은 위아래로 잰 거리예요.
  taughtIn: 11
  q: space
  highlight: true
- id: wave-speed
  term: 파동의 속력
  definition: 파동의 모양이 1초 동안 나아가는 거리. 진동수 × 파장과 같은 값.
  unit: m/s
  examples:
    - 공기 중 소리의 속력은 약 340 m/s예요.
    - 같은 줄에서는 진동수를 높여도 파동의 속력은 그대로이고 파장이 짧아져요.
  notThis: 매질이 흔들리는 빠르기와는 달라요. 줄 위 한 점은 위아래로만 움직이고, 앞으로 나아가는 건 모양이에요.
  taughtIn: 11
  q: motion
  highlight: true

# ── 12강 ──────────────────────────────
- id: sine
  term: 사인
  aliases: [사인 함수]
  definition: 반지름이 1인 원 위를 도는 점이 각도 θ만큼 돌았을 때의 높이. sin θ로 쓰는 값.
  examples:
    - sin 0° = 0, sin 30° = 0.5, sin 90° = 1이에요.
    - 관람차 칸의 높이는 시간에 따라 사인 곡선 모양으로 오르내려요.
  notThis: 이름을 적는 서명(사인)과는 달라요. 소리는 같지만 영어 sine에서 온 말이에요.
  taughtIn: 12
- id: phase
  term: 위상
  definition: 진동이 한 번 되풀이되는 동안 어디쯤 와 있는지를 각도로 나타낸 것. 한 번의 되풀이가 360°.
  examples:
    - 위상 0°는 가운데에서 위로 출발하는 순간이고, 90°는 가장 높은 곳이에요.
    - 두 그네가 늘 같이 앞에 있으면 위상이 같고, 하나가 앞일 때 다른 하나가 뒤에 있으면 위상이 180° 달라요.
  notThis: 진폭과는 달라요. 위상은 '언제쯤', 진폭은 '얼마나 크게'예요.
  taughtIn: 12
  q: time
  highlight: true

# ── 13강 ──────────────────────────────
- id: superposition
  term: 중첩
  aliases: [중첩 원리]
  definition: 두 파동이 같은 곳을 지날 때, 그곳의 변위는 두 파동의 변위를 더한 값이 된다는 원리.
  examples:
    - 줄 양쪽에서 보낸 두 물결이 만나는 순간 두 높이가 더해져요.
    - 노이즈 캔슬링 이어폰은 소음과 반대 모양의 소리를 더해 소음을 지워요.
  notThis: 두 파동이 부딪혀 튕겨 나가는 게 아니에요. 겹쳤던 파동은 지나간 뒤 원래 모양 그대로 제 갈 길을 가요.
  taughtIn: 13

# ── 14강 ──────────────────────────────
- id: source
  term: 파원
  definition: 파동이 시작되는 곳.
  examples:
    - 연못에 떨어진 돌은 물결의 파원이에요.
    - 소리를 내는 스피커는 소리의 파원이에요.
  notThis: 매질과는 달라요. 파원은 흔들림을 만드는 곳이고, 매질은 흔들림을 전하는 물질이에요.
  taughtIn: 14
- id: interference
  term: 간섭
  pattern: '간섭(?! 무늬)'
  definition: 두 파동이 겹쳐서 어떤 곳에서는 더 커지고 어떤 곳에서는 작아지거나 사라지는 현상.
  examples:
    - 물웅덩이에 돌 두 개를 동시에 던지면 잔잔한 줄과 크게 출렁이는 줄이 번갈아 생겨요.
    - 비눗방울 표면의 무지갯빛도 간섭 때문에 생겨요.
  notThis: 한 파동이 다른 파동을 막는 게 아니에요. 간섭은 변위가 더해진 결과예요.
  taughtIn: 14
- id: constructive
  term: 보강 간섭
  definition: 두 파동이 위상이 같은 채로 만나 더 크게 흔들리는 것.
  examples:
    - 두 물결의 가장 높은 곳끼리 만나 더 높이 솟아요.
    - 두 스피커에서 같은 박자로 온 소리가 더 크게 들려요.
  notThis: 소리가 두 번 들리는 게 아니에요. 한 번에 더 크게 들려요.
  taughtIn: 14
- id: destructive
  term: 상쇄 간섭
  definition: 두 파동이 위상이 180° 다른 채로 만나 서로 지우는 것.
  examples:
    - 한 물결의 가장 높은 곳과 다른 물결의 가장 낮은 곳이 만나 잔잔해져요.
    - 노이즈 캔슬링 이어폰은 상쇄 간섭으로 소음을 줄여요.
  notThis: 파동이 아주 없어지는 게 아니에요. 그 자리에서만 지워지고, 다른 곳에서는 보강돼요.
  taughtIn: 14
- id: path-difference
  term: 경로차
  definition: 두 파원에서 한 지점까지 오는 거리의 차이.
  unit: m
  examples:
    - 한 스피커까지 5 m, 다른 스피커까지 6 m인 자리의 경로차는 1 m예요.
    - 경로차가 파장의 정수배인 곳에서는 보강 간섭이 일어나요.
  notThis: 두 파원 사이의 거리와는 달라요.
  taughtIn: 14
  q: space
  highlight: true

# ── 15강 ──────────────────────────────
- id: diffraction
  term: 회절
  definition: 파동이 틈이나 모서리를 지나면서 그 뒤쪽으로 퍼져 들어가는 현상. 틈의 폭이 파장과 비슷하거나 작을수록 많이 퍼지는 것.
  examples:
    - 열린 문 옆에 서 있으면 방 안 사람은 안 보여도 목소리는 들려요.
    - 방파제의 좁은 입구를 지난 물결이 항구 안으로 둥글게 퍼져요.
  notThis: 반사와는 달라요. 회절은 되돌아오는 게 아니라 뒤쪽으로 돌아 들어가는 거예요.
  taughtIn: 15

# ── 16강 ──────────────────────────────
- id: slit
  term: 슬릿
  definition: 빛이 지나가도록 판에 낸 아주 좁고 긴 틈.
  examples:
    - 검게 칠한 유리에 면도날로 선을 그으면 슬릿이 돼요.
    - 폭이 0.1 mm 정도인 틈을 슬릿으로 써요.
  notThis: 아무 구멍이나 슬릿이 아니에요. 슬릿은 폭이 빛의 파장과 견줄 만큼 좁아요.
  taughtIn: 16
- id: double-slit
  term: 이중 슬릿 실험
  definition: 가까이 붙은 슬릿 두 개에 빛을 비추고, 뒤쪽 화면에 생기는 무늬를 보는 실험.
  examples:
    - 토머스 영이 1800년대 초에 처음 이 실험을 했어요.
    - 레이저 포인터와 면도날로 집에서도 할 수 있어요.
  notThis: 슬릿 하나만 쓰는 실험(단일 슬릿)과는 달라요. 무늬의 모양이 달라요.
  taughtIn: 16
- id: fringe
  term: 간섭 무늬
  definition: 간섭 때문에 밝은 곳과 어두운 곳이 번갈아 줄지어 생기는 무늬.
  examples:
    - 이중 슬릿 뒤 화면의 밝고 어두운 줄이 간섭 무늬예요.
    - 비눗방울 표면의 색 띠도 간섭 무늬예요.
  notThis: 그림자와는 달라요. 간섭 무늬의 어두운 줄은 빛이 막혀서가 아니라 빛끼리 지워서 생겨요.
  taughtIn: 16

# ── 17강 ──────────────────────────────
- id: visible-light
  term: 가시광선
  definition: 사람 눈에 보이는 빛. 1초에 약 400조 번에서 750조 번 진동하는 빛.
  examples:
    - 무지개의 빨강부터 보라까지가 모두 가시광선이에요.
    - 형광등과 햇빛에는 여러 색의 가시광선이 섞여 있어요.
  notThis: 모든 빛이 가시광선은 아니에요. 눈에 보이지 않는 빛도 있어요(19강).
  taughtIn: 17
- id: speed-of-light
  term: 빛의 속력
  definition: 진공에서 빛이 1초 동안 가는 거리. 약 3 × 10⁸ m/s이고 기호로 c라고 쓰는 값.
  unit: m/s
  examples:
    - 빛은 1초에 지구를 일곱 바퀴 반 돌아요.
    - 태양에서 출발한 빛은 약 8분 20초 뒤에 지구에 닿아요.
  notThis: 무한히 빠른 게 아니에요. 빛도 가는 데 시간이 걸려요.
  taughtIn: 17
  q: motion
  highlight: true
- id: spectrum
  term: 스펙트럼
  pattern: '스펙트럼(?! 그래프)'
  definition: 빛을 진동수에 따라 나누어 늘어놓은 것. 프리즘을 지난 햇빛이 만드는 색의 띠가 그 예.
  examples:
    - 프리즘을 지난 햇빛은 무지개색 띠, 그러니까 스펙트럼을 만들어요.
    - 비 갠 하늘의 무지개도 햇빛의 스펙트럼이에요.
  notThis: 색 하나가 아니에요. 스펙트럼은 여러 진동수를 늘어놓은 전체예요.
  taughtIn: 17

# ── 18강 ──────────────────────────────
- id: charge
  term: 전하
  pattern: '전하(?![다고며면여해했지게기자는])'
  definition: 물체가 띤 전기의 양. 양(+)과 음(−) 두 종류가 있는 것.
  unit: C (쿨롱)
  examples:
    - 머리카락에 문지른 풍선은 음(−) 전하를 띠어요.
    - 대부분의 물체는 양 전하와 음 전하가 같은 양만큼 있어서 전기를 안 띤 것처럼 보여요.
  notThis: 전류와는 달라요. 전류는 전하가 흐르는 거예요.
  taughtIn: 18
  q: charge
  highlight: true
- id: electric-force
  term: 전기력
  definition: 전하를 띤 물체끼리 서로 밀거나 당기는 힘. 같은 종류끼리는 밀고 다른 종류끼리는 당기는 힘.
  unit: N
  examples:
    - 문지른 풍선에 머리카락이 끌려 올라가요.
    - 겨울에 문손잡이를 잡을 때 찌릿한 건 몸에 쌓인 전하가 한꺼번에 움직이기 때문이에요.
  notThis: 중력과는 달라요. 중력은 당기기만 하지만 전기력은 밀기도 해요.
  taughtIn: 18
  q: charge
  highlight: true
- id: coulomb-law
  term: 쿨롱 법칙
  definition: 두 전하 사이의 전기력은 두 전하의 곱에 비례하고 거리의 제곱에 반비례한다는 법칙.
  examples:
    - 거리가 2배가 되면 전기력은 4분의 1이 돼요.
    - 거리가 절반이 되면 전기력은 4배가 돼요.
  notThis: 거리에 그냥 반비례하는 게 아니에요. 거리의 '제곱'에 반비례해요.
  taughtIn: 18

# ── 19강 ──────────────────────────────
- id: em-wave
  term: 전자기파
  definition: 전하가 흔들릴 때, 다른 전하가 받는 힘의 변화가 물결처럼 퍼져 나가는 파동. 진공에서 빛의 속력으로 나아가고, 빛도 그 하나인 것.
  examples:
    - 라디오 방송국 안테나가 내보내는 전파는 전자기파예요.
    - 햇빛도 전자기파예요.
  notThis: 소리와는 달라요. 소리는 공기가 매질인 파동이고, 전자기파는 매질 없이 진공에서도 가요.
  taughtIn: 19
- id: radio-wave
  term: 전파
  definition: 전자기파 가운데 진동수가 가장 낮은 쪽. 라디오, 휴대전화, 와이파이에 쓰는 것.
  examples:
    - FM 라디오 89.1 MHz는 1초에 8,910만 번 진동해요.
    - 와이파이는 주로 1초에 약 24억 번 진동하는 전파를 써요.
  notThis: 전기가 전선 속을 흐르는 것과는 달라요. 전파는 공간을 건너가요.
  taughtIn: 19
- id: infrared
  term: 적외선
  definition: 빨간빛보다 진동수가 낮아서 눈에 보이지 않는 전자기파. 1초에 약 400조 번보다 적게 진동하는 빛.
  examples:
    - TV 리모컨은 적외선으로 신호를 보내요.
    - 난로 앞에서 얼굴이 따뜻해지는 건 적외선 때문이에요.
  notThis: 빨간색 빛과는 달라요. 적외선은 눈에 보이지 않아요.
  taughtIn: 19
- id: ultraviolet
  term: 자외선
  definition: 보랏빛보다 진동수가 높아서 눈에 보이지 않는 전자기파. 1초에 약 750조 번보다 많이 진동하는 빛.
  examples:
    - 햇볕에 피부가 타는 건 자외선 때문이에요.
    - 자외선 차단제는 이 빛을 막거나 흡수해요.
  notThis: 보라색 빛과는 달라요. 자외선은 눈에 보이지 않아요.
  taughtIn: 19
- id: x-ray
  term: X선
  definition: 자외선보다도 진동수가 훨씬 높은 전자기파. 몸의 부드러운 부분은 대부분 지나가고 뼈에는 더 많이 막히는 빛.
  examples:
    - 병원에서 X선으로 뼈 사진을 찍어요.
    - 공항 수하물 검색대도 X선을 써요.
  notThis: 방사능 물질 자체가 아니에요. X선은 빛의 한 종류예요.
  taughtIn: 19

# ── 20강 ──────────────────────────────
- id: standing-wave
  term: 정상파
  definition: 양쪽 끝 사이를 오가며 겹친 파동이, 앞으로 나아가지 않고 제자리에서 흔들리기만 하는 것처럼 보이는 파동.
  examples:
    - 퉁긴 기타 줄은 정상파로 떨어요.
    - 두 사람이 돌리는 긴 줄넘기 줄도 정상파 모양이에요.
  notThis: 멈춘 파동이 아니에요. 정상파도 흔들려요. 다만 흔들리는 모양이 옆으로 움직이지 않아요.
  taughtIn: 20
- id: node
  term: 마디
  pattern: '마디(?!로)'
  definition: 정상파에서 전혀 흔들리지 않는 점.
  examples:
    - 기타 줄의 양 끝은 언제나 마디예요.
    - 기타 줄 한가운데를 살짝 짚고 퉁기면 그곳이 마디가 돼요.
  notThis: 손가락 마디나 말 한마디와는 달라요. 같은 말이지만 뜻이 달라요.
  taughtIn: 20
  q: space
- id: mode
  term: 진동 모드
  definition: 줄이나 관이 정상파로 떨 수 있는 모양 하나하나. 양 끝이 고정된 줄에서는 반 파장이 정수 개 들어가는 모양만 생기는 것.
  examples:
    - 기타 줄이 통째로 활 모양 하나로 떠는 게 첫째 모드예요.
    - 한가운데가 마디가 되어 두 덩어리로 떠는 게 둘째 모드예요.
  notThis: 아무 모양의 흔들림이 아니에요. 줄 길이에 맞지 않는 모양은 금방 사라져요.
  taughtIn: 20
- id: fundamental
  term: 기본 진동
  aliases: [기본 진동수]
  definition: 진동 모드 가운데 진동수가 가장 낮은 것. 줄 전체에 반 파장 하나가 들어가는 모드이고, 그 진동수가 기본 진동수.
  examples:
    - 기타 개방현을 퉁겼을 때 들리는 음의 높이는 기본 진동수로 정해져요.
    - 줄을 반으로 짧게 짚으면 기본 진동수가 2배가 돼요.
  notThis: 가장 크게 떠는 진동이 아니에요. 기본 진동은 진폭이 아니라 진동수가 가장 낮은 모드예요.
  taughtIn: 20
  q: time
- id: harmonic
  term: 배음
  definition: 기본 진동수의 2배, 3배, 4배 … 진동수를 가진 진동 모드. 악기의 음색은 배음이 섞인 비율로 정해지는 것.
  examples:
    - 기타 줄 한가운데를 살짝 짚고 퉁기면 둘째 모드만 남아, 한 옥타브 높은 맑은 소리가 나요.
    - 같은 '라'를 내도 피아노와 바이올린 소리가 다른 건 배음의 비율이 달라서예요.
  notThis: 다른 음을 함께 치는 화음과는 달라요. 배음은 한 줄이 한 번에 내는 소리 안에 섞여 있어요.
  taughtIn: 20
  q: time

# ══ 21~137강 용어 지도 ════════════════════════════════════════
# 아직 쓰지 않은 강의 용어다. 이름과 강 번호(taughtIn)만 정해 두었다(planned: true).
# 그 강을 쓰는 세션이 정의와 예시를 채우고 planned 줄을 지운다. 다른 강의 구역은 고치지 않는다.
# 앞 강들이 이미 일상어로 쓰는 말은 previewIn에 그 강 번호를 적는다.

# ── 21강 ─────────────────────────────
- id: atom
  term: 원자
  definition: 물질을 이루는 아주 작은 알갱이. 원소마다 종류가 다르고, 녹거나 섞이거나 타는 동안 새로 생기거나 사라지지 않는 것.
  examples:
    - 금반지는 금 원자만으로 되어 있어요.
    - 물 분자 하나에는 수소 원자 둘과 산소 원자 하나가 들어 있어요.
  notThis: 먼지나 모래알처럼 눈에 보이는 작은 조각이 아니에요. 모래알 하나에도 원자가 약 10¹⁹개 들어 있어요.
  taughtIn: 21
  previewIn: [1, 2, 3, 8, 18, 20]
- id: molecule
  term: 분자
  definition: 원자 몇 개가 단단히 묶여, 그 물질의 성질을 지닌 가장 작은 알갱이.
  examples:
    - 물 한 컵에는 물 분자가 약 7 × 10²⁴개 들어 있어요.
    - 설탕이 물에 녹으면 설탕 분자들이 물 분자 사이로 흩어져요.
  notThis: 원자와 같은 말이 아니에요. 분자를 쪼개면 그 물질이 아닌 원자들이 돼요.
  taughtIn: 21
  previewIn: [11]

# ── 22강 ─────────────────────────────
- id: brownian-motion
  term: 브라운 운동
  definition: 물이나 공기에 뜬 아주 작은 알갱이가, 둘레의 분자들에게 사방에서 고르지 않게 부딪혀 쉬지 않고 제멋대로 흔들리는 움직임.
  examples:
    - 현미경으로 우유 한 방울을 보면 지방 알갱이들이 쉬지 않고 흔들려요.
    - 햇빛이 드는 방에서 먼지보다 훨씬 작은 연기 알갱이는 바람이 없어도 제멋대로 떠돌아요.
  notThis: 바람이나 물살에 떠밀리는 움직임과는 달라요. 그런 건 알갱이들이 한 방향으로 같이 움직이지만, 브라운 운동은 알갱이마다 제멋대로예요.
  taughtIn: 22

# ── 23강 ─────────────────────────────
- id: absolute-temperature
  term: 절대온도
  definition: 절대영도를 0으로 잡고 눈금 한 칸은 섭씨와 같게 잰 온도. 섭씨온도에 273.15를 더한 값이고, 분자들의 평균 운동 에너지가 이 값에 비례하는 것.
  unit: "K (켈빈)"
  examples:
    - 물이 어는 0 ℃는 절대온도로 273 K예요.
    - 방 안의 27 ℃는 300 K이고, 사람의 몸은 약 310 K예요.
  notThis: 섭씨온도와는 0의 자리가 달라요. 27 ℃에서 327 ℃로 데우면 숫자는 12배지만, 절대온도로는 300 K에서 600 K로 2배예요.
  taughtIn: 23
  q: heat
- id: absolute-zero
  term: 절대영도
  definition: 분자의 움직임이 가장 작아져서 더는 내려갈 수 없는 온도. 0 K, 섭씨로 −273.15 ℃.
  examples:
    - 기체를 식힐수록 부피가 줄어드는 선을 늘이면 약 −273 ℃에서 0이 돼요.
    - 실험실에서는 0 K보다 10억분의 1 K쯤 높은 데까지 식혀 봤지만, 0 K에 딱 닿을 수는 없어요.
  notThis: 물이 어는 온도(0 ℃)가 아니에요. 절대영도는 그보다 273도나 낮아요.
  taughtIn: 23
  q: heat

# ── 24강 ─────────────────────────────
- id: probability
  term: 확률
  definition: 같은 조건에서 아주 여러 번 되풀이할 때, 어떤 결과가 나오는 비율이 가까워지는 값. 0과 1 사이의 수.
  examples:
    - 주사위 두 개를 던져 합이 7이 나올 확률은 36가지 가운데 6가지라서 1/6이에요.
    - 동전을 던져 앞면이 나올 확률은 1/2이라서, 1000번 던지면 앞면이 500번 가까이 나와요.
  notThis: 한 번의 결과를 알려 주는 값이 아니에요. 확률이 1/6이어도 여섯 번 안에 꼭 한 번 나오는 건 아니에요.
  taughtIn: 24
- id: expectation
  term: 기댓값
  definition: 결과마다 그 값에 확률을 곱해 모두 더한 값. 아주 여러 번 되풀이했을 때 평균이 가까워지는 값.
  examples:
    - 주사위 하나를 던질 때 나오는 눈의 기댓값은 3.5예요.
    - 주사위 두 개 합의 기댓값은 7이에요.
  notThis: 한 번에 실제로 나오는 값이 아니에요. 주사위에는 3.5라는 눈이 없지만 기댓값은 3.5예요.
  taughtIn: 24

# ── 25강 ─────────────────────────────
- id: boltzmann-distribution
  term: 볼츠만 분포
  definition: 온도가 정해진 수많은 분자 사이에서, 에너지가 같은 양만큼 높아질 때마다 그 상태에 있을 확률이 같은 비율로 줄어드는 규칙. 에너지가 kT만큼 높아질 때마다 약 0.37배가 되는 것.
  examples:
    - 공기는 약 5.5 km 오를 때마다 절반쯤으로 옅어져서, 에베레스트 꼭대기의 공기는 바닷가의 약 3분의 1이에요.
    - 젖은 빨래가 끓지 않아도 마르는 건, 드물게 큰 에너지를 얻은 물 분자가 계속 공기로 빠져나가서예요.
  notThis: 에너지가 높은 상태가 아예 없다는 뜻이 아니에요. 드물 뿐이고, 온도가 높을수록 덜 드물어져요.
  taughtIn: 25

# ── 26강 ─────────────────────────────
- id: degree-of-freedom
  term: 자유도
  definition: 분자나 물체가 에너지를 따로 담을 수 있는 자리 하나하나. 날아가는 세 방향, 도는 방향, 진동의 운동과 위치를 저마다 하나로 세는 것.
  examples:
    - 헬륨 원자는 앞뒤·좌우·위아래로 날아가기만 해서 자유도가 3이에요.
    - 아령 모양의 질소 분자는 날아가기 3에 돌기 2를 더해 자유도가 5예요.
  notThis: 마음대로 할 수 있는 정도라는 일상의 뜻과는 달라요. 물리학의 자유도는 에너지를 담는 자리의 수예요.
  taughtIn: 26
- id: equipartition
  term: 에너지 등분배
  definition: 온도가 정해지면 자유도 하나하나가 평균적으로 같은 에너지, 곧 ½kT씩을 갖는다는 고전물리학의 규칙.
  examples:
    - 같은 수의 분자를 1 K 데우는 데 질소는 헬륨보다 약 5/3배의 에너지가 들어요.
    - 용수철처럼 진동하는 것 하나는 운동과 위치 두 자리를 가져서 평균 kT의 에너지를 가져요.
  notThis: 분자마다 에너지가 똑같다는 뜻이 아니에요. 분자 하나하나는 제각각이고, 자리마다의 평균이 같다는 뜻이에요.
  taughtIn: 26
  q: energy

# ── 27강 ─────────────────────────────
- id: thermal-radiation
  term: 열복사
  definition: 물체가 자기 온도 때문에 내는 전자기파. 물질 속 전하가 열로 흔들려 생기고, 여러 진동수가 섞여 있으며 뜨거울수록 세고 진동수가 높아지는 빛.
  examples:
    - 전기난로 앞에 서면 열선이 빛나기 전부터 얼굴이 따뜻해져요. 적외선 열복사예요.
    - 열화상 카메라는 사람 몸(약 310 K)이 내는 열복사를 잡아서 깜깜한 곳에서도 사람을 보여 줘요.
  notThis: 뜨거운 공기가 위로 올라가며 열을 옮기는 것과는 달라요. 열복사는 전자기파라서 진공도 건너가요.
  taughtIn: 27
  q: heat

# ── 28강 ─────────────────────────────
- id: blackbody
  term: 흑체
  definition: 받은 빛을 진동수와 상관없이 모두 흡수하는 물체. 반사하는 빛이 없어 열복사만 내고, 그 빛의 곡선이 온도만으로 정해지는 것.
  examples:
    - 작은 구멍이 난 속이 빈 상자는 구멍으로 들어간 빛이 빠져나오지 못해서 흑체처럼 행동해요.
    - 태양과 별은 흑체와 꽤 비슷하게 빛을 내서, 별빛의 색으로 겉 온도를 재요.
  notThis: 늘 새까맣게 보이는 물체라는 뜻만은 아니에요. 흑체도 달구면 빨갛게, 더 달구면 하얗게 빛나요.
  taughtIn: 28
- id: wien-law
  term: 빈의 법칙
  definition: 흑체가 가장 세게 내는 빛의 진동수는 절대온도에 비례한다는 법칙. 진동수로 그리면 꼭대기는 약 5.88 × 10¹⁰ Hz × 절대온도.
  examples:
    - 약 3,600 K인 베텔게우스는 붉게, 약 12,000 K인 리겔은 푸르스름하게 빛나요.
    - 쇠를 달구면 빨강에서 주황, 노랑, 흰빛으로 색이 바뀌어요.
  notThis: 뜨거울수록 빛이 세진다는 규칙과는 달라요. 빈의 법칙은 가장 센 진동수가 어디로 옮겨 가는지를 말해요.
  taughtIn: 28

# ── 29강 ─────────────────────────────
# (새 용어 없음)

# ── 30강 ─────────────────────────────
- id: ultraviolet-catastrophe
  term: 자외선 파탄
  definition: 고전물리학대로 흑체 상자 속 빛의 모드마다 kT씩 나눠 주면, 진동수가 높을수록 에너지가 커져서 흑체가 내는 에너지 전체가 무한대가 된다는 모순. 1911년 에렌페스트가 붙인 이름.
  examples:
    - 고전 계산대로라면 켜 놓은 전기난로 하나가 무한한 에너지를, 그것도 대부분 자외선과 X선으로 내야 해요.
    - 실제로 잰 흑체의 곡선은 진동수가 낮은 쪽에서만 고전 계산과 맞고, 높은 쪽에서는 꺾여 내려와요.
  notThis: 자외선이 피부를 태우는 일과는 상관없어요. 계산이 자외선 너머에서 무한대로 터진다는 뜻의 이름이에요.
  taughtIn: 30

# ── 31강 ─────────────────────────────
# (새 용어 없음)

# ── 32강 ─────────────────────────────
- id: quantum
  term: 양자
  pattern: "양자(?=[은는이가을를의도와로에만]|[\\s.,)]|$)"
  definition: 에너지가 주고받아지는 가장 작은 덩어리. 진동수 f인 진동에서는 hf 크기.
  examples:
    - 초록빛(1초에 6 × 10¹⁴번 진동)의 양자 하나는 약 4 × 10⁻¹⁹ J이에요.
    - 질소 분자의 떨기는 양자 하나가 방 온도의 kT보다 열 배 넘게 커서, 방 온도에서는 거의 떨지 않아요.
  notThis: 아주 작은 알갱이 물질을 가리키는 말이 아니에요. 양자는 에너지 같은 양이 덩어리로 오가는 단위예요.
  taughtIn: 32
- id: planck-constant
  term: 플랑크 상수
  definition: 진동수와 양자 하나의 에너지를 잇는 수 h. E = hf에서 h = 6.626 × 10⁻³⁴ J·s.
  unit: "J·s (줄 곱하기 초)"
  examples:
    - 2019년부터 킬로그램은 플랑크 상수의 값을 정확히 6.62607015 × 10⁻³⁴ J·s로 정해서 정의해요.
    - 1초에 5 × 10¹⁴번 진동하는 빛의 양자는 h × 5 × 10¹⁴ ≈ 3.3 × 10⁻¹⁹ J이에요.
  notThis: 볼츠만 상수 k와는 달라요. k는 온도와 에너지를 잇고, h는 진동수와 에너지를 이어요.
  taughtIn: 32

