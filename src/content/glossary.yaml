# ── 87강 ─────────────────────────────
- id: measurement-problem
  term: 측정 문제
  definition: 재지 않을 때는 파동함수가 슈뢰딩거 방정식대로 겹친 채 부드럽게 바뀌고, 재면 결과 하나로 붕괴한다는 두 규칙 사이에서, 무엇이 측정이고 언제 결과 하나로 정해지는지를 이론이 분명히 말해 주지 않는 문제.
  examples:
    - 상자 속 고양이의 삶과 죽음이 원자 하나의 겹친 상태에 묶이면, 상자를 열기 전 고양이의 상태를 어떻게 말해야 하는지가 측정 문제예요.
    - 검출기도 원자들로 되어 있는데, 왜 검출기는 겹친 상태로 남지 않고 "찰칵" 소리 하나만 내는지 묻는 것도 측정 문제예요.
  notThis: 측정 기계가 서툴러서 생기는 오차 문제가 아니에요. 아무리 정밀한 장치로 재도 남는, 이론의 규칙에 관한 물음이에요.
  taughtIn: 87

# ── 88강 ─────────────────────────────
- id: locality
  term: 국소성
  definition: 어떤 곳에서 일어난 일은 멀리 떨어진 곳에 빛보다 빠르게 영향을 줄 수 없다는 생각. 여기서 일어나는 일은 여기 가까이에서 일어난 일에만 바로 영향을 받는다.
  examples:
    - 서울에서 친 박수 소리는 부산까지 가는 데 시간이 걸려요. 서울의 박수가 그 순간 부산의 컵을 흔들 수는 없어요.
    - 달에서 우주인이 손전등을 켜면, 지구에서는 약 1.3초 뒤에야 그 빛이 보여요. 그보다 먼저 달의 일을 알 방법은 없어요.
  notThis: 멀리 있는 것끼리는 아무 관계도 없다는 뜻이 아니에요. 영향은 전해질 수 있지만, 빛보다 빠르게 전해질 수는 없다는 뜻이에요.
  taughtIn: 88
- id: realism
  term: 실재성
  definition: 물체의 성질은 재기 전에도 정해진 값으로 있고, 측정은 그 값을 드러낼 뿐이라는 생각.
  examples:
    - 엎어 둔 컵 아래 동전은 들춰 보기 전에도 앞면이나 뒷면으로 정해져 있어요.
    - 아무도 냉장고 문을 열지 않아도 그 안의 우유는 정해진 온도를 가지고 있다고 우리는 믿어요.
  notThis: 세상이 실제로 있느냐는 큰 물음 전체를 뜻하지 않아요. 여기서는 재지 않은 성질에도 정해진 값이 있느냐는 좁은 뜻으로만 써요.
  taughtIn: 88

# ── 89강 ─────────────────────────────
- id: entanglement
  term: 얽힘
  definition: 두 개 이상의 입자가 하나로 묶인 양자 상태에 있어서, 입자마다의 상태를 따로 떼어 적을 수 없는 관계. 두 입자를 잰 결과가, 미리 정해 둔 값으로는 흉내 낼 수 없는 방식으로 서로 맞춰진다.
  examples:
    - 원자 하나가 광자 두 개를 잇달아 내놓으면, 두 광자의 편광이 얽힌 채로 반대 방향으로 날아가요.
    - 2017년 중국의 인공위성은 얽힌 광자 쌍을 1,200 km 떨어진 지상의 두 관측소로 나눠 보냈어요.
  notThis: 장갑 한 켤레를 두 상자에 나눠 담은 것과는 달라요. 장갑은 처음부터 왼손과 오른손이 정해져 있지만, 얽힌 입자는 재는 방향을 바꾸면 미리 정한 값으로는 설명할 수 없는 결과가 나와요. 또 얽힘으로 빛보다 빠르게 소식을 보낼 수는 없어요.
  taughtIn: 89

# ── 90강 ─────────────────────────────
- id: bell-inequality
  term: 벨 부등식
  definition: 국소성과 실재성을 함께 지키는 이론이라면, 멀리 떨어진 두 측정 결과가 서로 맞춰지는 정도가 반드시 지켜야 하는 한계를 적은 부등식. 1964년 존 벨이 처음 유도했고, 양자역학은 얽힌 입자에서 이 한계를 넘는다고 예측한다.
  examples:
    - 얽힌 짝을 세 방향 가운데 아무렇게나 골라 재면, 미리 정한 답으로는 두 결과가 반대로 나오는 비율이 5/9보다 작아질 수 없어요.
    - 두 학생이 세 문제의 답을 미리 짜고 따로 시험을 보면서 같은 문제에는 늘 반대 답을 쓰기로 했다면, 문제를 아무렇게나 받았을 때 답이 반대인 비율은 5/9 아래로 내려갈 수 없어요.
  notThis: 양자역학이 틀렸다는 걸 보이는 식이 아니에요. 국소성과 실재성을 함께 지키는 이론이 넘을 수 없는 선이고, 실험 결과가 그 선을 넘으면 두 믿음 가운데 적어도 하나가 틀렸다는 뜻이에요.
  taughtIn: 90

