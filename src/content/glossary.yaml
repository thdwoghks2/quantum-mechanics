# ── 84강 ─────────────────────────────
- id: copenhagen-interpretation
  term: 코펜하겐 해석
  definition: 1920년대 후반 보어와 하이젠베르크의 생각을 묶어 부르는 양자역학의 해석. 파동함수는 측정 결과가 나올 확률만 알려 주고, 측정하기 전 물체의 성질은 정해져 있지 않다고 보며, 어떤 장치로 묻느냐에 따라 서로 다른 그림이 필요하다고 본다.
  examples:
    - 이중 슬릿을 지나는 전자가 어느 틈으로 갔는지 물으면, 코펜하겐 해석은 "재지 않았다면 정해진 답이 없어요"라고 대답해요.
    - 엎어 둔 컵 아래 동전은 보기 전에도 앞면이나 뒷면으로 정해져 있어요. 코펜하겐 해석에서 재기 전의 스핀은 이런 동전과 달라요.
  notThis: "'답은 이미 정해져 있는데 우리가 아직 모를 뿐'이라는 생각은 코펜하겐 해석이 아니에요. 또 누군가 한 번에 써 낸 공식 문서도 아니에요. 비슷한 생각들에 나중에 붙인 이름이라서, 보어와 하이젠베르크의 생각도 조금씩 달라요."
  taughtIn: 84

