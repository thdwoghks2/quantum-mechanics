# 공식 카드. 강에서 <Formula id="…" />로 보여 주고, 용어집 페이지의 '공식' 칸에도 모인다.
#
# name     이름                tex   식(TeX)
# read     말로 읽기            says  이 식이 말하는 것(1~2문장)
# symbols  식 속 글자 → 기호 id(symbols.yaml). 기호 표가 여기서 저절로 만들어진다.
# example  숫자 넣어 보기 { tex, note }
# holds    맞는 범위            fails 안 맞는 범위, 흔한 잘못
# build    단계별로 쌓기 [{ tex, note }]  <FormulaBuild id="…" />가 한 단계씩 보여 준다.
# taughtIn 처음 배우는 강

- id: newton-second-law
  name: 가속도 법칙 (뉴턴 제2법칙)
  tex: 'F = ma'
  read: 힘 = 질량 × 가속도
  says: 같은 힘이면 질량이 클수록 덜 빨라지고, 같은 질량이면 힘이 셀수록 더 빨라져요.
  symbols: { F: force-F, m: mass-m, a: acceleration-a }
  example:
    tex: 'F = 20\,\mathrm{kg} \times 2\,\mathrm{m/s^2} = 40\,\mathrm{N}'
    note: 20 kg 카트를 1초마다 2 m/s씩 빨라지게 하려면 40 N으로 밀어야 해요.
  holds: 빛보다 아주 느린 물체에서 잘 맞아요.
  fails: 빛에 가까운 빠르기에서는 맞지 않아요(12부). F는 물체가 받는 모든 힘을 더한 알짜힘이에요.
  build:
    - { tex: 'F', note: '물체가 받는 힘을 모두 더한 것(알짜힘)이에요. 단위는 N이에요.' }
    - { tex: 'F = m', note: '질량이 클수록 같은 가속도를 내는 데 힘이 더 들어요.' }
    - { tex: 'F = ma', note: '가속도가 클수록 힘이 더 들어요. 힘은 질량과 가속도를 곱한 만큼이에요.' }
  taughtIn: 5

- id: power-of-ten
  name: 10의 거듭제곱
  tex: '10^n = \underbrace{10 \times 10 \times \cdots \times 10}_{n\text{번}}'
  read: 10의 n제곱은 10을 n번 곱한 수
  says: 지수 $n$이 1 커질 때마다 수는 10배가 돼요. $n$이 음수면 10으로 그만큼 나눈 수예요.
  symbols: { n: exponent-n }
  example:
    tex: '10^3 = 10 \times 10 \times 10 = 1{,}000'
    note: 1 뒤에 0이 3개 붙어요.
  holds: $n$은 0이나 음의 정수여도 돼요. $10^0 = 1$, $10^{-2} = 0.01$이에요.
  taughtIn: 2

- id: exponent-product
  name: 거듭제곱의 곱셈과 나눗셈
  tex: '10^n \times 10^k = 10^{n+k}, \quad 10^n \div 10^k = 10^{n-k}'
  read: 곱하면 지수끼리 더하고, 나누면 지수끼리 빼요
  says: 10을 $n$번 곱한 수에 10을 $k$번 곱한 수를 곱하면, 10을 모두 $n+k$번 곱한 셈이에요.
  symbols: { n: exponent-n, k: exponent-k }
  example:
    tex: '10^3 \times 10^4 = 10^{3+4} = 10^7'
    note: 1,000 × 10,000 = 10,000,000이에요.
  holds: 밑이 같은 거듭제곱끼리만 이렇게 계산해요. $10^3 \times 2^4$는 지수를 더할 수 없어요.
  build:
    - { tex: '10^3 \times 10^4', note: '10을 세 번 곱한 수와 네 번 곱한 수를 곱해요.' }
    - { tex: '10^3 \times 10^4 = 10^{3+4} = 10^7', note: '10을 모두 일곱 번 곱했으니 지수를 더해요.' }
    - { tex: '10^n \times 10^k = 10^{n+k}', note: '숫자 대신 아무 지수 $n$, $k$로 쓰면 이 규칙이 돼요. 나눗셈은 지수를 빼요.' }
  taughtIn: 2

- id: speed-formula
  name: 속력 구하기
  tex: 'v = \dfrac{d}{t}'
  read: 속력 = 간 거리 ÷ 걸린 시간
  says: 1초 동안 간 거리가 속력이에요. 같은 시간에 더 멀리 가면 더 빨라요.
  symbols: { v: velocity-v, d: distance-d, t: time-t }
  example:
    tex: 'v = \dfrac{100\,\mathrm{m}}{9.58\,\mathrm{s}} \approx 10.4\,\mathrm{m/s}'
    note: 우사인 볼트가 100 m를 달린 평균 속력이에요.
  holds: 이렇게 구한 값은 그동안의 평균 속력이에요. 어느 한 순간의 속력은 아주 짧은 시간으로 나눠 구해요.
  taughtIn: 4

- id: acceleration-formula
  name: 가속도 구하기
  tex: 'a = \dfrac{v_{\text{나중}} - v_{\text{처음}}}{t}'
  read: 가속도 = (나중 속도 − 처음 속도) ÷ 걸린 시간
  says: 1초마다 속도가 얼마나 바뀌는지가 가속도예요. 느려지면 가속도는 음수예요.
  symbols: { a: acceleration-a, v: velocity-v, t: time-t }
  example:
    tex: 'a = \dfrac{25\,\mathrm{m/s} - 0\,\mathrm{m/s}}{5\,\mathrm{s}} = 5\,\mathrm{m/s^2}'
    note: 멈춰 있던 자동차가 5초 만에 25 m/s가 되면 가속도는 5 m/s²예요.
  holds: 속도가 고르게 바뀔 때는 어느 구간에서 재도 같은 값이 나와요. 고르지 않으면 그 구간의 평균 가속도예요.
  build:
    - { tex: 'v_{\text{나중}} - v_{\text{처음}}', note: '먼저 속도가 얼마나 바뀌었는지 구해요. 나중 속도에서 처음 속도를 빼요.' }
    - { tex: '\dfrac{v_{\text{나중}} - v_{\text{처음}}}{t}', note: '바뀐 속도를 걸린 시간 $t$로 나누면 1초 동안 바뀐 양이 돼요.' }
    - { tex: 'a = \dfrac{v_{\text{나중}} - v_{\text{처음}}}{t}', note: '그 값이 가속도 $a$예요. 단위는 m/s ÷ s = m/s²예요.' }
  taughtIn: 4

- id: kinetic-energy-formula
  name: 운동 에너지
  tex: 'E_k = \tfrac{1}{2} m v^2'
  read: 운동 에너지 = ½ × 질량 × 속력 × 속력
  says: 질량이 2배면 운동 에너지도 2배지만, 속력이 2배면 4배가 돼요. 속력을 두 번 곱하기 때문이에요.
  symbols: { E: energy-E, E_k: energy-Ek, m: mass-m, v: velocity-v }
  example:
    tex: 'E_k = \tfrac{1}{2} \times 1\,\mathrm{kg} \times (10\,\mathrm{m/s})^2 = 50\,\mathrm{J}'
    note: 1 kg 공이 10 m/s로 날아갈 때의 운동 에너지예요.
  holds: 빛보다 아주 느린 물체에서 맞아요. 빛에 가까운 빠르기에서는 100강의 식으로 바꿔야 해요.
  build:
    - { tex: 'm', note: '무거울수록 에너지가 많아요. 질량 $m$에 비례해요.' }
    - { tex: 'm v^2', note: '속력 $v$는 두 번 곱해요. 그래서 2배 빠르면 4배예요.' }
    - { tex: 'E_k = \tfrac{1}{2} m v^2', note: '앞의 ½은 단위를 J로 맞추고 값을 정확하게 만드는 숫자예요. 질량이나 속력과 상관없이 늘 ½이에요.' }
  taughtIn: 6

- id: potential-energy-formula
  name: 위치 에너지 (지표 가까이)
  tex: 'E_p = m g h'
  read: 위치 에너지 = 질량 × 중력 가속도 × 높이
  says: 무거울수록, 높이 있을수록 위치 에너지가 커요. 높이를 2배로 하면 위치 에너지도 2배예요.
  symbols: { E_p: energy-Ep, m: mass-m, g: gravity-g, h: height-h }
  example:
    tex: 'E_p = 0.1\,\mathrm{kg} \times 9.8\,\mathrm{m/s^2} \times 1\,\mathrm{m} \approx 1\,\mathrm{J}'
    note: 100 g 사과를 1 m 들어 올리면 약 1 J이에요.
  holds: 지구 표면 가까이, 높이가 지구 크기보다 훨씬 작을 때 맞아요. 높이는 기준으로 정한 곳에서 재요.
  taughtIn: 6

- id: energy-conservation-formula
  name: 역학적 에너지 보존 (마찰이 없을 때)
  tex: 'E_k + E_p = \text{일정}'
  read: 운동 에너지 + 위치 에너지 = 늘 같은 값
  says: 내려가면 위치 에너지가 줄고 그만큼 운동 에너지가 늘어요. 둘을 더한 값은 그대로예요.
  symbols: { E_k: energy-Ek, E_p: energy-Ep, m: mass-m, v: velocity-v, g: gravity-g, h: height-h }
  example:
    tex: '\tfrac{1}{2} m v^2 = m g h \;\Rightarrow\; v = \sqrt{2 g h}'
    note: 멈춘 채 높이 h에서 출발하면, 바닥에서는 위치 에너지가 모두 운동 에너지가 돼요.
  holds: 마찰이 있으면 일부가 열로 바뀌어서 둘의 합은 줄어요. 열까지 더한 전체 에너지는 그래도 그대로예요.
  taughtIn: 6

- id: momentum-formula
  name: 운동량
  tex: 'p = m v'
  read: 운동량 = 질량 × 속도
  says: 무겁고 빠를수록 운동량이 커요. 속도에 방향이 있으니 운동량에도 방향이 있어요.
  symbols: { p: momentum-p, m: mass-m, v: velocity-v }
  example:
    tex: 'p = 0.15\,\mathrm{kg} \times 40\,\mathrm{m/s} = 6\,\mathrm{kg{\cdot}m/s}'
    note: 강속구로 던진 야구공의 운동량이에요.
  holds: 빛보다 아주 느린 물체에서 맞아요. 빛에는 질량이 없지만 운동량이 있어요(36강).
  taughtIn: 7

- id: impulse-formula
  name: 충격량과 운동량의 변화
  tex: 'F\,t = m\,\Delta v'
  read: 힘 × 힘이 작용한 시간 = 질량 × 바뀐 속도
  says: 힘을 오래 줄수록, 세게 줄수록 운동량이 많이 바뀌어요. 같은 운동량을 바꾸려면 큰 힘을 짧게 주거나 작은 힘을 길게 주면 돼요.
  symbols: { F: force-F, t: time-t, m: mass-m, v: velocity-v, Delta: delta, a: acceleration-a }
  example:
    tex: 'F = \dfrac{6\,\mathrm{kg{\cdot}m/s}}{0.1\,\mathrm{s}} = 60\,\mathrm{N}'
    note: 6 kg·m/s인 공을 0.1초 만에 멈추면 손이 평균 60 N을 받아요. 0.01초면 600 N이에요.
  holds: 힘이 바뀌어도 그동안의 평균 힘으로 보면 맞아요.
  build:
    - { tex: 'F = m a', note: '5강의 가속도 법칙에서 출발해요.' }
    - { tex: 'F = m\,\dfrac{\Delta v}{t}', note: '가속도 $a$는 바뀐 속도 $\Delta v$를 걸린 시간 $t$로 나눈 값이에요. $\Delta v$는 한 덩어리로 "바뀐 속도"라고 읽어요.' }
    - { tex: 'F\,t = m\,\Delta v', note: '양쪽에 $t$를 곱해요. 왼쪽이 충격량, 오른쪽이 운동량이 바뀐 양이에요.' }
  taughtIn: 7

- id: momentum-conservation-formula
  name: 운동량 보존
  tex: 'p_A + p_B = \text{일정}'
  read: 두 물체의 운동량을 더한 값은 늘 같아요
  says: 두 물체가 서로 밀거나 부딪혀도, 바깥에서 힘이 들어오지 않으면 운동량의 합은 그대로예요. 한쪽이 얻은 만큼 다른 쪽이 잃어요.
  symbols: { p: momentum-p }
  example:
    tex: '80\,\mathrm{kg} \times (-1\,\mathrm{m/s}) + 40\,\mathrm{kg} \times (+2\,\mathrm{m/s}) = 0'
    note: 멈춰 있던 어른과 아이가 서로 밀면, 민 뒤에도 운동량의 합은 0이에요.
  holds: 튕기는 충돌, 달라붙는 충돌 모두에서 맞아요. 운동 에너지의 합은 달라붙으면 줄지만, 운동량의 합은 그대로예요.
  taughtIn: 7

- id: frequency-period
  name: 진동수와 주기
  tex: 'f = \dfrac{1}{T}'
  read: 진동수 = 1 ÷ 주기
  says: 한 번에 걸리는 시간이 짧을수록 1초에 더 많이 진동해요. 주기와 진동수는 서로 뒤집은 값이에요.
  symbols: { f: frequency-f, T: period-T }
  example:
    tex: 'f = \dfrac{1}{0.5\,\mathrm{s}} = 2\,\mathrm{Hz}'
    note: 한 번 오가는 데 0.5초 걸리면 1초에 두 번 오가요.
  holds: 같은 모양이 되풀이되는 진동이면 무엇이든 맞아요.
  taughtIn: 9

- id: wave-speed-formula
  name: 파동의 속력
  tex: 'v = f\lambda'
  read: 파동의 속력 = 진동수 × 파장
  says: 한 주기 동안 파동은 파장 하나만큼 나아가요. 그래서 1초 동안 나아가는 거리는 1초에 진동하는 횟수 × 파장이에요.
  symbols: { v: velocity-v, f: frequency-f, lambda: wavelength-lambda, T: period-T }
  example:
    tex: '\lambda = \dfrac{v}{f} = \dfrac{340\,\mathrm{m/s}}{440\,\mathrm{Hz}} \approx 0.77\,\mathrm{m}'
    note: 피아노 '라' 음이 공기 속에서 만드는 파장이에요.
  holds: 매질이 정하는 속력 $v$는 그대로이고, 진동수 $f$는 소리를 내는 물체가 정해요. 매질이 바뀌면 $f$는 그대로, $v$와 $\lambda$가 바뀌어요.
  build:
    - { tex: 'v = \dfrac{\lambda}{T}', note: '한 주기 $T$ 동안 파장 $\lambda$만큼 나아가니까, 속력은 파장 ÷ 주기예요.' }
    - { tex: 'v = \lambda \times \dfrac{1}{T}', note: '나누기를 곱하기로 바꿔 써요.' }
    - { tex: 'v = f\lambda', note: '9강에서 $\dfrac{1}{T}$은 진동수 $f$였어요. 그래서 속력 = 진동수 × 파장이에요.' }
  taughtIn: 11

- id: oscillation-formula
  name: 진동하는 물체의 변위
  tex: 'y = A \sin\!\left(360^\circ \times \dfrac{t}{T}\right)'
  read: 변위 = 진폭 × sin(360° × 지난 시간 ÷ 주기)
  says: 원을 일정하게 도는 점의 높이처럼, 진동하는 물체의 변위도 사인 곡선을 따라요. 한 주기가 지나면 360°, 한 바퀴를 돈 셈이에요.
  symbols: { y: displacement-y, A: amplitude-A, t: time-t, T: period-T }
  example:
    tex: 'y = 5\,\mathrm{cm} \times \sin\!\left(360^\circ \times \dfrac{0.5\,\mathrm{s}}{2\,\mathrm{s}}\right) = 5\,\mathrm{cm} \times \sin 90^\circ = 5\,\mathrm{cm}'
    note: 진폭 5 cm, 주기 2초인 진동은 0.5초 뒤에 가장 높이 올라가요.
  holds: 가운데에서 위로 출발한 진동이에요. 다른 자리에서 출발하면 각도에 위상(12강)을 더해요.
  build:
    - { tex: '360^\circ \times \dfrac{t}{T}', note: '먼저 지금까지 몇 바퀴째인지를 각도로 바꿔요. 한 주기 $T$가 지나면 360°예요.' }
    - { tex: '\sin\!\left(360^\circ \times \dfrac{t}{T}\right)', note: '그 각도의 사인은 반지름 1인 원 위에서의 높이예요. −1과 1 사이예요.' }
    - { tex: 'y = A \sin\!\left(360^\circ \times \dfrac{t}{T}\right)', note: '반지름 대신 진폭 $A$를 곱하면 실제 변위 $y$가 돼요.' }
  taughtIn: 12

- id: double-slit-formula
  name: 이중 슬릿의 밝은 줄
  tex: 'd \sin\theta = m\lambda'
  read: 슬릿 간격 × sin(각도) = 번호 × 파장
  says: 두 슬릿에서 온 빛의 경로차가 파장의 정수배(0배, 1배, 2배 …)인 곳에서 두 빛이 같은 위상으로 만나 밝은 줄이 생겨요.
  symbols: { d: slit-d, theta: angle-theta, m: order-m, lambda: wavelength-lambda, L: screen-L, y: screen-y, Delta: delta }
  example:
    tex: '\Delta y = \dfrac{\lambda L}{d} = \dfrac{532 \times 10^{-9}\,\mathrm{m} \times 1.5\,\mathrm{m}}{0.2 \times 10^{-3}\,\mathrm{m}} \approx 4.0\,\mathrm{mm}'
    note: 초록 레이저(532 nm)로 만든 무늬의 간격이에요. 화면이 멀면 이웃한 밝은 줄 사이가 $\lambda L \div d$예요.
  holds: 화면이 슬릿보다 아주 멀고 각도가 작을 때 $\sin\theta \approx y \div L$로 바꿔 써요.
  build:
    - { tex: 'd \sin\theta', note: '화면의 한 점까지 두 슬릿에서 온 빛의 경로차예요.' }
    - { tex: 'd \sin\theta = m\lambda', note: '경로차가 파장의 $m$배(정수배)면 같은 위상으로 만나 밝아져요. $m$은 밝은 줄의 번호예요.' }
    - { tex: 'y_m = \dfrac{m \lambda L}{d}', note: '각도가 아주 작으면 $\sin\theta \approx y \div L$이라서, $m$번째 밝은 줄은 가운데에서 이만큼 떨어져 있어요.' }
  taughtIn: 16

- id: light-wave-formula
  name: 빛의 진동수와 파장
  tex: 'c = f\lambda'
  read: 빛의 속력 = 진동수 × 파장
  says: 진공에서 모든 빛은 같은 속력 $c$로 가니까, 파장을 알면 진동수를, 진동수를 알면 파장을 구할 수 있어요.
  symbols: { c: light-speed-c, f: frequency-f, lambda: wavelength-lambda }
  example:
    tex: 'f = \dfrac{c}{\lambda} = \dfrac{3 \times 10^8\,\mathrm{m/s}}{5 \times 10^{-7}\,\mathrm{m}} = 6 \times 10^{14}\,\mathrm{Hz}'
    note: 파장 500 nm인 초록빛은 1초에 600조 번 진동해요.
  holds: 진공(공기도 거의 같아요)에서 맞아요. 물이나 유리 속에서는 빛이 느려져서 $c$ 대신 그 속에서의 속력을 써요.
  taughtIn: 17

- id: standing-wave-formula
  name: 줄의 진동 모드
  tex: 'f_n = n\,\dfrac{v}{2L}'
  read: n번째 모드의 진동수 = 번호 × (줄 위 파동의 속력 ÷ 줄 길이의 2배)
  says: 양 끝이 묶인 줄에는 반 파장이 1개, 2개, 3개 … 들어가는 모양만 남아요. 그래서 진동수도 기본 진동의 1배, 2배, 3배 …만 나와요.
  symbols: { f: frequency-f, n: mode-n, v: velocity-v, L: string-L, lambda: wavelength-lambda }
  example:
    tex: 'f_1 = \dfrac{143\,\mathrm{m/s}}{2 \times 0.65\,\mathrm{m}} = 110\,\mathrm{Hz}'
    note: 기타의 다섯째 줄(라, 110 Hz)의 기본 진동이에요.
  holds: 양 끝이 묶이고 줄 위 파동의 속력이 일정할 때 맞아요.
  build:
    - { tex: '\lambda_n = \dfrac{2L}{n}', note: '길이 $L$에 반 파장이 $n$개 들어가니까, 파장은 $2L \div n$이에요.' }
    - { tex: 'f_n = \dfrac{v}{\lambda_n}', note: '11강의 $v = f\lambda$를 진동수에 대해 바꿔 써요.' }
    - { tex: 'f_n = n\,\dfrac{v}{2L}', note: '파장을 넣으면 진동수는 기본 진동 $\dfrac{v}{2L}$의 $n$배예요.' }
  taughtIn: 20

- id: coulomb-formula
  name: 쿨롱 법칙 (비례 관계)
  tex: 'F \propto \dfrac{q_1\,q_2}{r^2}'
  read: 전기력은 두 전하의 곱에 비례하고, 거리의 제곱에 반비례해요
  says: 전하가 클수록 힘이 세고, 멀어질수록 빠르게 약해져요. 거리가 2배면 힘은 4분의 1이에요.
  symbols: { F: force-F, q: charge-q, r: separation-r }
  example:
    tex: '\dfrac{F_{\text{거리 }3}}{F_{\text{거리 }1}} = \dfrac{1}{3^2} = \dfrac{1}{9}'
    note: 거리를 3배로 늘리면 힘은 9분의 1이 돼요.
  holds: $\propto$는 '비례한다'는 기호예요. 정확한 값을 구하려면 앞에 상수 하나를 곱해요(쿨롱 상수, 약 9 × 10⁹ N·m²/C²).
  build:
    - { tex: 'F \propto q_1\,q_2', note: '두 전하 $q_1$, $q_2$가 클수록 힘이 세요. 한쪽이 2배면 힘도 2배예요. 아래 작은 숫자는 첫째, 둘째라는 이름표예요.' }
    - { tex: 'F \propto \dfrac{1}{r^2}', note: '거리 $r$이 2배면 힘은 $2^2 = 4$분의 1이에요. 거리의 제곱에 반비례해요.' }
    - { tex: 'F \propto \dfrac{q_1\,q_2}{r^2}', note: '둘을 합치면 쿨롱 법칙이에요. $\propto$는 "비례한다"는 기호예요.' }
  taughtIn: 18
