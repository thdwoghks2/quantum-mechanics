    - { n: 42, title: 선 스펙트럼, note: "네온사인, 나트륨 가로등, 불꽃놀이 색. 태양에서 먼저 찾은 헬륨(1868)" }
    - { n: 43, title: 발머 공식, note: "숫자 속의 규칙(1885)" }
    - { n: 44, title: 보어 모형, note: "에너지 준위(1913). 계단과 경사로" }
    - { n: 45, title: 에너지 준위로 스펙트럼 계산하기, note: "뤼드베리 상수" }
    - { n: 46, title: 보어 모형의 성공과 한계, note: "프랑크-헤르츠 실험(1914)" }
- id: part-4
  number: 4
  title: 물질파
  summary: 전자도 파동처럼 행동한다
  lessons:
