# 전체 커리큘럼. 강 번호는 한 줄로 이어진다.
# 실제 레슨 파일(src/content/lessons)이 published면 그 강이 열리고, 없으면 "준비 중"으로 보인다.
- id: part-0
  number: 0
  title: 기초
  summary: 물리학이 세상을 다루는 방식과, 뒤에서 계속 쓰는 움직임·힘·에너지의 기본
  lessons:
    - { n: 1, title: 물리학이 하는 일, note: "관찰에서 규칙을 찾고, 그 규칙으로 예측해요. 모형이란 무엇일까요" }
    - { n: 2, title: 큰 수와 작은 수, note: "10의 거듭제곱으로 원자에서 우주까지의 크기를 적어요" }
    - { n: 3, title: 단위와 측정, note: "미터, 킬로그램, 초. 단위로 계산을 검산하고 어림해요" }
    - { n: 4, title: 속도와 가속도, note: "얼마나 빨리 움직이는지, 그 빠르기가 얼마나 빨리 바뀌는지 적어요" }
    - { n: 5, title: 힘과 운동 법칙, note: "힘은 속도를 바꿔요. F = ma" }
    - { n: 6, title: 에너지, note: "모습을 바꿔도 합은 그대로인 양. 운동 에너지와 위치 에너지" }
    - { n: 7, title: 운동량, note: "부딪혀도 합이 그대로인 양. 공을 받을 때 손을 당기는 까닭" }
    - { n: 8, title: 예측 가능한 세계, note: "지금을 정확히 알면 미래도 알 수 있을까요. 라플라스의 악마와 카오스" }
- id: part-1
  number: 1
  title: 파동과 빛
  summary: 진동에서 출발해 파동, 간섭, 빛, 전하, 전자기파, 정상파까지
  lessons:
    - { n: 9, title: 진동, note: "제자리에서 되풀이되는 움직임. 주기와 진동수" }
    - { n: 10, title: 파동, note: "물질이 아니라 흔들림이 전해져요" }
    - { n: 11, title: 파장과 속력, note: "파동의 속력 = 진동수 × 파장" }
    - { n: 12, title: 사인 함수로 파동 그리기, note: "원을 도는 점의 높이가 파동의 모양이 돼요. 위상" }
    - { n: 13, title: 중첩, note: "두 파동이 만나면 더해져요. 노이즈 캔슬링의 원리" }
    - { n: 14, title: 간섭, note: "두 파동의 박자가 맞으면 커지고, 어긋나면 사라져요" }
    - { n: 15, title: 회절, note: "파동은 틈을 지나며 퍼져요. 소리는 문 뒤로 돌아오고 빛은 곧게 가는 까닭" }
    - { n: 16, title: 영의 이중 슬릿 실험, note: "빛이 파동이라는 증거. 무늬 간격으로 빛의 파장을 재요" }
    - { n: 17, title: 빛의 색과 진동수, note: "빨간빛은 1초에 약 400조 번, 보랏빛은 약 750조 번 진동해요" }
    - { n: 18, title: 전하와 전기력, note: "전기를 띤 것끼리 밀고 당기는 힘. 거리가 2배면 힘은 4분의 1" }
    - { n: 19, title: 전자기파, note: "흔들리는 전하가 빛을 내요. 라디오에서 X선까지" }
    - { n: 20, title: 정상파와 진동 모드, note: "기타 줄에서 정해진 음만 나는 까닭" }
- id: part-2
  number: 2
  title: 열과 빛
  summary: 온도의 정체에서 출발해, 뜨거운 물체의 빛을 설명하다가 고전물리학이 막히는 곳까지. 그리고 에너지의 덩어리
  lessons:
    - { n: 21, title: 원자와 분자, note: "물질은 알갱이예요. 설탕이 물에 녹으면 어디로 갈까요" }
    - { n: 22, title: 원자는 정말 있을까, note: "브라운 운동과 아인슈타인(1905), 페랭(1908)" }
    - { n: 23, title: 온도의 정체, note: "온도는 분자들이 제멋대로 움직이는 평균 운동 에너지예요. 절대영도와 절대온도" }
    - { n: 24, title: 확률과 기댓값, note: "주사위 두 개의 합이 7이 자주 나오는 까닭. 확률과 기댓값" }
    - { n: 25, title: 볼츠만 분포, note: "에너지가 높은 상태일수록 드물어요. 높은 산의 공기가 옅은 까닭" }
    - { n: 26, title: 에너지 등분배, note: "온도가 같으면 에너지를 담는 자리마다 같은 평균 에너지를 가져요. 자유도" }
    - { n: 27, title: "열복사: 뜨거운 물체가 내는 빛", note: "전기난로, 리모컨, 열화상 카메라" }
    - { n: 28, title: 흑체와 별의 색, note: "붉은 베텔게우스와 푸른 리겔의 온도" }
    - { n: 29, title: "상자 속의 빛: 진동 모드 세기", note: "진동수가 높을수록 상자에 들어가는 진동 모드가 많아요" }
    - { n: 30, title: "고전 계산의 실패: 자외선 파탄", note: "계산대로라면 난로는 무한한 에너지를 내야 해요" }
    - { n: 31, title: "1900년, 물리학의 두 구름", note: "켈빈의 강연. 두 문제가 각각 상대성이론과 양자역학으로 이어져요" }
    - { n: 32, title: "플랑크의 가정: 덩어리로 오가는 에너지", note: "E = hf. 진동수가 높은 진동은 첫 덩어리도 받기 어려워요" }
    - { n: 33, title: h는 얼마나 작을까, note: "일상에서 에너지 덩어리가 보이지 않는 까닭" }
    - { n: 34, title: "광전 효과: 실험 사실", note: "태양전지와 자동문 센서" }
    - { n: 35, title: 광자, note: "아인슈타인(1905), 밀리컨의 검증(1916)" }
    - { n: 36, title: 광자의 운동량, note: "콤프턴 산란(1923). 빛으로 미는 태양 돛" }
- id: part-3
  number: 3
  title: 원자의 구조
  summary: 전자와 원자핵의 발견, 고전 원자의 위기, 선 스펙트럼과 보어 모형
  lessons:
