    - { n: 48, title: 보어 궤도를 정상파로 보기, note: "20강의 진동 모드와 44강의 에너지 준위를 잇는다" }
    - { n: 49, title: 전자 회절 실험, note: "데이비슨-거머(1927). 톰슨 부자의 두 노벨상" }
    - { n: 50, title: 전자 하나씩 쏘는 이중 슬릿, note: "토노무라(1989)" }
